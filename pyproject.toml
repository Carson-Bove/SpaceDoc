[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacedoc"
version = "0.1.0"
description = "Offline crew medical officer assistant with a verification layer (research prototype, not for clinical use)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
spacedoc = "spacedoc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spacedoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # Typer idiom; long strings are left to the formatter
