# SpaceDoc Phase 1 configuration. Paths are relative to this file.

llm_backend = "ollama"                       # "ollama" (native API) or "openai" (llama.cpp, LM Studio)
llm_base_url = "http://localhost:11434"      # for "openai", include /v1, e.g. http://localhost:8080/v1
chat_model = "qwen3:8b"                      # orchestrator; compare candidates with `spacedoc bench`
embed_model = "qwen3-embedding:0.6b"         # retrieval embeddings
checker_model = "bespoke-minicheck:7b"       # claim-vs-source grounding checker

# Generation (see docs/phase1-getting-started.md, "Context window and thinking").
chat_num_ctx = 12288        # Ollama's default of 4,096 is too small; must exceed prompt + draft_max_tokens
checker_num_ctx = 4096
think_draft = true          # thinking on for the first (reasoning) pass
think_finalize = false      # the second pass only inserts calculator results
draft_max_tokens = 6144     # thinking + JSON answer
finalize_max_tokens = 2048
review_max_tokens = 1024    # reasoning summaries for clinical review
seed = 42
request_timeout_s = 900   # per model call; up to 6,144 tokens at ~15-25 tokens/s is 4-7 min
keep_alive = "30m"         # keep models loaded between consult turns (Ollama default: 5m)
# Qwen3's recommended settings for each mode. Set all three keys if you change one.
sampling_thinking = { temperature = 0.6, top_p = 0.95, top_k = 20 }
sampling_plain = { temperature = 0.7, top_p = 0.8, top_k = 20 }

db_path = "spacedoc.db"
audit_path = "audit/audit.jsonl"

top_k = 6
embed_query_instruction = "Given a medical question from a spacecraft crew member, retrieve reference passages that answer it"
min_support_fraction = 0.5
consistency_samples = 1
default_tier = "T4"

# Consult mode (docs/consult-mode-design.md)
consult_max_tokens = 800        # one question turn (thinking off); keeps turns at ~10-15 s
consult_deep_max_tokens = 4096  # --deep-log: thinking notes + the JSON reply
consult_max_rounds = 8          # assess after this many rounds of questions
