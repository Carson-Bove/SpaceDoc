a brief fire that resulted from a faulty solid fuel oxygen generator. One crew member was burned and primarily sustained superficial injury however did have some blistering consistent with a partial thickness burn. These burns were treated in flight with ointment and gauze and reportedly the crew member recovered without any reported complications. Substantial work has been done to mitigate the risk of fire and no other significant burn events have been documented in flight. Superficial burns are likely to resolve without complication and require very minimal treatment. Most burn literature does not capture these injuries because they are so commonly treated at home with OTC medications and home remedies. Nonetheless, painful superficial burns may limit a crew members function with routine tasks or EVA and thus impact mission objectives. It should be noted that moderate/severe skin burn, inhalational injury, chemical skin burn, and chemical eye injury are separate conditions and discussed elsewhere.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.004647,"incidence_sd":0.00234,"incidence_text":"Mean 0.004647 and SD 0.00234","treated_best":{"probability_pct":[23.0,23.0],"cp1_ti_pct":100.0,"cp1_hours":0.23,"cp2_ti_pct":0.0,"cp2_hours":[48.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[77.0,77.0],"cp1_ti_pct":100.0,"cp1_hours":1.7,"cp2_ti_pct":6.51076,"cp2_hours":[168.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.23,"cp2_ti_pct":0.0,"cp2_hours":[48.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.7,"cp2_ti_pct":27.6641,"cp2_hours":[336.0,504.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"burn-moderate-to-severe-thermal","icl":"ICL22","name":"Burn - Moderate To Severe, Thermal","category":"Skin Injury","cliff":{"label":"Burn Moderate-Severe Thermal Skin CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/burn-moderate-to-severe-thermal-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Burn Moderate-Severe Thermal Skin CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/burn-moderate-to-severe-thermal-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Superficial burns occur when thermal stress is applied to skin and induce cell death of the epidermis. Burns can be classified based on the depth of tissue involved and range from superficial to full thickness burn. Burns typically follow a predictable course of healing and can be self limited or life threatening. Complications from burns commonly include infection, chronic pain, and permanent physical disfigurement or functional loss. Any of these complications may have significant impacts on mission objectives and crew safety. Risk of skin and soft tissue infection in flight appears to be much higher than terrestrially which makes any large soft tissue injury concerning. Thermal burn can occur from direct heat from an object or surface, scald from a hot liquid, and/or from open fire. During the Mir program there was a brief fire that resulted from a faulty solid fuel oxygen generator. One crew member was burned and primarily sustained superficial injury however did have some blistering consistent with a partial thickness burn. These burns were treated in flight with ointment and gauze and reportedly the crew member recovered without any reported complications. Substantial work has been done to mitigate the risk of fire and no other significant burn events have been documented in flight. Moderate to severe burns can be extremely dangerous to crew health. The size and depth of a burn is directly correlated with morbidity and mortality. Burns involving greater than 20% of the total body surface area (%TBSA) have an exponential increase in risk of death. The standard of care for a moderate to severe burn requires transfer to a burn center for wound care, surgery, and skin grafting. More severe burns require intensive care including respiratory and blood pressure support. A severe burn in space flight has the potential to be a devastating and life threatening injury to an otherwise healthy crew member. It should be noted that minor skin burn, inhalational injury, chemical skin burn, and chemical eye injury are separate conditions and discussed elsewhere.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0004168,"incidence_sd":2.099,"incidence_text":"Mean 4.168E-4 and SD 2.099E- 4.","treated_best":{"probability_pct":[84.0,84.0],"cp1_ti_pct":100.0,"cp1_hours":2.58,"cp2_ti_pct":29.046,"cp2_hours":[504.0,1440.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,10.0],"locl_pct":[0.0,5.9]},"treated_worst":{"probability_pct":[16.0,16.0],"cp1_ti_pct":100.0,"cp1_hours":2.0,"cp2_ti_pct":55.0093,"cp2_hours":[1440.0,8760.0],"cp3_ti_pct":10.0186,"rtdc_pct":[100.0,100.0],"locl_pct":[12.8,32.3]},"untreated_best":{"cp1_hours":2.58,"cp2_ti_pct":63.274,"cp2_hours":[600.0,2400.0],"cp3_ti_pct":60.1648,"rtdc_pct":[0.0,25.0],"locl_pct":[0.0,12.8]},"untreated_worst":{"cp1_hours":2.0,"cp2_ti_pct":100.0,"cp2_hours":[1440.0,17520.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[25.0,50.0]},"extraction":"automatic"}},{"cliff_id":"cerebrovascular-accident","icl":"ICL23","name":"Cerebrovascular Accident","category":"Neurological Conditions","cliff":{"label":"Cerebrovascular Accident CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/cerebrovascular-accident-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Stroke (Cerebrovascular Accident) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/stroke-cerebrovascular-accident-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Cerebrovascular Accident CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/cerebrovascular-accident-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"A Cerebrovascular Accident is the sudden impairment or loss of consciousness, sensation, and voluntary motion that is caused by rupture or obstruction (as by a clot) of a blood vessel supplying the brain, and is accompanied by permanent damage of brain tissue. Symptoms of stroke include numbness or weakness on one side of the body or face, confusion, impaired speech or vision, loss of coordination or balance, trouble walking, or severe headache.(Merriam-Webster Medical Dictionary, 2021). About 87% of all strokes are ischemic, and defined as when a vessel supplying blood to the brain is obstructed. A hemorrhagic stroke is defined as when a weakened vessel ruptures and bleeds into the surrounding brain which then accumulates and may compress the surrounding brain tissue. 13% of strokes are hemorrhagic (of which 10% are intracerebral (ICH) and 3% are subarachnoid (SAH) (American Stroke Association [AHA], 2021). A Transient ischemic attack (TIA) is a brief episode of cerebral ischemia that is usually characterized by temporary blurring of vision, slurring of speech, numbness, paralysis, or syncope and is often predictive of a serious stroke (Merriam-Webster Medical Dictionary, 2021). It is worth noting that micro-gravity encourages a cephalad fluid shift. It is unclear whether this increases intracranial pressure, but studies have shown that it does at least increase intraocular pressure; often well into ranges usually associated with glaucoma, and also intrajugular venous pressure. Therefore one might expect a hemorrhagic stroke in microgravity to have a worse outcome than in Earth gravity.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0002259,"incidence_sd":2.247,"incidence_text":"mean 2.259E-4 and SD 2.247E- 4","treated_best":{"probability_pct":[33.0,33.0],"cp1_ti_pct":100.0,"cp1_hours":0.9,"cp2_ti_pct":54.4823,"cp2_hours":[0.03,24.0],"cp3_ti_pct":9.11507,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,1.2]},"treated_worst":{"probability_pct":[67.0,67.0],"cp1_ti_pct":100.0,"cp1_hours":0.9,"cp2_ti_pct":73.4122,"cp2_hours":[4320.0,12960.0],"cp3_ti_pct":46.8243,"rtdc_pct":[100.0,100.0],"locl_pct":[4.9,10.0]},"untreated_best":{"cp1_hours":0.9,"cp2_ti_pct":54.4823,"cp2_hours":[0.03,24.0],"cp3_ti_pct":9.11507,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,1.2]},"untreated_worst":{"cp1_hours":0.9,"cp2_ti_pct":100.0,"cp2_hours":[4320.0,12960.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[16.5,19.2]},"extraction":"automatic"}},{"cliff_id":"cerumen-impaction","icl":"ICL24","name":"Cerumen Impaction","category":"Otolaryngological Conditions","cliff":{"label":"Cerumen Impaction CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/cerumen-impaction-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Cerumen Impaction CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/cerumen-impaction-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Cerumen (earwax) impaction is a common and often benign medical complication but can be accompanied by more serious symptoms including aural fullness, hearing loss, ear pain, tinnitus (ringing in the ears), and increase risk of otitis externa (ear infection). It occurs when the natural clearing process is impaired and often is iatrogenic in that cotton swabs or digital manipulation can pack cerumen deep into the ear canal. Irrigation of the ear canal and cerumenolytics are common therapies which are also performed with ease terrestrially, however, may be more complicated in a microgravity setting. Manual removal may be required, however is associated with elevated risks of canal laceration or eardrum perforation (Horton et. al., 2020).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0268,"incidence_sd":2.358e-05,"incidence_text":"mean 0.0268 SD 2.358E-5","treated_best":{"probability_pct":[90.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":0.533,"cp2_ti_pct":100.0,"cp2_hours":[0.25,0.36],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,10.0],"cp1_ti_pct":100.0,"cp1_hours":1.416,"cp2_ti_pct":100.0,"cp2_hours":[0.25,0.36],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.533,"cp2_ti_pct":0.0,"cp2_hours":[120.0,336.0],"cp3_ti_pct":1.17,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.416,"cp2_ti_pct":27.9298,"cp2_hours":[120.0,336.0],"cp3_ti_pct":27.93,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"choking-obstructed-airway","icl":"ICL25","name":"Choking/Obstructed Airway","category":"Otolaryngological Conditions","cliff":{"label":"Choking/Obstructed Airway CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/choking-obstructed-airway-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Choking/Obstructied Airway CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/choking-obstructed-airway-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Choking/Obstructed Airway CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/choking-obstructed-airway-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"“Foreign body aspiration can be a life-threatening emergency. An aspirated object may lodge in the larynx or trachea. If the object is large enough to cause near or complete obstruction of the airway, asphyxia may rapidly cause death. Lesser degrees of obstruction or passage of the obstructive object beyond the carina can result in less severe signs and symptoms.” (Warshawsky, 2020) These can result in recurrent infections. Objects that descend beyond the trachea are more often found in the right endobronchial tree than in the left. (Warshawsky, 2020) “Possible mechanisms for choking and obstructed airway on orbit may include food that is partially swallowed that, due to microgravity, obstructs or irritates the upper airway. During exercise or while working near small floating objects, they may be inhaled. Also talking or laughing while eating or drinking may increase the risk of choking or obstructed airway.” (NASA, Choking/Obstructed Airway CLiFF, 2017)","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.06589,"incidence_sd":0.03826,"incidence_text":"Mean: 0.06589 SD 0.03826","treated_best":{"probability_pct":[98.8,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.06,"cp2_ti_pct":50.0,"cp2_hours":[0.008,0.2],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,1.2],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":50.0,"cp2_hours":[0.02,360.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,18.0],"locl_pct":[0.0,93.0]},"untreated_best":{"cp1_hours":0.06,"cp2_ti_pct":50.0,"cp2_hours":[0.008,0.2],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.5,"cp2_ti_pct":100.0,"cp2_hours":[0.17,85440.0],"cp3_ti_pct":100.0,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,100.0]},"extraction":"automatic"}},{"cliff_id":"cholelithiasis-biliary-colic-acute","icl":"ICL26","name":"Cholelithiasis/Biliary Colic, Acute","category":"Gastrointestinal Conditions","cliff":{"label":"Acute Cholesystitis Biliary Colic CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/cholelithiasis-biliary-colic-acute-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Cholelithiasis – Biliary Colic CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/cholelithiasis-biliary-colic-acute-peer-review.pdf","list":"cliff119_2023"},"summary":"Acute cholecystitis is acute inflammation of the gallbladder, most commonly associated with obstruction of the cystic duct by gallstones or biliary sludge. Risk factors include female gender, obesity, hormone replacement therapy, severe hypertriglyceridemia, sickle cell disease, obesity surgery, sudden and significant weight loss, and gallbladder carcinoma. Acute cholecystitis may result in complications if not identified and treated promptly. Common disease-related complications can include severe sepsis, gangrenous cholecystitis, and gallbladder perforation with resultant bile peritonitis. Up to 18% of men and 25% of women have gallstones and most are asymptomatic [i.e. free of biliary colic] . A small number with gallstones (about 1.5% per year) will be treated for gallstone-related complications or symptoms. Gallstones may cause severe epigastric or right upper quadrant pain, acute cholecystitis, acute cholangitis, or gallstone pancreatitis. . While gallbladder cancer is rare, gallstones are a risk factor for this malignancy. Acalculous cholecystitis is gallbladder inflammation without stones and is seen primarily in critically ill patients. It requires a high degree of clinical suspicion, is difficult to diagnose, and is associated with a high mortality rate. There have not been any cases of biliary colic or cholecystitis reported in flight. In comparing these closely related conditions, biliary colic and cholecystitis share a spectrum of symptoms and no exact time course or definition exists to separate them, although based off of a systematic review by (Sanders, 2007), biliary colic pain lasts approximately less than 8 hours and acute cholecystitis pain lasts approximately greater than 8 hours. Further, a meta-analysis performed by (Colli, 2012) utilized a 2 hour interval to measure successful medical management of biliary pain with NSAIDs. An article published in UpToDate by (Zakko, 2021) notes that biliary colic pain lasts for at least 30 minutes. Therefore, it was estimated that biliary colic presents in a minimum window of 0.5 hours and a maximum window of 8 hours. Once the signs and symptoms of biliary colic last beyond 8 hours, the crew member is likely experiencing acute cholecystitis. About 10 to 15% of the adult Western population will develop asymptomatic gallstones over the course of their lifetime (Halldestam, 2004; Sanders, 2007; Zakko, 2021). (Zakko, 2021) puts the annual incidence of gallstone diagnosis in America at 1 million persons per year, which we may interpret as roughly equating to an 0.6%, all-inclusive annual risk of Cholecystitis-- likely a gross over-estimate in an astronaut population clinically screened for Cholecystitis and generally absent of risk factors. We estimate the annual ‘complication’ rate from Cholecystitis, i.e. an RTDC-surrogate of hospitalization, at 1.5% per year (Halldestam, 2004).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":1.266,"incidence_sd":4.65e-06,"incidence_text":"7.69E-4 and SD 4.65E-6 for males; mean 1.266E- 3 and SD 7.683E-6 for","treated_best":{"probability_pct":[75.0,75.0],"cp1_ti_pct":100.0,"cp1_hours":1.456,"cp2_ti_pct":9.73957,"cp2_hours":[0.5,7.5],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[25.0,25.0],"cp1_ti_pct":100.0,"cp1_hours":1.29,"cp2_ti_pct":50.0,"cp2_hours":[8.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,2.1]},"untreated_best":{"cp1_hours":1.456,"cp2_ti_pct":25.7109,"cp2_hours":[1.0,8.0],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.29,"cp2_ti_pct":100.0,"cp2_hours":[8.0,240.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,20.0]},"extraction":"automatic"}},{"cliff_id":"dental-abscess","icl":"ICL28","name":"Dental Abscess","category":"Dental Injury","cliff":{"label":"Dental Abscess CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-abscess-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Dental Abscess CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-abscess-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Dental Abscess CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-abscess-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"There are multiple types of isolated dental abscesses. Gingival abscesses occur between the gums and the teeth. Periodontal abscesses occur in diseased gums in periodontal pockets, between the gum and the tooth, below the enamel of the tooth. Periapical and apical abscesses occur at or near the tip of the root of the tooth. These are typically the most severe. Finally, pericoronal abscesses occur around impacted or partially erupted teeth. (Vilardi, 2017; Nguyen and Martin, 2008; Herrera et al, 2000; Hodapp and Jeske, 2020). The acute apical/periapical dental abscess typically arises secondary to dental caries, trauma, or failed root treatment. After the intact pulp chamber is breached, colonization of the root canals occurs with a diverse mix of anaerobic bacteria (Robertson and Smith, 2009). While asymptomatic necrosis is common, abscess formation occurs when these bacteria and their toxic products enter the periapical tissues via the apical foramen and induce acute inflammation and pus formation (Nair, 2004). The main signs and symptoms of the acute apical/periapical dental abscess are pain, swelling, erythema and suppuration usually localized to the affected tooth. The abscess can frequently spread causing a spreading odontogenic infection which can be accompanied by sepsis syndrome (Robertson, 2009). Note that Sepsis is a separate CLiFF and will not be addressed as a sequela of dental abscess in this CLiFF. Terrestrially, the vast majority of dental abscesses respond to surgical treatment, such as drainage of pus and elimination of the source of infection, with antibiotic use limited to severe spreading infections. A dental emergency has not occurred among US astronauts in flight (Hodapp and Jeske, 2020).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.006718,"incidence_sd":0.003371,"incidence_text":"Mean: 0.006718 SD: 0.003371","treated_best":{"probability_pct":[29.0,29.0],"cp1_ti_pct":100.0,"cp1_hours":0.93,"cp2_ti_pct":7.36115,"cp2_hours":[72.0,168.0],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[71.0,71.0],"cp1_ti_pct":100.0,"cp1_hours":1.43,"cp2_ti_pct":18.177,"cp2_hours":[72.0,211.2],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,26.0],"locl_pct":[0.1,0.48]},"untreated_best":{"cp1_hours":0.93,"cp2_ti_pct":42.9445,"cp2_hours":[72.0,168.0],"cp3_ti_pct":42.9445,"rtdc_pct":[0.0,26.0],"locl_pct":[0.1,0.48]},"untreated_worst":{"cp1_hours":1.43,"cp2_ti_pct":42.9445,"cp2_hours":[72.0,504.0],"cp3_ti_pct":42.9445,"rtdc_pct":[0.0,100.0],"locl_pct":[10.0,40.0]},"extraction":"automatic"}},{"cliff_id":"dental-crown-loss","icl":"ICL29","name":"Dental Crown Loss","category":"Dental Injury","cliff":{"label":"Dental Cross Loss CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-crown-loss-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Dental Cross Loss CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-crown-loss-cliff.pdf","list":"cliff100"},"summary":"Over 60% of all restorative dentistry involves the replacement of restorations. The most common reasons for crown replacement were crown fracture and tooth fracture, followed by esthetics and secondary caries. The UK Adult Dental Health Survey in 1998 identified people aged 45-54 as having the most crowns with nearly half of that age group having at least one crown. (Wilson et al, 2003). Dislodgement of crowns due to vibrations associated with the acceleration forces during launch have been reported by the Russian space program (Hodapp and Jeske, 2020). In the US Space Program, there has been one anecdotal, published report, of a dental crown displacement during the Shuttle era that was successfully treated with the onboard medical supplies (Hodapp and Jeske, 2020). It is recommended that on flights with less than 3 months remaining, if the tooth is asymptomatic after crown loss, that the crown be stored and replaced after landing. This is due to the risk of discomfort secondary to incorrect replacement as well as aspiration, should the crown become dislodged. On exploration missions lasting longer than 3 months, the protocol is to re- cement the crown with temporary cement. (Hodapp and Jeske, 2020)","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.01639,"incidence_sd":0.0163,"incidence_text":"Mean 0.01639 SD 0.0163","treated_best":{"probability_pct":[62.96,62.96],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":0.0,"cp2_hours":[0.0,48.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[37.04,37.04],"cp1_ti_pct":100.0,"cp1_hours":1.35,"cp2_ti_pct":19.0938,"cp2_hours":[1.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.0,"cp2_ti_pct":9.11507,"cp2_hours":[0.0,35040.0],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.35,"cp2_ti_pct":38.1876,"cp2_hours":[1.0,52560.0],"cp3_ti_pct":38.1876,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"dental-filling-loss","icl":"ICL30","name":"Dental Filling Loss","category":"Dental Injury","cliff":{"label":"Dental Filling Loss CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-filling-loss-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Dental Filling Loss CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-exposed-pulp-cliff.pdf","list":"cliff100"},"summary":"Over 60% of all restorative dentistry involves the replacement of restorations. (Wilson, 2003). Materials to place fillings in-flight have been flown on ISS (Hodapp and Jeske, 2020) but there have been no documented reports of filling-loss inflight.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.07184,"incidence_sd":0.003998,"incidence_text":"Mean: 0.07184 SD: 0.003998","treated_best":{"probability_pct":[59.0,83.1],"cp1_ti_pct":100.0,"cp1_hours":0.66,"cp2_ti_pct":0.0,"cp2_hours":[0.0,0.5],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[16.9,41.0],"cp1_ti_pct":100.0,"cp1_hours":0.66,"cp2_ti_pct":5.60723,"cp2_hours":[0.5,1.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.66,"cp2_ti_pct":0.0,"cp2_hours":[0.0,0.5],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.66,"cp2_ti_pct":26.8934,"cp2_hours":[0.5,120.0],"cp3_ti_pct":26.8933,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"dental-fracture-exposed-pulp","icl":"ICL31","name":"Dental Fracture/Exposed Pulp","category":"Dental Injury","cliff":{"label":"Dental Exposed Pulp CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-fracture-exposed-pulp-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Dental Filling Loss CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-exposed-pulp-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Dental Fracture/Exposed Pulp CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-fracture-exposed-pulp-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Pulpitis is an inflammation of the dental pulp resulting from untreated caries, trauma, or multiple restorations. Its principal symptom is pain. Pressure necrosis frequently results from this form of exposed pulp and can be complicated by persistent pain and periapical abscess. (Merck Manual, 2008) Due to required dental examinations and care before flight, untreated caries is an unlikely etiology. A more likely mechanism on orbit would be due to damage to pre-existing restorations or dental trauma. Treatment is available on orbit with topical and systemic analgesics, instruments in a toothache kit (Red Cross, and antibiotics. (International Space Station Integrated Medical Group, 2006)","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0211,"incidence_sd":0.002714,"incidence_text":"mean 0.0211 and SD 0.002714","treated_best":{"probability_pct":[75.0,75.0],"cp1_ti_pct":100.0,"cp1_hours":1.083,"cp2_ti_pct":0.0,"cp2_hours":[0.0,1.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[25.0,25.0],"cp1_ti_pct":100.0,"cp1_hours":1.083,"cp2_ti_pct":13.4467,"cp2_hours":[0.0,3.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,1.42],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.083,"cp2_ti_pct":26.8934,"cp2_hours":[0.0,1.0],"cp3_ti_pct":26.8934,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.083,"cp2_ti_pct":38.1876,"cp2_hours":[1.5,168.0],"cp3_ti_pct":38.1876,"rtdc_pct":[0.0,1.42],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"dental-luxation-avulsion-tooth-loss","icl":"ICL32","name":"Dental Luxation/Avulsion (Tooth Loss)","category":"Dental Injury","cliff":{"label":"Dental Luxation/Avulsion (Tooth Loss) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-luxation-avulsion-tooth-loss-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Dental Avulsion (Tooth Loss) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-avulsion-tooth-loss-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Dental Luxation Avulsion CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dental-luxation-avulsion-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Dental luxation and avulsion are both complications of traumatic dental injuries (TDI) that are more likely to occur in pediatric and adolescent populations and are more likely in males. Dental fracture is the other TDI that is covered in a separate clinical finding form. Luxation can be classified into various types by the degree of displacement (i.e. concussion, subluxation, lateral luxation, extrusion, intrusion) and if the tooth is completely knocked out—avulsion [Goswami 2020]. Various factors such as force and direction of impact, shape and resilience, direction of the impacting object, and the reaction of surrounding tissues determine the extent of damage. Terrestrial complications include pulp canal obliteration, pulp necrosis, repair-related resorption, infection-related resorption, ankylosis-related resorption, or premature tooth loss. Terrestrial treatment options include monitoring (74%), splinting (14%), extraction (5%), and installation of a prosthesis (7%) [Assuncao 2011]. During spaceflight, though luxation/avulsion has never occurred before, the standard of care has been for expectant management without splinting or reimplantation of the avulsed tooth with symptom control including pain management and bleeding control.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean": r dislocations can be associated with damage to surrounding tissues (fractures, labral tears, and neurovascular injuries).","applicability":{"incidence_type":"EVA","segment":"EVA Surface","envs":["T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":1.34e-07,"incidence_sd":7.87e-09,"incidence_text":"mean 1.34E-07 SD 7.87E-09","treated_best":{"probability_pct":[77.0,77.0],"cp1_ti_pct":100.0,"cp1_hours":1.37,"cp2_ti_pct":19.333,"cp2_hours":[24.0,720.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[23.0,23.0],"cp1_ti_pct":100.0,"cp1_hours":1.45,"cp2_ti_pct":19.333,"cp2_hours":[2016.0,2880.0],"cp3_ti_pct":0.0,"rtdc_pct":[10.0,48.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.37,"cp2_ti_pct":31.7699,"cp2_hours":[24.0,720.0],"cp3_ti_pct":21.0205,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.45,"cp2_ti_pct":55.3415,"cp2_hours":[2016.0,2880.0],"cp3_ti_pct":21.0205,"rtdc_pct":[10.0,48.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"diverticulitis-acute","icl":"ICL35","name":"Diverticulitis, Acute","category":"Gastrointestinal Conditions","cliff":{"label":"Acute Diverticulitis CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/diverticulitis-acute-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Acute Diverticulitis CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-diverticulitis-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Diverticulitis CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/diverticulitis-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Wilkins et al, 2013 provides the following overview of acute diverticulitis terrestrially: “Uncomplicated diverticulitis is localized diverticular inflammation, whereas complicated diverticulitis is diverticular inflammation associated with an abscess, phlegmon, fistula, obstruction, bleeding, or perforation. Patients with acute diverticulitis may present with left lower quadrant pain, tenderness, abdominal distention, and fever. Other symptoms may include anorexia, constipation, nausea, diarrhea, and dysuria. Initial laboratory studies include a complete blood count, basic metabolic panel, urinalysis, and measurement of C-reactive protein. Computed tomography, the most commonly performed imaging test, is useful to establish the diagnosis and the extent and severity of disease, and to exclude complications in selected patients. Colonoscopy is recommended four to six weeks after resolution of symptoms for patients with complicated disease or for another indication, such as age-appropriate screening. In mild, uncomplicated diverticulitis, antibiotics do not accelerate recovery, or prevent complications or recurrences. Hospitalization should be considered if patients have signs of peritonitis or there is suspicion of complicated diverticulitis. Inpatient management includes intravenous fluid resuscitation and intravenous antibiotics. Patients with a localized abscess may be candidates for computed tomography–guided percutaneous drainage. Fifteen to 30 percent of patients admitted with acute diverticulitis require surgical intervention during that admission. Laparoscopic surgery results in a shorter length of stay, fewer complications, and lower in-hospital mortality compared with open colectomy. The decision to proceed to surgery in patients with recurrent diverticulitis should be individualized and based on patient preference, comorbidities, and lifestyle. Interventions to prevent recurrences of diverticulitis include increased intake of dietary fiber, exercise, cessation of smoking, and, in persons with a body mass index of 30 kg per m or higher, weight loss.”","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.001616,"inciden  as sneezing and sore throat may occur (Cain, 2010). Consisting of over 50% of chemically reactive silica oxide, chronic inhalation of these dusts can result in progressive silicosis-like respiratory disease. Measures such as the use of \"double shell spacesuits\", extracting airborne dust particles in the airlock, and \"suit ports\" can help diminish impact of dust from spacesuits in terms of astronaut direct exposure to these potentially hazardous dusts (Kennedy and Harris, 1992).","applicability":{"incidence_type":"EVA","segment":"EVA Surface","envs":["T3"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_text":"1 per EVA","treated_best":{"probability_pct":[99.9996,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.81,"cp2_ti_pct":1.925,"cp2_hours":[1.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0004,0.0004],"cp1_ti_pct":100.0,"cp1_hours":0.81,"cp2_ti_pct":15.3069,"cp2_hours":[168.0,1344.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,30.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.81,"cp2_ti_pct":4.73,"cp2_hours":[2.0,48.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.81,"cp2_ti_pct":34.795,"cp2_hours":[336.0,4368.0],"cp3_ti_pct":35.98,"rtdc_pct":[30.0,70.0],"locl_pct":[0.0,30.0]},"extraction":"automatic"}},{"cliff_id":"dust-exposure-lunar-eva-habitat","icl":"ICL36B","name":"Dust Exposure - Lunar (EVA Habitat)","category":"Thermal/Environmental Illness","cliff":{"label":"Lunar Dust Exposure (EVA/Habitat) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/dust-exposure-lunar-eva-habitat-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Lunar Dust Exposure CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/lunar-dust-exposure-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Lunar dusts are generally defined as particles from the moon that are less then 20 um in size (Liu and Taylor, 2011). During exploratory activity on the moon surface, generated airborne lunar dust will adhere to the astronaut's suit. While removing their suits in the spacecraft, dusts will be released into the atmosphere, making astronauts susceptible to lunar dust exposure. Exposure to lunar dust can potentially result in health hazards. Being highly abrasive, lunar dusts can cause dermatitis and eye injury with skin and eye exposure. Lunar dust contains very small particles (<10um) that can cause respiratory disease if inhaled. In mild cases, allergic reactions such as sneezing and sore throat may occur (Cain, 2010). Consisting of over 50% of chemically reactive silica oxide, chronic inhalation of these dusts can result in progressive silicosis-like respiratory disease. Measures such as the use of \"double shell spacesuits\", extracting airborne dust particles in the airlock, and \"suit ports\" can help diminish impact of dust from spacesuits in terms of astronaut direct exposure to these potentially hazardous dusts (Kennedy and Harris, 1992).","applicability":{"incidence_type":"EVA","segment":"EVA Habitat","envs":["T3"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_text":"0.75 for non-EVA crewmembers","treated_best":{"probability_pct":[99.9996,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.81,"cp2_ti_pct":1.925,"cp2_hours":[1.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0004,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.81,"cp2_ti_pct":15.3069,"cp2_hours":[168.0,1344.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,30.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.81,"cp2_ti_pct":4.73,"cp2_hours":[2.0,48.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.81,"cp2_ti_pct":34.795,"cp2_hours":[336.0,4368.0],"cp3_ti_pct":35.98,"rtdc_pct":[30.0,70.0],"locl_pct":[0.0,30.0]},"extraction":"automatic"}},{"cliff_id":"ebullism","icl":"ICL37","name":"Ebullism","category":"Thermal/Environmental Illness","cliff":{"label":"Ebullism CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/ebullism-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Ebullism CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/ebulism-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Ebullism occurs when body tissue is exposed to ambient pressure less than the vapor pressure of water at human body temperature (47mmHg). In the context of spaceflight, this would occur with a failure of the pressure containment layers of the habitat, spacecraft, or spacesuit. Since a vehicle or habitat failure would be catastrophic and not likely survivable, this condition refers only to the chance of Ebullism occurring from suit failures while on EVA.","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_text":"Fixed Incidence Proportion of 0.00001025","treated_best":{"probability_pct":[33.0,33.0],"cp1_ti_pct":100.0,"cp1_hours":1.75,"cp2_ti_pct":19.4526,"cp2_hours":[4.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[67.0,67.0],"cp1_ti_pct":100.0,"cp1_hours":1.75,"cp2_ti_pct":50.0,"cp2_hours":[336.0,672.0],"cp3_ti_pct":0.0,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,84.0]},"untreated_best":{"cp1_hours":1.75,"cp2_ti_pct":19.4526,"cp2_hours":[4.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.75,"cp2_ti_pct":100.0,"cp2_hours":[336.0,672.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[100.0,100.0]},"extraction":"automatic"}},{"cliff_id":"epistaxis","icl":"ICL38","name":"Epistaxis","category":"Otolaryngological Conditions","cliff":{"label":"Epistaxis CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/epistaxis-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Epistaxis CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/epistaxis-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Epistaxis, or nosebleeds, are regular events and often do not require medical treatment. Only six percent of people who experience an epistaxis event will ever seek additional expertise (Seikaly, 2021). Although nearly all nosebleeds will resolve with minimal involvement, the severity of the bleed can be complicated by the location, coagulation abnormalities, platelet dysfunction, and cardiovascular disease. Most bleeds are ‘anterior bleeds’ and occur along the septum from the Kiesselbach plexus in Little’s area. This vascular supply is formed by terminal branches of the internal carotid artery and external carotid artery. Anterior bleeds are typically simpler to manage as the area is visible and compressible. Frequently, nasal compression and topical vasoconstrictors are all that is necessary; albeit cauterization, topical hemostasis agents and anterior packs are commonly used as well. Posterior bleeds comprise of 10-20% of cases and occur along the posterior septum, the lateral nasal wall, or the nasal floor (Krulewitz et al., 2019). These areas are supplied by the sphenopalatine and ascending pharyngeal arteries and often result in brisk bleeds warranting immediate intervention to prevent aspiration and hemorrhagic shock (Womack et al, 2018). Posterior packing is painful both upon insertion and in situ. This type of packing is associated with a higher risk of complications such as otitis media, sinusitis, pressure necrosis, airway obstruction, vagal nerve stimulation, cavernous sinus thrombosis, and toxic shock syndrome (Feusi et al., 2005; Morgan et al. 2014). There have been several epistaxis events in spaceflight. Nosebleeds occurring in the first five days of a mission are associated with space adaptation epistaxis. These are typically attributed to the cephalad fluid shift secondary to increased blood volume and intravascular pressure (Barratt et al., 2019). Space adaption epistaxis is covered separately in another CLiFF. Events that occur after five days are covered in this condition and can be attributed to the low relative humidity of the mission craft, overuse of decongestants, trauma, sinusitis or upper respiratory infections.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_sd":0.05823,"incidence_text":"0.1161 person- years SD: 0.05823","treated_best":{"probability_pct":[95.0,95.0],"cp1_ti_pct":100.0,"cp1_hours":0.56,"cp2_ti_pct":6.655,"cp2_hours":[0.0833333,0.58],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[5.0,5.0],"cp1_ti_pct":100.0,"cp1_hours":1.12,"cp2_ti_pct":50.0,"cp2_hours":[24.0,96.0],"cp3_ti_pct":0.0,"rtdc_pct":[5.6,18.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.56,"cp2_ti_pct":6.655,"cp2_hours":[0.0833333,0.58],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.12,"cp2_ti_pct":100.0,"cp2_hours":[24.0,912.0],"cp3_ti_pct":100.0,"rtdc_pct":[18.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eva-related-decompression-sickness","icl":"ICL39","name":"Eva Related Decompression Sickness","category":"Thermal/Environmental Illness","cliff":{"label":"EVA-Related Decompression Sickness CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-decompression-sickness-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Decompression Sickness (Secondary to EVA) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/decompression-sickness-secondary-to-extravehicular-activity-cliff.pdf","list":"cliff100"},"peer_review":{"label":"EVA-Related Decompression Sickness CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-decompression-sickness-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Decompression Sickness (DCS) is caused by evolved gas bubbles which form when living tissues are subjected to reductions in environmental pressure. Such reductions in pressure can occur during decompression prior to EVA in space. Before decompression, nitrogen (N2) is dissolved in the body tissues and fluids at a partial pressure of the N2 in a normal human breathing mixture. Nitrogen supersaturation occurs in the tissues and fluids during decompression as the environmental pressure is reduced more rapidly than the tissue pressure of N2. When the magnitude and rate of environmental pressure reductions are sufficient, supersaturation with N2 can lead to the transition of N2 from the dissolved phase into the gas phase as gas emboli. Various clinical symptoms of altitude DCS are thought to result mainly from physical interactions of gas bubbles with tissues and fluids. Size and location of these bubbles are thought to have a significant effect on the resulting DCS symptoms. Gas bubbles deform tissues and interact with nerve endings or block microcirculation. In addition, bubbles interacting with lung tissue may release various mediators resulting in systemic symptoms. The resulting symptoms include pain, sensory deprivation, skin manifestations, and respiratory distress. Risk of DCS increases with extended altitude exposure times, very high altitudes, and greater physical activity during the exposure. The risk decreases with preoxygenation, particularly when combined with exercise. (Conkin, 2004). In spaceflight the greatest risk for DCS occurs during EVA due to the decreased pressure used in the EVA suit as compared to the primary vehicle. Symptoms would be expected to occur during the EVA. Terrestrially, DCS is typically broken into 2 categories: Type I or “pain only” DCS and Type II which involves neurologic manifestations and/or cutaneous involvement (Conkin, 2020). In spaceflight 4 Cuff Classes (so named because the criteria reside on the cuff of the EVA suit for ease of access) are used to delineate the symptoms of DCS. Cuff Classes 1 and 2 correlate to Type 1 DCS, Cuff Class 3 could represent either Type 1 or Type 2 depending on symptom involvement, and Cuff Class 4 correlates to Type 2 DCS.","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.03329,"incidence_sd":0.008851,"incidence_text":"Mean: 0.03329 SD: 0.008851","treated_best":{"probability_pct":[94.4,94.4],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":22.8275,"cp2_hours":[0.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[5.6,5.6],"cp1_ti_pct":100.0,"cp1_hours":1.5,"cp2_ti_pct":52.7239,"cp2_hours":[24.0,480.0],"cp3_ti_pct":5.60723,"rtdc_pct":[2.8,20.0],"locl_pct":[0.0,2.0]},"untreated_best":{"cp1_hours":0.5,"cp2_ti_pct":22.8275,"cp2_hours":[0.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.5,"cp2_ti_pct":100.0,"cp2_hours":[24.0,480.0],"cp3_ti_pct":100.0,"rtdc_pct":[16.5,52.4],"locl_pct":[0.0,50.0]},"extraction":"automatic"}},{"cliff_id":"eva-related-dehydration","icl":"ICL40","name":"Eva Related Dehydration","category":"Cardiovascular Conditions","cliff":{"label":"EVA-Related Dehydration CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-dehydration-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"EVA-Related Dehydration CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-dehydration-cliff.pdf","list":"cliff119_2023"},"summary":"Dehydration is the result of excessive fluid loss (from sweat or GI losses) or inadequate intake and has been shown to reduce athletic performance and cognitive tasks which can be detrimental to crew function and safety. It can be somewhat difficult to define clinically as the term has been used colloquially to indicate anything from mild thirst to heat illness, but most commonly dehydration occurs after a 2% body weight loss of water. In the spaceflight environment, there are several factors that contribute to a relative hypovolemia within the first few days of a mission. The cephalad fluid shifts in microgravity result in diuresis and reduced plasma volume, oral intake is typically much lower than pre-launch, and many antiemetic or motion sickness medications have dehydration as a side effect. In combination this can leave a crew member 2-3% lower in total body water than their preflight measurements. A crew members volume status plateaus during flight and requires over-hydration prior to reentry to reduce orthostatic symptoms on return to earth's gravity. This change in volume status can be of particular concern for a crew member on EVA as they are required to perform very sensitive tasks for up to 8 hours at a time. This is further exacerbated by the maximum absorbency garment (MAG) which is an adult diaper that is used to catch urine and stool waste on EVA. Crew members have been known to reduce their oral intake prior to EVA in order to reduce the urine or stool output into the MAG for comfort. Despite these factors, incidence of dehydration in flight is expected to be rare due to operational and engineering risk mitigation. Prior to EVA, a crew member undergoes a private medical conference (PMC) which includes a general assessment of nutritional intake and hydration status. If a crew member or flight surgeon believes the astronaut is inadequately hydrated an EVA may be scrubbed or delayed. During EVA itself, current xEMU designs include 32oz of water for a 6 hour EVA and 64oz of water for an 8 hour EVA. The disposable in suit drink bag (DIDB) engineered to avoid leaking as in microgravity bag leak can lead to drowning and operationally any amount of leak is likely to leak to scrubbing EVA. It is nonetheless possible that a crew member becomes dehydrated to the point of impacting mission goals particularly during lunar missions where EVA frequency is expected to be much higher than that seen on the ISS.","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":2.19e-07,"incidence_sd":8.89e-08,"incidence_text":"Per EVA mean 2.19E-7 and SD 8.89E-8.","treated_best":{"probability_pct":[96.0,96.0],"cp1_ti_pct":100.0,"cp1_hours":0.6829,"cp2_ti_pct":22.2296,"cp2_hours":[2.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[4.0,4.0],"cp1_ti_pct":100.0,"cp1_hours":0.6829,"cp2_ti_pct":50.0,"cp2_hours":[24.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.6829,"cp2_ti_pct":44.4592,"cp2_hours":[24.0,72.0],"cp3_ti_pct":44.4592,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.6829,"cp2_ti_pct":100.0,"cp2_hours":[72.0,168.0],"cp3_ti_pct":100.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eva-related-fingernail-delamination","icl":"ICL41","name":"Eva Related Fingernail Delamination","category":"Upper Extremity Injury","cliff":{"label":"EVA-Related Fingernail Delamination CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-fingernail-delamination-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Fingernail Delamination (Secondary to EVA) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/fingernail-delamination-secondary-to-extravehicular-activity-cliff.pdf","list":"cliff100"},"peer_review":{"label":"EVA-Related Fingernail Delamination CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-fingernail-delamination-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"The extramobility unit (EMU) gloves, while pressurized, create a number of pressure points on the upper extremity and cause skin and soft tissue irritation. Fingernail injury and loss (onycholysis) has been a major complaint among crew members while on extravehicular activity (EVA) and during neutral buoyancy lab (NBL) training. This is in part due to the engineering requirements of the suit to maintain pressure and durability but still allow for maximal dexterity to perform tasks. Moisture accumulation within the glove tip and finger/hand size appear to be major contributing factors to this injury pattern (Jones, 2008; Opperman, 2010). Thus far, fingernail delamination has only been reported as a minor discomfort and has yet to substantially impact an EVA. However, future lunar missions will likely require longer and more frequent EVA than current ISS missions and this accumulative stress on the fingers may ultimately impact mission objectives. There are several mitigation strategies including gluing or bandaging fingertips to reduce fingernail trauma which have resulted in only moderate reduction of injury. Next generation xEMU gloves aim to reduce these pressure points and are anticipated to address this problem directly.","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.002656,"incidence_sd":0.0004719,"incidence_text":"Mean:0.002656 SD: 4.719E-4","treated_best":{"probability_pct":[90.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":0.5829,"cp2_ti_pct":13.3803,"cp2_hours":[168.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,10.0],"cp1_ti_pct":100.0,"cp1_hours":0.5829,"cp2_ti_pct":14.5628,"cp2_hours":[2920.0,4380.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.5829,"cp2_ti_pct":13.3803,"cp2_hours":[168.0,1008.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.5829,"cp2_ti_pct":14.5628,"cp2_hours":[2920.0,4380.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eva-related-hand-injury","icl":"ICL42","name":"Eva Related Hand Injury","category":"Upper Extremity Injury","cliff":{"label":"EVA-Related Hand Injury CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-hand-injury-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"EVA-Related Suit Contact Injury CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-suit-contact-injury-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"This new condition spans hand injuries sustained while in the EVA suit to include: abrasions and repetitive stress injuries of pain, swelling and fatigue. Note, it does not include fingernail delamination, which is covered by a separate condition (ICL41 - EVA Related Fingernail Delamination). EVA Related Hand injury is known to occur in spaceflight. Factors that predispose to injury include: Small hand size, left-handedness, glove model, moisture in the glove, and longer duration of training sortie (Dervay et al, 2020). It has been documented that wound healing in weightlessness may take longer than terrestrially due to suppressed and altered cellular immune function as well as delayed cutaneous hypersensitivity (Campbell and Billica, 2020).","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0846,"incidence_sd":0.0177,"incidence_text":"Mean: 0.0846 SD: 0.0177","treated_best":{"probability_pct":[81.7,87.0],"cp1_ti_pct":100.0,"cp1_hours":0.6662,"cp2_ti_pct":9.11507,"cp2_hours":[96.0,384.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[13.0,18.3],"cp1_ti_pct":100.0,"cp1_hours":0.8829,"cp2_ti_pct":29.1257,"cp2_hours":[72.0,192.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.6662,"cp2_ti_pct":9.11507,"cp2_hours":[96.0,384.0],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.8829,"cp2_ti_pct":29.1257,"cp2_hours":[72.0,192.0],"cp3_ti_pct":29.1257,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eva-related-heat-illness","icl":"ICL43","name":"Eva Related Heat Illness","category":"Thermal/Environmental Illness","cliff":{"label":"EVA-Related Heat Illness CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-heat-illness-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"EVA-Related Heat Illness CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-heat-illness-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Heat illness is the constellation of syndromes that are associated with an elevated core temperature. This CRT specifically relates to exertional heat illness, commonly seen among military recruits and athletes who are exerting themselves in conditions of high temperature and humidity that limit the bodies ability to dissipate heat. Conditions include heat cramps, heat syncope, heat exhaustion, and heat stroke. While on EVA the temperature can vary between -200F in the dark to 300F in the sun and life support systems must maintain crew member temperatures within homeostatic ranges despite these large swings. The ergonomics of the EMU require crew members to heavily exert themselves to perform tasks and thus can generate large amounts of heat that must be buffered by cooling systems. Several Gemini astronauts noted significant overheating while on EVA and future iterations of EVA suits have been adapted accordingly. The most recent iteration of space suit, the xEMU, places emphasis on better heating and cooling systems to prepare for the increased energy expenditure required for frequent EVAs in partial gravity.","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":7.406e-13,"incidence_sd":8.507e-13,"incidence_text":"mean 7.406E-13 events per EVA SD 8.507E-13","treated_best":{"probability_pct":[90.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":0.91,"cp2_ti_pct":19.2665,"cp2_hours":[4.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,10.0],"cp1_ti_pct":100.0,"cp1_hours":1.25,"cp2_ti_pct":50.0,"cp2_hours":[24.0,504.0],"cp3_ti_pct":0.0,"rtdc_pct":[7.0,100.0],"locl_pct":[0.0,1.0]},"untreated_best":{"cp1_hours":0.91,"cp2_ti_pct":69.2665,"cp2_hours":[24.0,72.0],"cp3_ti_pct":100.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.25,"cp2_ti_pct":100.0,"cp2_hours":[168.0,1104.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[6.0,100.0]},"extraction":"automatic"}},{"cliff_id":"eva-related-paresthesia","icl":"ICL44","name":"Eva Related Paresthesia","category":"Neurological Conditions","cliff":{"label":"EVA-Related Paesthesia CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-paresthesia-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"EVA-Related Paesthesia CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-paresthesia-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Paresthesia occurs when sustained pressure has been applied over a nerve inhibiting or stimulating its function. Removing the pressure will typically result in gradual relief of the paresthesia, often described as a \"pins and needles\" feeling. Persistent paresthesia in the EVA setting is often a symptom of compressive neuropathy of peripheral nerves. The most frequently observed are of the digital, ulnar, median, supra-clavicular, and peroneal nerves. These usually resolve within 3 to 45 days (NASA, Paresthesias Secondary to Extravehicular Activity CLiFF, 2017). Numerous conditions can lead to paresthesia post-EVA, including pressure on neurovascular structures, hyperventilation, DCS, and electrolyte imbalances. (NASA, Paresthesias Secondary to Extravehicular Activity CLiFF, 2017) This CLiFF only considers paresthesia secondary to EVA suit pressure points.","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.1298,"incidence_sd":0.01657,"incidence_text":"Mean: 0.1298 SD: 0.01657","treated_best":{"probability_pct":[97.0,97.0],"cp1_ti_pct":100.0,"cp1_hours":0.1,"cp2_ti_pct":9.11507,"cp2_hours":[0.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[3.0,3.0],"cp1_ti_pct":100.0,"cp1_hours":0.27,"cp2_ti_pct":9.11507,"cp2_hours":[24.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.1,"cp2_ti_pct":26.7606,"cp2_hours":[0.0,24.0],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.27,"cp2_ti_pct":29.1257,"cp2_hours":[24.0,1080.0],"cp3_ti_pct":29.1257,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eva-related-shoulder-injury","icl":"ICL45","name":"Eva Related Shoulder Injury","category":"Upper Extremity Injury","cliff":{"label":"EVA-Related Shoulder Injury CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-shoulder-injury-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"EVA-Related Shoulder Injury CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-shoulder-injury-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"There are multiple factors associated with the mechanism of shoulder injury related to the EVA such as suit fit, donning and doffing, body position, pre-existing injury, tool mass and configuration, age, in-suit activity, and training density. Notably, EVA density has been correlated with shoulder injury. For each EVA performed in spaceflight, crewmembers undergo 6-10 NBL training runs (Scheuring et al, 2012). The likelihood of symptoms increases with increased NBL test-runs with the following proportions of runs complaining of shoulder symptoms: 2.7% (0-9 runs), 5% (10-91 runs) and 15.8% (92 or more runs). Similarly, training volume is correlated with surgical shoulder injuries, with crewmembers who have performed more than 92 training runs (in either the planar or the pivoted hard upper torso suit) being 5.9 more likely to have shoulder surgery compared to crewmembers who have performed 0-9 training runs. (Scheuring et al, 2012) Suit design has been implicated in shoulder injuries. The Scye (arm openings) on both the planar hard upper torso (HUT) and pivoted HUT suits restrict normal shoulder motion, but the planar HUT to a greater degree. The planar HUT limits shoulder range of motion to the following approximates (Abduction 60-90°, Flexion 90°, Internal Rotation 40°, External rotation 35°). (Scheuring et al, 2012)","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0282,"incidence_sd":0.0107,"incidence_text":"Mean: 0.0282 SD: 0.0107","treated_best":{"probability_pct":[86.0,86.0],"cp1_ti_pct":100.0,"cp1_hours":1.48,"cp2_ti_pct":8.75631,"cp2_hours":[504.0,2232.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[14.0,14.0],"cp1_ti_pct":100.0,"cp1_hours":1.48,"cp2_ti_pct":19.2665,"cp2_hours":[2232.0,8928.0],"cp3_ti_pct":17.5126,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.48,"cp2_ti_pct":22.5884,"cp2_hours":[2232.0,8928.0],"cp3_ti_pct":6.51076,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.48,"cp2_ti_pct":29.2719,"cp2_hours":[8760.0,87600.0],"cp3_ti_pct":17.5126,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eva-related-suit-contact-injury","icl":"ICL46","name":"Eva Related Suit Contact Injury","category":"Musculoskeletal Conditions","cliff":{"label":"EVA-Related Suit Contact Injury CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-suit-contact-injury-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"EVA-Related Suit Contact Injury CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eva-related-suit-contact-injury-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"EVA related suit contact injuries refer to contusions, abrasions, or hard impacts with the spacesuit. Most contact injuries are minor (Strauss, 2004). Gravity shifting inside the suit during test-runs at the NBL can lead to contact injuries not seen in spaceflight (Chappell et al, 2017).","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.1807,"incidence_sd":0.02439,"incidence_text":"Mean: 0.1807 SD: 0.02439","treated_best":{"probability_pct":[33.0,33.0],"cp1_ti_pct":100.0,"cp1_hours":0.616,"cp2_ti_pct":5.60723,"cp2_hours":[72.0,384.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[67.0,67.0],"cp1_ti_pct":100.0,"cp1_hours":0.616,"cp2_ti_pct":12.304,"cp2_hours":[72.0,384.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.616,"cp2_ti_pct":29.9495,"cp2_hours":[72.0,384.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.616,"cp2_ti_pct":29.9495,"cp2_hours":[72.0,384.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eye-retinal-injury","icl":"ICL47","name":"Eye - Retinal Injury","category":"Eye Injury","cliff":{"label":"Eye Retinal Injury CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eye-retinal-injury-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Eye Retinal Injury CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eye-retinal-injury-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Retinal detachment is a common ophthalmic emergency. Retinal detachment is separation of the neurosensory retina from the underlying retinal pigment epithelium. Retinal detachment occurs when the forces of retinal attachment are overcome and fluid accumulates in the subretinal space. Symptoms of retinal detachment include photopsia (flashes), floaters, visual field defects, and decreased visual acuity. Once the retinal detachment extends beyond the fovea (central macula), permanent visual impairment is almost inevitable (Kang, 2008).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.000126,"incidence_sd":8.557e-06,"incidence_text":"mean 1.26E-4 and SD 8.557E-6","treated_best":{"probability_pct":[59.0,70.0],"cp1_ti_pct":100.0,"cp1_hours":3.3,"cp2_ti_pct":15.3069,"cp2_hours":[1.0,504.0],"cp3_ti_pct":0.0,"rtdc_pct":[28.0,100.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[30.0,41.0],"cp1_ti_pct":100.0,"cp1_hours":3.3,"cp2_ti_pct":30.7999,"cp2_hours":[504.0,504.0],"cp3_ti_pct":0.0,"rtdc_pct":[28.0,100.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":3.3,"cp2_ti_pct":16.4895,"cp2_hours":[1.0,504.0],"cp3_ti_pct":0.0,"rtdc_pct":[28.0,100.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":3.3,"cp2_ti_pct":46.7048,"cp2_hours":[504.0,504.0],"cp3_ti_pct":31.8097,"rtdc_pct":[28.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eye-foreign-body","icl":"ICL48","name":"Eye Foreign Body","category":"Eye Injury","cliff":{"label":"Eye Foreign Body CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eye-foreign-body-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Eye Penetration (Foreign Body) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eye-penetration-foreign-body-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Eye Foreign Body CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eye-foreign-body-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"The eye is comprised of three layers: the exterior fibrous layer (cornea and sclera), the middle vascular layer (choroid, ciliary body, and iris) and the internal layer (retina). The lens partitions the anterior structures (iris, anterior chamber, and cornea) from the posterior structures (vitreous, retina, choroid, and optic nerve). A foreign body can be associated with any of these layers. The depth of penetration, type of foreign body and size of foreign body can determine the ocular morbidity associated with its presence. Foreign bodies comprised of wood, copper, iron, and steel tend to have the highest ocular inflammatory responses while glass, lead, plastic, and porcelain are relatively inert (Tarf et al., 2017). Foreign bodies comprised of organic matter, such as vegetables, are at increased risk for infection. Corneal abrasions and ulcerations are often associated with ocular foreign bodies; however, these are considered under a different CLiFF condition. Similarly, ocular foreign bodies can lead to eye infections which are also detailed in another CLiFF. The risk of injury from a foreign body is higher in microgravity because particulates float freely in the cabin and follow prevailing air currents (Barratt et al., 2019). Traditionally, foreign bodies are described as being either extraocular (superficial, embedded in or above the conjunctiva, cornea, or sclera but not through these tissues) or intraocular (within the globe itself) (Loporchio et al., 2016). Treatment of intraocular foreign bodies require an emergent ophthalmology consult and often a surgical procedure (Romaniuk, 2013). Thus far in spaceflight, only extraocular foreign bodies have occurred.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_sd":0.1905,"incidence_text":"1.626 person- years SD: 0.1905","treated_best":{"probability_pct":[98.67,98.67],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":15.905,"cp2_hours":[0.5,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[1.33,1.33],"cp1_ti_pct":100.0,"cp1_hours":2.92,"cp2_ti_pct":27.545,"cp2_hours":[48.0,240.0],"cp3_ti_pct":5.63,"rtdc_pct":[96.0,100.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.0,"cp2_ti_pct":24.73,"cp2_hours":[0.5,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":2.92,"cp2_ti_pct":52.495,"cp2_hours":[48.0,240.0],"cp3_ti_pct":5.63,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eye-irritation-corneal-abrasion-ulceration","icl":"ICL49","name":"Eye Irritation/Corneal Abrasion/Ulceration","category":"Eye Injury","cliff":{"label":"Eye Irritation Corneal Abrasion/Ulceration CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eye-irritation-corneal-abrasion-ulceration-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Eye Irritation Corneal Abrasion and Ulceration CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eye-irritation-corneal-abrasion-and-ulceration-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"The eye is comprised of three layers: the exterior fibrous layer (cornea and sclera), the middle vascular layer (choroid, ciliary body, and iris) and the internal layer (retina). The lens partitions the anterior structures (iris, anterior chamber, and cornea) from the posterior structures (vitreous, retina, choroid, and optic nerve). Eye irritation can be secondary to superficial foreign bodies trapped on the cornea, conjunctiva or sclera. Dry eyes (compromised ocular lubrication) can also lead to eye irritation. The risk of irritation from a superficial ocular foreign body is higher in microgravity secondary to particles free-floating in the cabin (Barratt et al., 2019). Dry eyes are also of increased concern given the varying environmental conditions, possible changes in blink-rate and changes in surface tension of the tear-film in space. A corneal abrasion results when there is a defect in the epithelium, usually from an external trauma. Patients who wear contact lenses are at increased risk for abrasions and microbial pathogens (Ahmed et al., 2015). Most abrasions will heal without treatment, but some can progress to corneal ulcerations. Corneal ulcers are an ophthalmologic emergency as they are associated with progressive tissue destruction. Untreated, corneal ulcers can rapidly continue to corneal perforations and loss of the eye (Tuli et al., 2007). Even with rapid treatment, visual defects can occur from residual scarring. In terrestrial scenarios, patients with corneal ulcerations require urgent ophthalmologic evaluation and immediate initiation of medication. Many ulcerations will fail to respond to medical therapeutics (both topical and systemic) and do require procedural intervention.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_sd":0.2164,"incidence_text":"All inclusive incidence: 2.108 person-years and SD 0.2164; Contact lens wearers corneal abrasions:","treated_best":{"probability_pct":[98.0,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.62,"cp2_ti_pct":2.80361,"cp2_hours":[0.5,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,2.0],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":15.9049,"cp2_hours":[72.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[9.5,37.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.62,"cp2_ti_pct":15.9049,"cp2_hours":[0.5,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.0,"cp2_ti_pct":44.7781,"cp2_hours":[72.0,744.0],"cp3_ti_pct":31.8097,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"eyelid-and-anterior-eye-infection","icl":"ICL50","name":"Eyelid And Anterior Eye Infection","category":"Eye Injury","cliff":{"label":"Eyelid and Anterior Eye Infection CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eyelid-and-anterior-eye-infection-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Eyelid and Anterior Eye Infection CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eyelid-and-anterior-eye-infection-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"The eye is comprised of three layers: the exterior fibrous layer (cornea and sclera), the middle vascular layer (choroid, ciliary body, and iris) and the internal layer (retina). The lens partitions the anterior structures (iris, anterior chamber, and cornea) from the posterior structures (vitreous, retina, choroid, and optic nerve). This CLiFF concerns infections related to the eyelids and the anterior structures of the eye. Conditions that this CliFF encompasses include hordeola, infectious conjunctivitis, preseptal cellulitis, infectious uveitis, infectious keratitis. Infection means a disease caused by a pathogen or microorganism. Consequently, non-infectious causes such as autoimmune uveitis, allergic conjunctivitis and ulcerative keratitis (corneal ulcer) are not covered here. Further, herpes zoster opthalmicus is covered in the CLiFF entitled “Herpes Zoster Reactivation.” Infectious conjunctivitis, which is covered in the best-case scenario refers to inflammation resulting from infection of the conjunctiva: the thin, clear membrane that lies against the anterior part of the sclera and inside the eyelids (Azari et al., 2020). Cases of conjunctivitis are characterized by hyperemia, edema, and discharge. The worst-case scenario can refer to a case of preseptal (or periorbital) cellulitis, but markedly not orbital cellulitis. Preseptal and orbital cellulitis are distinct clinical diseases, though have overlapping clinical features and therefore can be difficult to differentiate. Preseptal cellulitis involves infection of the eye lids and surrounding skin not involving the orbit (the structures anterior to the orbital septum). Orbital cellulitis involves the contents of the orbit (fat and ocular muscles) (Baiu et al., 2020). For simplicity, this CLiFF covers only category 1 of the Chandler classification system.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.2638,"incidence_sd":0.07658,"incidence_text":"mean 0.2638 SD 0.07658","treated_best":{"probability_pct":[92.0,92.0],"cp1_ti_pct":100.0,"cp1_hours":1.1,"cp2_ti_pct":0.0,"cp2_hours":[24.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[8.0,8.0],"cp1_ti_pct":100.0,"cp1_hours":1.1,"cp2_ti_pct":15.9049,"cp2_hours":[48.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,3.6],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.1,"cp2_ti_pct":15.9049,"cp2_hours":[24.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.1,"cp2_ti_pct":49.4552,"cp2_hours":[48.0,840.0],"cp3_ti_pct":49.4552,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"fracture-arm","icl":"ICL51","name":"Fracture - Arm","category":"Upper Extremity Injury","cliff":{"label":"Arm Fracture CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/fracture-arm-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Arm Fracture CliFF Peer Review t. Ideally, the likelihood and outcomes for this condition would be determined based on a biomechanical mathematical model. This was done for several fracture conditions in IMM. However, since there is no biomechanical mathematical model for cervical spine fracture, terrestrial data must be used. This is not a very good analog population for this condition and will likely result in an overestimation of the incidence and associated outcomes for cervical spine fracture. For best case/worst case percentages, 24% of cervical spine fractures required surgery in 2017. (Ponkilainen, 2020).","applicability":{"incidence_type":"EVA","segment":"EVA Surface","envs":["T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":1.17e-07,"incidence_sd":4.344e-09,"incidence_text":"mean 1.17E-7 SD 4.344E-9","treated_best":{"probability_pct":[76.0,76.0],"cp1_ti_pct":100.0,"cp1_hours":1.5,"cp2_ti_pct":13.8719,"cp2_hours":[1544.0,2016.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[24.0,24.0],"cp1_ti_pct":100.0,"cp1_hours":2.0,"cp2_ti_pct":57.5073,"cp2_hours":[2016.0,2016.0],"cp3_ti_pct":24.8738,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.5,"cp2_ti_pct":33.8825,"cp2_hours":[1544.0,2016.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":2.0,"cp2_ti_pct":72.4953,"cp2_hours":[2016.0,2016.0],"cp3_ti_pct":72.4953,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"fracture-distal-leg","icl":"ICL53","name":"Fracture - Distal Leg","category":"Lower Extremity Injury","cliff":{"label":"Fracture Distal Leg CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/fracture-distal-leg-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Distal Leg Fracture CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/distal-leg-fracture-cliff-peer-review.pdf","list":
