<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Builder</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6778; --line: #d9dee6;
  --accent: #2f5fd0; --accent-ink: #ffffff; --err: #b3261e; --warn: #8a5a00; --ok: #1f7a3a;
  --chip: #eef2fb; --code: #f0f2f5; --sel: #dfe8ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1f27; --ink: #e6e9ef; --muted: #9aa4b5; --line: #2c3340;
    --accent: #7ea2ff; --accent-ink: #0d1220; --err: #ff8a80; --warn: #f2c14e; --ok: #7bd88f;
    --chip: #222a38; --code: #232a35; --sel: #2a3a60;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1f27; --ink: #e6e9ef; --muted: #9aa4b5; --line: #2c3340;
  --accent: #7ea2ff; --accent-ink: #0d1220; --err: #ff8a80; --warn: #f2c14e; --ok: #7bd88f;
  --chip: #222a38; --code: #232a35; --sel: #2a3a60;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header.top h1 { font-size: 17px; margin: 0 auto 0 0; }
header.top .status { font-size: 13px; color: var(--muted); }
@media (max-width: 600px) { header.top { position: static; } }
main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
@media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } aside { position: static !important; max-height: none !important; } }
section.card, aside .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
section.card h2 { font-size: 16px; margin: 0 0 4px; }
.help { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 12px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-weight: 600; }
label.f span.hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.lbl { font-size: 13px; font-weight: 600; margin: 8px 0 3px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
input[type=checkbox] { width: auto; }
textarea { min-height: 64px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.small { padding: 2px 8px; font-size: 13px; }
button.danger { color: var(--err); }
button.on { background: var(--sel); border-color: var(--accent); font-weight: 600; }
.row { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0; background: var(--bg); }
.row .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
.kv { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin: 4px 0; }
.cols4 { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr auto; gap: 6px; margin: 4px 0; }
.cols3 { display: grid; grid-template-columns: 1.4fr 1fr 1.2fr auto; gap: 6px; margin: 4px 0; }
@media (max-width: 600px) { .kv, .cols4, .cols3 { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.chip button { border: 0; background: none; padding: 0; color: var(--muted); }
.scale { display: flex; flex-wrap: wrap; gap: 4px; }
.scale button { min-width: 34px; padding: 4px 6px; }
.picker { position: relative; }
.picker .menu { position: absolute; z-index: 4; left: 0; right: 0; max-height: 260px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-top: 2px; }
.picker .menu div { padding: 5px 8px; font-size: 13px; cursor: pointer; }
.picker .menu div:hover, .picker .menu div.act { background: var(--sel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 4px 6px; vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--muted); font-weight: 600; }
aside { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow: auto; }
aside h3 { font-size: 14px; margin: 0 0 6px; }
.issues li { margin: 3px 0; font-size: 13px; }
.issues .error { color: var(--err); } .issues .warning { color: var(--warn); } .issues .info { color: var(--muted); }
.ok { color: var(--ok); } .muted { color: var(--muted); }
.st-available { color: var(--ok); } .st-unavailable { color: var(--err); } .st-adapted, .st-unknown { color: var(--warn); }
details summary { cursor: pointer; font-weight: 600; font-size: 13px; margin: 6px 0; }
.btnbar { display: flex; flex-wrap: wrap; gap: 8px; }
.enc { font-size: 13px; border-bottom: 1px solid var(--line); padding: 6px 0; }
.enc b { display: block; }
.std { font-size: 13px; padding: 6px 8px; border-left: 3px solid var(--accent); background: var(--bg); margin: 6px 0; }
#print-view { display: none; }
@media print {
  header.top, main { display: none !important; }
  #print-view { display: block; color: #000; font-size: 11pt; }
  #print-view h1 { font-size: 16pt; } #print-view h2 { font-size: 12.5pt; margin-top: 14pt; border-bottom: 1px solid #999; }
  #print-view table { font-size: 9.5pt; } #print-view th, #print-view td { border-bottom: 1px solid #ccc; }
  .sign { margin-top: 18pt; display: grid; grid-template-columns: 1fr 1fr; gap: 18pt; }
  .sign div { border-top: 1px solid #000; padding-top: 4pt; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Scenario Builder <span class="muted" style="font-weight:400;font-size:13px">MedSim Eval</span></h1>
  <span class="status" id="savestate"></span>
  <button id="btn-check">Case check</button>
  <button class="primary" id="btn-export">Download files</button>
</header>
<main>
  <div id="form"></div>
  <aside id="side"></aside>
</main>
<div id="print-view"></div>
<input type="file" id="file-import" accept=".json,application/json" multiple hidden>

bilical, incisional, and femoral. However, umbilical hernias are most common in the very young and the elderly or in the obese population (Dabbas, 2011). As current astronauts are medically qualified and, therefore, outside of these affected populations, this CliFF will focus on the more likely etiologies of inguinal, incisional, and femoral hernias. The clinical spectrum of presentations and complications related to abdominal hernias is variable, ranging from uncomplicated identification of an asymptomatic hernia to incarceration and strangulation of bowel resulting in intestinal ischemia and even perforation (Fitzgibbons, Jr., 2006). Symptoms can range from the patient noticing a bulge in the groin region or at an old incisional site, with or without pain, to a severe and emergent presentation of acute bowel strangulation, with severe pain, signs of bowel obstruction, and even signs and symptoms of acute shock. Diagnosis can be made with ultrasound imaging, with indirect inguinal hernias identified with a 97% sensitivity and 87% specificity, and identification of femoral hernias with reported rates of 100% sensitivity and specificity (Bradley, 2003). Hernias are more common in males and can occur at any age, though femoral hernias are more common in women particularly over the age of 60 (Dabbas, 2011)(Naude, 1997). Elective surgical repair of hernias has become quite common, with surgical procedures ranging from open laparotomy and suture or mesh repair to laparoscopic and minimally invasive surgery (Anon., 2000). There are no documented episodes of inflight abdominal wall hernias. Therefore, terrestrial studies are used to estimate the incidence and outcomes of abdominal wall hernia during spaceflight.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.00395,"incidence_sd":1.911e-05,"incidence_text":"Males = mean 3.95E-3 and SD 1.9  sweating. (AHA, 2015) Terrestrially if there is a concern for ACS the gold- standard for risk stratification and possible treatment is cardiac catheterization.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.001541,"incidence_sd":0.000332,"incidence_text":"Mean: 0.001541 SD: 3.32E-4","treated_best":{"probability_pct":[83.0,89.0],"cp1_ti_pct":100.0,"cp1_hours":1.783,"cp2_ti_pct":30.5209,"cp2_hours":[0.616667,1488.0],"cp3_ti_pct":9.46054,"rtdc_pct":[100.0,100.0],"locl_pct":[3.0,7.7]},"treated_worst":{"probability_pct":[11.0,17.0],"cp1_ti_pct":100.0,"cp1_hours":1.783,"cp2_ti_pct":42.7319,"cp2_hours":[0.616667,1728.0],"cp3_ti_pct":9.46054,"rtdc_pct":[100.0,100.0],"locl_pct":[5.3,14.5]},"untreated_best":{"cp1_hours":1.783,"cp2_ti_pct":57.5073,"cp2_hours":[0.616667,198720.0],"cp3_ti_pct":57.5073,"rtdc_pct":[100.0,100.0],"locl_pct":[3.0,32.0]},"untreated_worst":{"cp1_hours":1.783,"cp2_ti_pct":75.8305,"cp2_hours":[0.616667,198720.0],"cp3_ti_pct":75.6577,"rtdc_pct":[100.0,100.0],"locl_pct":[6.18,97.0]},"extraction":"automatic"}},{"cliff_id":"acute-radiation-syndrome","icl":"ICL4","name":"Acute Radiation Syndrome","category":"Thermal/Environmental Illness","cliff":{"label":"Acute Radiation Syndrome CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-radiation-syndrome-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Acute Radiation Syndrome CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-radiation-syndrome-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Acute Radiation Syndrome CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-radiation-syndrome-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"During spaceflight, both galactic cosmic radiation (GCR) and solar energetic particles from solar particle events (SPEs) threaten the health and safety of crew members. These high energy particles and waves can cause molecular damage to DNA and pluripotent cell lines increasing the risk of cancer (stochastic effects) but also in high doses can cause direct tissue damage (Non-stochastic/deterministic effects). Acute radiation syndrome (ARS) is the constellation of multi-organ injury that occurs with high doses of radiation in a short period of time. With the exception of the Apollo missions, all of spaceflight has existed within low earth orbit and well within the protection of the earth's magnetosphere, limiting radiation exposure. As we move toward long duration spaceflight outside of low earth orbit (LEO) the risk of radiation exposures and thus ARS becomes more significant. SPE's are of particular concern as they are difficult to predict and can release high energy protons for up to several days at a time. These particle events contain enough energy to induce acute radiation syndrome in a crew member if not adequately protected. The vast majority of terrestrial data on radiation exposure comes from nuclear weapons and disasters which typically release low-linear energy transfer (low-LET) radiation such as X- rays and gamma rays. Radiation syndrome progresses through a prodromal phase, a latent phase, and manifest phases. Symptoms are organ specific, but typically the prodromal phase involves headache, nausea, and fatigue. Extremely high doses of radiation may result in vomiting, confusion, and hemodynamic effects. In the latent phase a patient's symptoms improve with the exception of cytopenia. However this phase is then replaced by the manifest phase in which the patient is immunocompromised and develops end organ failure. The duration and severity of each phase is entirely dose dependent. Extensive work has been done to model SPE's and extrapolate from terrestrial data but much is still unknown about the risk and impact of an SPE on a crew member in flight. Over the last 70 years there have been several large SPEs that had the potential to induce ARS among crew members with limited shielding. Newer vehicle designs plan to mitigate this risk with shielding and radiation shelters limit both the stochastic and deterministic effects of long duration flight.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.01,"incidence_sd":0.0,"incidence_text":"mean 0.01 and SD 0","treated_best":{"probability_pct":[90.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":1.08,"cp2_ti_pct":16.2238,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,10.0],"cp1_ti_pct":100.0,"cp1_hours":1.08,"cp2_ti_pct":26.2291,"cp2_hours":[24.0,144.0],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.08,"cp2_ti_pct":16.742,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.08,"cp2_ti_pct":31.7964,"cp2_hours":[24.0,240.0],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"allergic-reaction-mild-to-moderate","icl":"ICL5","name":"Allergic Reaction (Mild To Moderate)","category":"Allergic Reaction","cliff":{"label":"Allergic Reaction (Mild-Moderate) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/allergic-reaction-mild-to-moderate-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Allergic Reaction (Mild-Moderate) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/allergic-reaction-mild-to-moderate-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Allergic Reaction (Mild-Moderate) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/allergic-reaction-mild-to-moderate-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Allergic reactions are sensitivities to a specific substance, known as an allergen that occur after the substance comes in contact with the skin, the lungs, the gastrointestinal tract, or is injected. In mild and moderate forms, these reactions can be treated with oral medications such as antihistamines and steroids. These allergic reactions can present as skin rashes, nasal congestions, conjunctivitis, asthma, GI symptoms such as vomiting, abdominal cramping, etc. In contrast, in severe forms such as anaphylaxis, intravenous medications and more advanced procedures such as airway management might be required to treat potentially life-threatening symptoms. This CLiFF focuses on the mild to moderate forms of acute allergic reaction that are generally not fatal. Countless objects can potentially cause an allergic reaction, including food, medications, materials, pollen, fungi, animals, and mites. It is known that immune dysregulation occurs during spaceflight, thus increasing the risk of an allergic reaction (Crucian 2016). During spaceflight, common potential allergens would be food and medications.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.3293,"incidence_text":"Mean 0.3293","treated_best":{"probability_pct":[93.0,93.0],"cp1_ti_pct":100.0,"cp1_hours":0.83,"cp2_ti_pct":13.4,"cp2_hours":[0.25,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[7.0,7.0],"cp1_ti_pct":100.0,"cp1_hours":0.83,"cp2_ti_pct":13.4,"cp2_hours":[48.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.83,"cp2_ti_pct":2.80361,"cp2_hours":[24.0,48.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.83,"cp2_ti_pct":15.75,"cp2_hours":[72.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"altitude-sickness","icl":"ICL6","name":"Altitude Sickness","category":"Thermal/Environmental Illness","cliff":{"label":"Altitude Sickness CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/altitude-sickness-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Altitude Sickness CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/altitude-sickness-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Altitude Sickness CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/altitude-sickness-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Altitude Sickness, as we have defined the term, is hypoxia sufficient to cause impairment of function. Hypothetical situations that could cause this condition include: cabin leak that may result in reduced cabin pressure, environmental control mishap in which cabin pressure is maintained but oxygen level is inadequately sustained, inadequate gas mixing and uneven cabin ventilation, acute hypoxic exposure from an EVA suit leak. Altitude sickness represents a spectrum of pathologic states initiated by an exaggerated vascular response to hypoxia. Syndromes include acute mountain sickness (AMS), high altitude cerebral edema (HACE), high altitude pulmonary edema (HAPE), and high altitude retinal hemorrhage. The potential for AMS in space operations exists during staged decompression prior to EVA or following inadvertent pressure reduction due to partial loss of spacecraft atmosphere. (Clark, 2008). In this CLiFF the term \"descent\" is considered to be a return to a sufficient partial pressure of oxygen to treat symptoms of hypoxia associated with loss of pressurization.","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_text":"Fixed incidence proportion of 1.01E-4","treated_best":{"probability_pct":[98.0,98.0],"cp1_ti_pct":100.0,"cp1_hours":0.22,"cp2_ti_pct":15.3069,"cp2_hours":[0.0,4.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[2.0,2.0],"cp1_ti_pct":100.0,"cp1_hours":1.5,"cp2_ti_pct":53.654,"cp2_hours":[46.0,192.0],"cp3_ti_pct":26.7606,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.22,"cp2_ti_pct":15.4797,"cp2_hours":[0.0,4.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.5,"cp2_ti_pct":98.5384,"cp2_hours":[48.0,504.0],"cp3_ti_pct":98.5384,"rtdc_pct":[100.0,100.0],"locl_pct":[4.6,50.0]},"extraction":"automatic"}},{"cliff_id":"anaphylaxis","icl":"ICL7","name":"Anaphylaxis","category":"Allergic Reaction","cliff":{"label":"Anaphylaxis CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/anaphylaxis-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Anaphylaxis CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/anaphylaxis-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Anaphylaxis CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/anaphylaxis-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Anaphylaxis is an acute, life-threatening, IgE-mediated allergic reaction that occurs in previously sensitized people when they are re-exposed to the sensitizing antigen. Symptoms include stridor, dyspnea, wheezing, and hypotension. The diagnosis is clinical. Epinephrine is the first-line treatment for anaphylaxis. Bronchospasm and upper airway edema are treated with inhaled or injected β-agonists and sometimes endotracheal intubation. Hypotension requires IV fluids and vasopressors. History of atopy does not increase risk of anaphylaxis but increases risk of death when anaphylaxis occurs. Anaphylactoid reactions: These reactions are clinically indistinguishable from anaphylaxis but do not involve IgE and do not require prior sensitization. They occur via direct stimulation of mast cells or via immune complexes that activate complement. An anaphylactic reaction in space would be a significant medical emergency. The most likely sensitizing antigen for a crewmember would be on board medication. Other potential antigens are tracers and markers used in life sciences experiments. Crewmembers are tested for these common allergens before flight, but that does not fully obviate the risk of an anaphylactic reaction, particularly with repeated exposures. Another risk factor is that immune dysregulation occurs in space flight. The clinical manifestations of a vasodilation-induced hypotension in microgravity are not known, but presumably would present differently than in a 1g environment. There are no documented cases of anaphylaxis in spaceflight (Crucian, 2016). Therefore, terrestrial data are used for incidence, CP2 durations, and outcomes.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0004065,"incidence_sd":4.49e-05,"incidence_text":"Males = mean 4.065E-4 and SD 4.49E-5. Females = mean 5.902E-4 and SD 5.084E-5.","treated_best":{"probability_pct":[69.2,69.2],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":21.552,"cp2_hours":[4.0,8.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[30.8,30.8],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":52.8036,"cp2_hours":[8.0,32.0],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,0.33],"locl_pct":[0.0,0.33]},"untreated_best":{"cp1_hours":1.0,"cp2_ti_pct":88.068,"cp2_hours":[4.0,8.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[10.0,10.0]},"untreated_worst":{"cp1_hours":1.0,"cp2_ti_pct":100.0,"cp2_hours":[8.0,32.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[10.0,100.0]},"extraction":"automatic"}},{"cliff_id":"appendicitis","icl":"ICL8","name":"Appendicitis","category":"Gastrointestinal Conditions","cliff":{"label":"Appendicitis CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/appendicitis-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Appendicitis CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/appendicitis-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Appendicitis CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/appendicitis-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Appendicitis is acute inflammation and subsequent infection of the appendix, a small outpouching of the colon. It is caused by a blockage of the lumen of the appendix which results in increasing pressure, inflammation of surrounding structures, and eventual perforation. The typical presentation is gradual onset of abdominal pain, decreased appetite, and local tenderness in the right lower abdomen. The terrestrial standard of care is surgical removal of the inflamed appendix. Although appendectomy is one of the most common surgeries performed worldwide, the technical challenge of the procedure and anesthesia prohibits non-surgeons from performing it. Medical management with antibiotics and bowel rest has been successful in select cases in remote analog and traditional medical environments. No confirmed cases of appendicitis have been reported in US spaceflight. (Marshburn, 2008) (Campbell, 2004)","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.000934,"incidence_sd":0.000103,"incidence_text":"Mean 9.34E-4 SD 1.03E-4","treated_best":{"probability_pct":[62.6,77.5],"cp1_ti_pct":100.0,"cp1_hours":1.83,"cp2_ti_pct":21.552,"cp2_hours":[168.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,29.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[22.5,37.4],"cp1_ti_pct":100.0,"cp1_hours":1.83,"cp2_ti_pct":50.0,"cp2_hours":[168.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,8.7]},"untreated_best":{"cp1_hours":1.83,"cp2_ti_pct":83.4573,"cp2_hours":[168.0,504.0],"cp3_ti_pct":100.0,"rtdc_pct":[5.0,29.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.83,"cp2_ti_pct":100.0,"cp2_hours":[168.0,504.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,50.0]},"extraction":"automatic"}},{"cliff_id":"arthritis-acute","icl":"ICL9","name":"Arthritis, Acute","category":"Musculoskeletal Conditions","cliff":{"label":"Acute Arthritis CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/arthritis-acute-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Acute Arthritis CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-arthritis-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Arthritis CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/arthritis-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"In adults, arthritis is the most common cause of disability and is among the leading conditions causing work limitations. The estimated number of adults with physician diagnosed arthritis is anticipated to reach 25% of the adult population by 2040 (Watkins-Castillo, 2021). Osteoarthritis (OA), also known as degenerative joint disease, is the most common type of arthritis. It causes progressive damage to the cartilage and other joint tissues, and frequently affects the hand, knees, and hips. Gout is a painful, recurrent form of inflammatory arthritis, caused by deposition of uric acid crystal in joints (Watkins-Castillo, 2021). Symptoms typically consist of intense episodes of painful swelling in single joints, most often in the feet and especially in the big toe. There have been no reported cases of osteoarthritis flares or crystalline arthropathies in spaceflight. Historically, it has been thought that microgravity provides offloading that should decrease the incidence of osteoarthritis in spaceflight, but there is anecdotal evidence of cartilage damage caused by spaceflight. This is a new area of active research. The effect of spaceflight on the incidence of arthritis in-flight is currently unknown.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.02295,"incidence_sd":0.0001136,"incidence_text":"mean: 0.02295 SD: 1.136E-4","treated_best":{"probability_pct":[90.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":0.3,"cp2_ti_pct":0.0,"cp2_hours":[72.0,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,10.0],"cp1_ti_pct":100.0,"cp1_hours":1.2,"cp2_ti_pct":12.7292,"cp2_hours":[120.0,360.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.3,"cp2_ti_pct":21.9506,"cp2_hours":[168.0,336.0],"cp3_ti_pct":21.9506,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.2,"cp2_ti_pct":49.2161,"cp2_hours":[336.0,1080.0],"cp3_ti_pct":49.2161,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"atrial-fibrillation-atrial-flutter","icl":"ICL10","name":"Atrial Fibrillation/Atrial Flutter","category":"Cardiovascular Conditions","cliff":{"label":"Atrial Fibrillation/Atrial Flutter CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/atrial-fibrillation-atrial-flutter-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Atrial Fibrillation/Atrial Flutter CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/atrial-fibrillation-atrial-flutter-cliff.pdf","list":"cliff100"},"summary":"Atrial fibrillation (A-Fib) is an irregular rhythm of the heart due to irregular contractility of the atria (out of sync with the ventricles). Symptoms can include palpitations, dizziness, shortness of breath, and weakness. (Mayo Clinic, NHLBI/NIH) There are four primary classifications of A-Fib: 1) Paroxysmal – a brief episode lasting 24 hours to 1 week in duration. 2) Persistent – an episode lasting longer than a week (but may resolve spontaneously). 3) Long-term persistent – An episode lasting more than a year. 4) Permanent – A-Fib that persists despite treatment. (NHLBI/NIH) Although terrestrially, A-Fib often presents with a rapid heart rate (Mayo Clinic), in astronauts it is often within a normal range. This is felt to be secondary to increased vagal tone in crewmembers due to their high level of physical fitness. (Barr, 2010). This may explain why most crewmembers diagnosed with A-Fib are found incidentally (Barr, 2010). Atrial fibrillation increases the risk of blood clot formation in the atria, thereby increasing the risk of ischemic cerebrovascular accident (Mayo Clinic). Treatment can include medications for rate control, anticoagulation, cardioversion, or ablation. In rare cases associated with bradycardia, pace making is required. (NHLBI/NIH) Atrial flutter is also caused by an abnormal rhythm of the atria, but it is regular and rapid. It also carries a risk of blood clot formation, increasing the risk of ischemic CVA. (Mayo Clinic)","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.00207,"incidence_sd":0.0007019,"incidence_text":"Mean: 0.00207 SD: 7.019E-4","treated_best":{"probability_pct":[62.52,62.52],"cp1_ti_pct":100.0,"cp1_hours":2.26,"cp2_ti_pct":0.0,"cp2_hours":[0.1,30.4],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,1.6]},"treated_worst":{"probability_pct":[37.48,37.48],"cp1_ti_pct":100.0,"cp1_hours":2.43,"cp2_ti_pct":27.4116,"cp2_hours":[0.3,127.0],"cp3_ti_pct":5.60723,"rtdc_pct":[10.0,59.0],"locl_pct":[0.0,7.09]},"untreated_best":{"cp1_hours":2.26,"cp2_ti_pct":9.11507,"cp2_hours":[0.1,30.4],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,1.6]},"untreated_worst":{"cp1_hours":2.43,"cp2_ti_pct":100.0,"cp2_hours":[0.3,127.0],"cp3_ti_pct":100.0,"rtdc_pct":[10.0,59.0],"locl_pct":[0.0,10.18]},"extraction":"automatic"}},{"cliff_id":"barotrauma-ear-sinus-block","icl":"ICL11","name":"Barotrauma (Ear/Sinus Block)","category":"Otolaryngological Conditions","cliff":{"label":"Barotrauma (Ear Sinus Block) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/barotrauma-ear-sinus-block-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Barotrauma (Ear Sinus Block) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/barotrauma-ear-sinus-block-cliff.pdf","list":"cliff100"},"summary":"This condition is most likely to be associated with ambient pressure changes during an EVA. Therefore. inflight data would be most applicable. Barotrauma of the ear and sinuses occurs when there are pressure changes in the gases trapped within these cavities. This condition happens when there is a difference in pressure between the enclosed volume and the ambient pressure, and the change in ambient pressure overcomes the capacity of the enclosed space to equalize. Changes in pressure occur during space flight missions when the crewmember is transferring between habitable volumes of differing pressures (such as in an airlock), when pressurizing and depressurizing for an EVA, and when contingencies result in changing pressures in the spacecraft. During some space shuttle missions, the cabin pressure was lowered to 10.2 psi to reduce the amount of time needed to pre-breathe by EVA astronauts. It is felt that the risk of barotrauma at constant cabin pressure is extremely low and can be considered zero. Accordingly, the incidence is based on the number of EVA’s that are performed during a mission with each participating crewmember at risk. It is felt that this approach represents a significant improvement from the previous IMM CLIFF that covered this condition. This medical condition is mission phase dependent. It is postulated to occur only during the pressure changes associated with EVA. The risk is considered to be zero during periods when the cabin pressure remains constant. Limitations • Under-reporting for this condition could have occurred during past space missions since barotrauma may be mild and easily cleared by the crew. This could result in underestimation of the incidence. • If there are significant cabin pressure changes during transition from a lunar/Martian lander and habitat to an orbiting vehicle, these events may also result in barotrauma. Each such occurrence should be considered as a separate at-risk event, equal to an individual EVA. Reconsideration of these risks will need to be done after IMPACT 1.0. • It is important that MPRAT implement the calculated incidence on a per-crewmember basis. In other words, if three crewmembers experience a pressure change as a result of an EVA, these are three separate events.","applicability":{"incidence_type":"EVA","segment":"EVA All","envs":["T1","T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.1043,"incidence_sd":0.0142,"incidence_text":"mean: 0.1043 and SD: 0.0142","treated_best":{"probability_pct":[98.0,98.0],"cp1_ti_pct":100.0,"cp1_hours":0.7,"cp2_ti_pct":11.6264,"cp2_hours":[24.0,288.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[2.0,2.0],"cp1_ti_pct":100.0,"cp1_hours":1.25,"cp2_ti_pct":45.3893,"cp2_hours":[24.0,1344.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,9.1],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.7,"cp2_ti_pct":11.6264,"cp2_hours":[24.0,288.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.25,"cp2_ti_pct":53.2421,"cp2_hours":[24.0,1344.0],"cp3_ti_pct":6.77651,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"benzodiazapine-or-opioid-overdose","icl":"ICL12","name":"Benzodiazapine Or Opioid Overdose","category":"Medication Overdose","cliff":{"label":"Benzodiazapine/Opioid Overdose CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/benzodiazapine-or-opioid-overdose-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Benzodiazapine/Opioid Overdose CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/benzodiazepine-and-opiate-overdose-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Benzodiazepines (BZD) are sedatives frequently prescribed for insomnia and anxiety. A BZD suppresses the central nervous system by enhancing the effects of GABA (the primary inhibitory neurotransmitter) in the brain (Griffin 2013). Overdosing on BZD often leads to CNS depression, including symptoms such as altered mental status, slurred speech, and ataxia. Severe respiratory depression is uncommon in isolated BZD overdoses, however, concurrent use of other sedatives, such as opiates, can lead to respiratory arrest, which can be treated with the reversal agent flumazenil (Höjer 1989,Garg 2017, Jones 2015). Opioids include pain-relieving prescription medications such as morphine, oxycodone, hydrocodone, fentanyl, hydromorphone and methadone. Opioids interact with opioid receptors in the body producing analgesic effects and can also cause euphoria (Camí 2003). Opioid overdose similarly leads to altered mental status due to CNS depression, but compared to BZD, respiratory suppression is more pronounced and is often fatal without treatment (White 1999). Naloxone is a short-acting opioid antagonist that can be used as initial management of overdose by immediately reversing the opioid effect on the receptor (Bertini 1992) . However, treatment for both BZD and opioid overdose is supportive and the survival of flight crew will be dependent upon having necessary respiratory support and pharmacologic interventions available.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.00105,"incidence_sd":8.672e-06,"incidence_text":"Mean: 0.00105 SD 8.672E-6","treated_best":{"probability_pct":[55.0,55.0],"cp1_ti_pct":100.0,"cp1_hours":0.73,"cp2_ti_pct":50.0,"cp2_hours":[4.0,8.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[45.0,45.0],"cp1_ti_pct":100.0,"cp1_hours":0.73,"cp2_ti_pct":50.0,"cp2_hours":[4.0,48.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,10.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.73,"cp2_ti_pct":50.0,"cp2_hours":[4.0,8.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.73,"cp2_ti_pct":100.0,"cp2_hours":[8.0,48.0],"cp3_ti_pct":100.0,"rtdc_pct":[0.0,0.0],"locl_pct":[20.0,80.0]},"extraction":"automatic"}},{"cliff_id":"bhp-adjustment-disorder","icl":"ICL13","name":"Bhp - Adjustment Disorder","category":"Behavioral or Mental Health Alterations","cliff":{"label":"Adjustment Disorder CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-adjustment-disorder-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"BHP Adjustment Disorder CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-adjustment-disorder-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Adjustment disorder occurs when there is a maladaptive response, either emotional or behavioral, to a recognized psychosocial stressor (O’Donnell et al., 2019). The reaction must ensue within three months of the reactionary event. The resulting response must be uncharacteristic or out of proportion to the severity of socially accepted reactions. The symptoms must not represent normal bereavement, nor can they be attributed to a different behavioral disorder (Zelviene et al., 2018). The DSM-5 changed the classification of this condition to a traumatic condition; however, the actual definition of adjustment disorder has not changed from the DSM-4 (Bachem et al., 2018). Adjustment disorder should resolve when the stressor is removed or a different level of adaptation is reached, which can include a transition to a different mental-health pathology. In previous IMM efforts, all behavioral pathologies were grouped into a single CLiFF entitled “Behavioral Emergency CLiFF.” For this iteration, with the expertise from NASA’s Behavioral Health and Performance (BHP) program, certain syndromes that were thought to be most relevant to spaceflight were identified for their own CLiFF conditions. Regrettably, previous LSAH pulls did not attempt to classify behavioral conditions. A repeat LSAH pull is not currently possible. Per the prior effort: “to date, no behavioral emergencies have occurred before, during or after any U.S. space flight.\" Unfortunately, it is unknown how this statement relates to the incidence of adjustment disorder, as this condition is often not characterized as an emergency. Related conditions covered in other CLiFFs include anxiety, depression, grief-reaction, psychosis secondary to depression and sleep disturbance.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.03834,"incidence_sd":0.01113,"incidence_text":"mean 0.03834 and SD 0.01113","treated_best":{"probability_pct":[65.0,65.0],"cp1_ti_pct":100.0,"cp1_hours":0.7333,"cp2_ti_pct":0.0,"cp2_hours":[24.0,4380.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[35.0,35.0],"cp1_ti_pct":100.0,"cp1_hours":0.7333,"cp2_ti_pct":29.1257,"cp2_hours":[4380.0,8760.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,7.1],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.7333,"cp2_ti_pct":0.0,"cp2_hours":[24.0,4380.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.7333,"cp2_ti_pct":29.1257,"cp2_hours":[4380.0,8760.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,7.1],"locl_pct":[0.0,4.0]},"extraction":"automatic"}},{"cliff_id":"bhp-anxiety","icl":"ICL14","name":"Bhp - Anxiety","category":"Behavioral or Mental Health Alterations","cliff":{"label":"Anxiety CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-anxiety-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"BHP Anxiety CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-anxiety-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Anxiety is difficult to define given that the medical reference literature uses varying, inconsistent, and often vague terminology. Generally, it implies apprehension or fear from a potential threat that is typically out of proportion to the situation and hinders the ability to function normally. The DSM-5 groups the following under “Anxiety Disorders”: generalized anxiety disorder, panic disorder, phobias, specific phobia, agoraphobia, social anxiety disorder, separation anxiety disorder (Kogan et al., 2016). However, an astronaut may experience isolated episodes of anxiety without being diagnosed with a psychiatric comorbidity. In Roma et al. (2021), “anxiety” was grouped into “negative valence systems” along with “malaise”, “loss of appetite”, and “irritability” using the National Institute of Mental Health’s (NIMH) Research Domain Criteria (RDoC) framework. This study does examined the interactions between spaceflight medical operations and behavioral health and found that negative valence systems occur frequently (53%) with documented medical conditions. In previous IMM efforts, all behavioral pathologies were grouped into a single CLiFF entitled “Behavioral Emergency CLiFF.” For this iteration, with the expertise from NASA’s Behavioral Health and Performance (BHP) program, certain syndromes that were thought to be most relevant to spaceflight were identified for their own CLiFF conditions. Regrettably, previous LSAH pulls did not attempt to classify behavioral conditions. A repeat LSAH pull is not currently possible. Per the prior effort: “to date, no behavioral emergencies have occurred before, during or after any U.S. space flight.\" Unfortunately, it is unknown how this statement relates to the incidence of transient episodes of anxiety, as this condition is often not characterized as an emergency. Related conditions covered in other CLiFFs include adjustment disorder, depression, grief-reaction, psychosis secondary to depression and sleep disturbance.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.8318,"incidence_sd":0.1715,"incidence_text":"mean 0.8318 and SD 0.1715","treated_best":{"probability_pct":[99.43,99.43],"cp1_ti_pct":100.0,"cp1_hours":0.7333,"cp2_ti_pct":5.60723,"cp2_hours":[1.0,4379.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.57,0.57],"cp1_ti_pct":100.0,"cp1_hours":0.7333,"cp2_ti_pct":29.1257,"cp2_hours":[4380.0,11096.0],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,3.64],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.7333,"cp2_ti_pct":29.1257,"cp2_hours":[1.0,4379.0],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.7333,"cp2_ti_pct":29.1257,"cp2_hours":[4380.0,11096.0],"cp3_ti_pct":29.1257,"rtdc_pct":[0.0,3.64],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"bhp-depression","icl":"ICL15","name":"Bhp - Depression","category":"Behavioral or Mental Health Alterations","cliff":{"label":"Depression CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-depression-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"BHP Psychosis (Secondary to Depression) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-psychosis-secondary-to-depression-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Depressive mood characterized by apathy, low-motivation, irritability, can occur in highly screened spaceflight participants to both planned and unexpected events. If that depressive mood persists for more than two weeks and causes significant distress or impairment in social, occupation or other areas of functioning, major depressive disorder may be diagnosed. NASA distinguishes between a behavioral event and a psychiatric disorder by the following: “a behavioral condition is any decrement in mood, cognition, morale, or interpersonal interaction that adversely affects operational readiness or performance; whereas a psychiatric disorder is one that meets the DSM criteria for diagnosis of a disorder” (Slack et al., 2016). Events that may affect spaceflight participants that lead to this condition may include death of family members or friends, crew friction, frustration with ground team, other medical emergencies, delayed return to earth and other unexpected events. Although there have been no behavioral emergencies or diagnoses of major depressive disorder during spaceflight, there have been reports of depressive mood symptoms (Slack et al., 2016). We expect that depressive symptoms in crewmembers are likely underreported given concern to potentially jeopardize future flight status. In previous IMM efforts, all behavioral pathologies were grouped into a single CLiFF entitled “Behavioral Emergency CLiFF.” For this iteration, with the expertise from NASA’s Behavioral Health and Performance (BHP) program, certain syndromes that were thought to be most relevant to spaceflight were identified for their own CLiFF conditions. Regrettably, previous LSAH pulls did not attempt to classify behavioral conditions. A repeat LSAH pull is not currently possible. Related conditions covered in other CLiFFs include adjustment disorder, anxiety, grief-reaction, psychosis secondary to depression and sleep disturbance.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0415,"incidence_sd":0.0116,"incidence_text":"mean 0.0415 and SD 0.0116","treated_best":{"probability_pct":[85.0,85.0],"cp1_ti_pct":100.0,"cp1_hours":0.78333,"cp2_ti_pct":1.18257,"cp2_hours":[1.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[15.0,15.0],"cp1_ti_pct":100.0,"cp1_hours":0.78333,"cp2_ti_pct":33.2846,"cp2_hours":[336.0,17520.0],"cp3_ti_pct":0.0,"rtdc_pct":[2.6,11.8],"locl_pct":[0.0,4.2]},"untreated_best":{"cp1_hours":0.78333,"cp2_ti_pct":2.36513,"cp2_hours":[1.0,336.0],"cp3_ti_pct":2.36513,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.78333,"cp2_ti_pct":66.5692,"cp2_hours":[336.0,17520.0],"cp3_ti_pct":66.5692,"rtdc_pct":[2.6,11.8],"locl_pct":[0.0,4.2]},"extraction":"automatic"}},{"cliff_id":"bhp-grief-reaction","icl":"ICL16","name":"Bhp - Grief Reaction","category":"Behavioral or Mental Health Alterations","cliff":{"label":"Grief Reaction CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-grief-reaction-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"BHP Grief Reaction CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-grief-reaction-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Grief can be experienced in response to any significant loss, but most profoundly after the death of a close family member. In space, death aboard the spacecraft would have profound effect on the crew, potentially leading to grief, but the more likely scenario would be death of a terrestrial family member while the crewmember is in flight. Acute grief reaction can cause emotional and somatic distress and impaired function, but would generally not require treatment (Shear, 2017). The progression of grief determines whether the reaction is considered pathological. The difference between normal grief and prolonged grief disorder (or complicated grief) is marked by the prolonged functional debilitating symptoms experienced in grief disorder (Prigerson, 2021). When prolonged grief disorder is diagnosed or suspected, treatment is usually necessary to decrease morbidity and mortality (Mancini, 2012). The representations of grief can also differ dramatically between individuals and commonly evolve with time. These symptoms could range from intense sadness and insomnia to feelings of guilt, increased hostility, and social withdrawal (Lindemann, 1979). Although treatment such as pharmacotherapy is generally not required for acute grief reaction (Mancini, 2012), in complicated grief reaction the use of psychotherapy with antidepressant can reduce suicidality from 18% incidence to 3.5% incidence (Shear 2016).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0001909,"incidence_sd":9.576e-05,"incidence_text":"mean 1.909E-4 and SD 9.576E-5","treated_best":{"probability_pct":[93.0,93.0],"cp1_ti_pct":100.0,"cp1_hours":0.649967,"cp2_ti_pct":0.0,"cp2_hours":[0.0,4320.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[7.0,7.0],"cp1_ti_pct":100.0,"cp1_hours":0.649967,"cp2_ti_pct":29.1257,"cp2_hours":[720.0,8760.0],"cp3_ti_pct":0.0,"rtdc_pct":[9.0,42.0],"locl_pct":[0.0,4.0]},"untreated_best":{"cp1_hours":0.649967,"cp2_ti_pct":0.0,"cp2_hours":[0.0,8760.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.649967,"cp2_ti_pct":29.1257,"cp2_hours":[4380.0,8760.0],"cp3_ti_pct":29.1257,"rtdc_pct":[9.0,49.0],"locl_pct":[4.0,18.0]},"extraction":"automatic"}},{"cliff_id":"bhp-psychosis-secondary-to-depression","icl":"ICL17","name":"Bhp - Psychosis Secondary To Depression","category":"Behavioral or Mental Health Alterations","cliff":{"label":"Psychosis (Secondary to Depression) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-psychosis-secondary-to-depression-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"BHP Psychosis (Secondary to Depression) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-psychosis-secondary-to-depression-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Although depression is the most common mental health disease in the United States and Europe, psychosis is an uncommon feature of this disorder, affecting 14-19% of those suffering a major depressive episode (Ohayon, 2002). This condition is generally described as depression with psychotic features or psychotic depression. Psychotic features can include auditory or visual hallucinations, delusions, disorganization, catatonia, aggression, and many more. There is significant overlap in the features of this condition and other behavioral emergencies such as schizophrenia, delusional disorder, and brief psychotic disorder (Parker, 2014). No behavioral emergencies have occurred during spaceflight; however, as spaceflight mission duration increases, the probability of these disorders affecting a member of the crew also increases (Slack, 2009).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_text":"0.0000438 events/person-yr","treated_best":{"probability_pct":[22.0,22.0],"cp1_ti_pct":100.0,"cp1_hours":0.85,"cp2_ti_pct":31.9559,"cp2_hours":[0.0,24.0],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[78.0,78.0],"cp1_ti_pct":100.0,"cp1_hours":0.85,"cp2_ti_pct":96.3061,"cp2_hours":[672.0,1344.0],"cp3_ti_pct":93.2501,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,0.61]},"untreated_best":{"cp1_hours":0.85,"cp2_ti_pct":39.8352,"cp2_hours":[0.0,24.0],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.85,"cp2_ti_pct":99.6811,"cp2_hours":[1440.0,5040.0],"cp3_ti_pct":99.3622,"rtdc_pct":[100.0,100.0],"locl_pct":[0.61,4.2]},"extraction":"automatic"}},{"cliff_id":"bhp-sleep-disturbance","icl":"ICL18","name":"Bhp - Sleep Disturbance","category":"Sleep Disturbance","cliff":{"label":"Sleep Disturbance CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-sleep-disturbance-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"BHP Sleep Disturbance CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/bhp-sleep-disturbance-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Sleep disturbance relates to sleep disorders that occur during spaceflight, affecting the number of hours of sleep, sleep-onset latency, quality of sleep and circadian rhythm, resulting in less than 8 hours of sleep. Sleep disturbance occurs after the first 5 days of spaceflight, not related to space adaptation. Sleep disturbance is a common condition, contributed to by noisy environments, shift work, workload and crew motivation resulting in chronic sleep debt. This is treated with non-benzodiazepine hypnotics and melatonin (Barratt et al., 2019).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_sd":0.3378,"incidence_text":"5.119 mean, sd 0.3378","treated_best":{"probability_pct":[99.0,99.0],"cp1_ti_pct":100.0,"cp1_hours":0.65,"cp2_ti_pct":14.5628,"cp2_hours":[24.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[1.0,1.0],"cp1_ti_pct":100.0,"cp1_hours":0.64996,"cp2_ti_pct":17.5259,"cp2_hours":[24.0,2920.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.65,"cp2_ti_pct":29.1257,"cp2_hours":[24.0,72.0],"cp3_ti_pct":29.1257,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.64996,"cp2_ti_pct":35.0518,"cp2_hours":[24.0,2920.0],"cp3_ti_pct":35.0518,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"burn-chemical-eye","icl":"ICL19","name":"Burn - Chemical Eye","category":"Eye Injury","cliff":{"label":"Burn Chemical Eye CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/burn-chemical-eye-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Eye Chemcial Burn CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/eye-chemical-burn-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Burn Chemical Eye CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/burn-chemical-eye-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Chemical burns to the eye vary in severity, with severe cases often resulting in complications such as glaucoma, leading to profound visual consequences. In adults, these injuries are often occupation-related, and are amongst one of the most common workplace related injuries (Xiang, 2005). Alkali chemicals have been shown to cause more severe damage to the eye compared to acidic chemicals. Immediate eye irrigation therapy is the most important initial management of chemical eye burns. It has been shown to reduce severity of ocular damage, need for surgery, and improve visual outcome (Kuckelkorn, 1995). Subsequent treatments aim to promote reepithelization and surgical management to restore normal ocular surface anatomy and visual function. Prompt referral to receive advance treatments and good adherence to therapy have been found to greatly improve visual outcomes (Bizrag, 2019). Most cases of chemical eye burns can be prevented with the use of proper eye protection (Kuckelkorn, 1995).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.08787,"incidence_sd":0.04409,"incidence_text":"mean 0.08787 and SD 0.04409","treated_best":{"probability_pct":[90.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":50.0,"cp2_hours":[0.0,2.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,10.0],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":54.5575,"cp2_hours":[2.0,5040.0],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.5,"cp2_ti_pct":50.0,"cp2_hours":[0.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.5,"cp2_ti_pct":65.9049,"cp2_hours":[168.0,5040.0],"cp3_ti_pct":31.8097,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"burn-chemical-skin","icl":"ICL20","name":"Burn - Chemical Skin","category":"Skin Injury","cliff":{"label":"Burn Chemical Skin CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/burn-chemical-skin-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Burn Chemical Skin CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/burn-chemical-skin-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"There are countless chemicals used in everyday functions that can cause caustic skin injury. This number continues to climb and as the industry synthesizes new formulations with novel properties. Chemical burns are a common household as well as work related injury and can vary between minor and life altering. Astronaut crew members are required to perform countless tasks while in flight from maintenance, to engineering, to scientific research and thus are also exposed chemicals that may have a number of cutaneous and systemic effects. Both acidic and alkaline chemicals can cause significant injury and threaten crew function, require medical evacuation, or even result in LOCL. Risk of chemical skin burn among crew members is dependent on engineering and crew functions during flight and may vary widely depending on the generation or stage of the mission.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.000109,"incidence_sd":5.587e-06,"incidence_text":"Mean=1.09E-4; SD= 5.587E-6","treated_best":{"probability_pct":[4
