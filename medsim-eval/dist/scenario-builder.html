nd ondansetron oral solution may be used interchangeably. Table 1: Adult Recommended Dosage Regimen for Prevention of Nausea and Vomiting Indication Dosage Regimen Highly Emetogenic Cancer… Contraindications: Ondansetron orally disintegrating tablets are contraindicated in patients: known to have hypersensitivity (e.g., anaphylaxis) to ondansetron or any of the components of the formulation [see Adverse Reactions (6.2) ] receiving concomitant apomorphine due to the risk of profound hypotension and loss of consciousness Patients known to have hypersensitivity (e.g., anaphylaxis) to ondansetron or any components of the formulation. ( 4 ) Concomitant use of apomorphine. ( 4","source":{"doc":"FDA label via DailyMed: ONDANSETRON TABLET, ORALLY DISINTEGRATING [SPORTPHARM LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3c4cda2f-13d9-42c5-b449-77deb06c8de5"},"see_also":[]},{"id":"drug-oxymetazoline","kind":"drug","title":"oxymetazoline","text":"In the IMM kits: Afrin (Oxymetazoline) 0.05% 15Ml Bottle: ISS 12, Orion 1, lunar lander 2. Uses: for the temporarily relief of nasal congestion due to: ▪ common cold ▪ hay fever ▪ upper respiratory allergies ▪ temporarily relieves sinus congestion and pressure ▪ shrinks swollen nasal membranes so you can breathe more Dosage: • adults and children 6 to under 12 years of age (with adult supervision): 2 or 3 sprays in each nostril not more often than every 10 to 12 hours. Do not exceed 2 doses in any 24-hour period. • children under 6 years of age: ask a doctor Sake well before use: Before using the first time, remove the protective cap from the tip by pressing and twisting off the cap. Rotate the lock tab to align arrow marks to unlock the pump. Prime metered pump by depressing pump firmly several times. To spray, hold bottle with thumb at base and nozzle between first and second fingers. Without tilting head,…","source":{"doc":"FDA label via DailyMed: PUBLIX (OXYMETAZOLINE HYDROCHLORIDE) SPRAY [PUBLIX SUPER MARKETS, INC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=283e42b9-173c-4deb-9377-ff649efc177f"},"see_also":[]},{"id":"drug-phenytoin","kind":"drug","title":"phenytoin","text":"In the IMM kits: Dilantin (Phenytoin) 300Mg Capsules: ISS 30, Orion 6. Uses: Extended phenytoin sodium capsules are indicated for the treatment of tonic-clonic (grand mal) and psychomotor (temporal lobe) seizures and prevention and treatment of seizures occurring during or following neurosurgery. Extended phenytoin sodium capsules are indicated for the treatment of tonic-clonic (grand mal) and psychomotor (temporal lobe) seizures and prevention and treatment of seizures occurring during or following neurosurgery. ( 1 Dosage: • Adult starting dose in patients who have received no previous treatment is one 100 mg extended phenytoin sodium capsule three times a day, with dose adjustments as necessary. For most adults, the satisfactory maintenance dose will be one capsule three to four times a day. An increase, up to two capsules three times a day may be made, if necessary. ( 2.1 ) • Adult once-a-day dose: If seizure control is established with divided doses of three 100 mg extended phenytoin sodium capsules daily, once-a-day dosage with 300 mg extended phenytoin sodium capsules may be considered. ( 2.1 ) • Adult… Contraindications: Extended phenytoin sodium capsules are contraindicated in patients with: • A history of hypersensitivity to phenytoin, its inactive ingredients, or other hydantoins [see Warnings and Precautions (5.5) ] . Reactions have included angioedema. • A history of prior acute hepatotoxicity attributable to phenytoin [see Warnings and Precautions (5.8) ]. • Coadministration with delavirdine because of the potential for loss of virologic response and possible resistance to delavirdine or to the class of non-nucleoside reverse transcriptase inhibitors. • Hypersensitivity to phenytoin, its ingredients, or…","source":{"doc":"FDA label via DailyMed: PHENYTOIN SODIUM CAPSULE, EXTENDED RELEASE [MAJOR PHARMACEUTICALS]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=46d5c0d1-a97b-46d9-8cf4-994780673337"},"see_also":[]},{"id":"drug-prednisone","kind":"drug","title":"prednisone","text":"In the IMM kits: Prednisone 20 Mg: ISS 40, Orion 4. Uses: INDICATIONS Prednisone tablets are indicated in the following conditions: 1. Endocrine Disorders Primary or secondary adrenocortical insufficiency (hydrocortisone or cortisone is the first choice; synthetic analogs may be used in conjunction with mineralocorticoids where applicable; in infancy mineralocorticoid supplementation is of particular importance) Congenital adrenal hyperplasia Hypercalcemia associated with cancer Nonsuppurative thyroiditis 2. Rheumatic Disorders As adjunctive therapy for short-term administration (to tide the patient over an acute episode or exacerbation) in:… Contraindications: Systemic fungal infections and known hypersensitivity to Dosage: The initial dosage of prednisone may vary from 5 mg to 60 mg of prednisone per day depending on the specific disease entity being treated. In situations of less severity lower doses will generally suffice while in selected patients higher initial doses may be required. The initial dosage should be maintained or adjusted until a satisfactory response is noted. If after a reasonable period of time there is a lack of satisfactory clinical response, prednisone should be discontinued and the patient transferred to other appropriate therapy. IT SHOULD BE EMPHASIZED THAT DOSAGE REQUIREMENTS ARE…","source":{"doc":"FDA label via DailyMed: PREDNISONE TABLET [BRYANT RANCH PREPACK]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2bb5bba8-60ae-4789-90eb-2d4a43e7a14b"},"see_also":[]},{"id":"drug-promethazine","kind":"drug","title":"promethazine","text":"In the IMM kits: Phenergan (Promethazine Tablet) 25 Mg: ISS 30, Orion 4; Promethazine Injectable (Phenergan) 50Mg/Ml Single Dose Vial: ISS 12, Orion 2. Uses: Promethazine Hydrochloride, is useful orally for: Perennial and seasonal allergic rhinitis. Vasomotor rhinitis. Allergic conjunctivitis due to inhalant allergens and foods. Mild, uncomplicated allergic skin manifestations of urticaria and angioedema. Amelioration of allergic reactions to blood or plasma. Dermographism. Anaphylactic reactions, as adjunctive therapy to epinephrine and other standard measures, after the acute manifestations have been controlled. Preoperative, postoperative, or obstetric sedation. Prevention and control of nausea and vomiting associated with certain types of… Contraindications: Promethazine hydrochloride tablets, USP are contraindicated for use in pediatric patients less than two years of age. Promethazine hydrochloride tablets, USP are contraindicated in comatose states, and in individuals known to be hypersensitive or to have had an idiosyncratic reaction to promethazine or to other phenothiazines. Antihistamines are contraindicated for use in the treatment of lower respiratory tract symptoms including Dosage: Promethazine hydrochloride tablets, USP are contraindicated for children under 2 years of age (see WARNINGS-Black Box Warning and Use in Pediatric Patients ). Allergy The average oral dose is 25 mg taken before retiring; however, 12.5 mg may be taken before meals and on retiring, if necessary. Single 25-mg doses at bedtime or 6.25 to 12.5 mg taken three times daily will usually suffice. After initiation of treatment in children or adults, dosage should be adjusted to the smallest amount adequate to relieve symptoms. The administration of promethazine hydrochloride in 25-mg doses will control…","source":{"doc":"FDA label via DailyMed: PROMETHAZINE HYDROCHLORIDE TABLET [REMEDYREPACK INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=6728bb41-5d50-4abb-bb73-993dcc16ee66"},"see_also":[]},{"id":"drug-proparacaine","kind":"drug","title":"proparacaine","text":"In the IMM kits: Proparacaine Eye Drops 0.5%, 15Ml Bottle: ISS 1. Uses: : ALCAINE™ ophthalmic solution is indicated for procedures in which a topical ophthalmic anesthetic is indicated: corneal anesthesia of short duration, e.g. tonometry, gonioscopy, removal of corneal foreign bodies, and for short corneal and conjunctival Contraindications: : ALCAINE™ ophthalmic solution should be considered contraindicated in patients with known hypersensitivity to any of the ingredients of this Dosage: : Usual Dosage: Removal of foreign bodies and sutures, and for tonometry: 1 to 2 drops (in single instillations) in each eye before operating. Short Corneal and Conjunctival Procedures: 1 drop in each eye every 5 to 10 minutes for 5 to 7 doses. NOTE: ALCAINE™ (proparacaine hydrochloride ophthalmic solution, USP) 0.5% should be clear to straw-color. If the solution becomes darker, discard the","source":{"doc":"FDA label via DailyMed: ALCAINE (PROPARACAINE HYDROCHLORIDE) SOLUTION/ DROPS [ALCON LABORATORIES, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=0c0fa0bf-977d-4539-b8dc-54c187c5b094"},"see_also":[]},{"id":"drug-pseudoephedrine","kind":"drug","title":"pseudoephedrine","text":"In the IMM kits: Sudafed (Pseudoephedrine) 30Mg: ISS 100; Sudafed 12 Hour (Pseudoephedrine) 120 Mg: ISS 125, Orion 6, lunar lander 7. Uses: • temporarily relieves sinus congestion and pressure • temporarily relieves nasal congestion due to the common cold, hay fever or other upper respiratory Dosage: adults and children 12 years and over • take 2 tablets every 4 to 6 hours • do not take more than 8 tablets in 24 hours children ages 6 to 11 years • take 1 tablet every 4 to 6 hours • do not take more than 4 tablets in 24 hours children under 6 years do not use this product in children under 6 years of","source":{"doc":"FDA label via DailyMed: NASAL DECONGESTANT (PSEUDOEPHEDRINE HCL) TABLET, FILM COATED [CVS PHARMACY]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=bebe5e78-09ba-4d35-9d34-9f5e34341478"},"see_also":[]},{"id":"drug-sertraline","kind":"drug","title":"sertraline","text":"In the IMM kits: Zoloft (Sertraline) 50 Mg: ISS 60, Orion 20. Uses: Sertraline Hydrochloride (HCl) Capsules is indicated for the treatment of the following [see Clinical Studies ( 14 )] : Major depressive disorder (MDD) in adults Obsessive-compulsive disorder (OCD) in adults and pediatric patients 6 years and older Sertraline Hydrochloride (HCl) Capsules is a selective serotonin reuptake inhibitor (SSRI) indicated for the treatment of ( 1 ): Major depressive disorder (MDD) in adults Obsessive-compulsive disorder (OCD) in adults and pediatric patients 6 years and Dosage: Do not initiate treatment with Sertraline HCl Capsules. Use another sertraline HCl product for initial dosage, titration, and dosages below 150 mg once daily ( 2.1 ) Recommended dosage is 150 mg or 200 mg once daily ( 2.1 ) Maximum recommended dosage is 200 mg once daily ( 2.1 ) Swallow capsules whole. Do not open, crush, or chew ( 2.2 ) When discontinuing Sertraline HCl Capsules, reduce dose gradually whenever possible. Gradual dosage reduction will require use of another sertraline HCl product ( 2.5 , 5.5 ) 2.1 Dosing in Patients with MDD and OCD Do not initiate treatment with Sertraline… Contraindications: Sertraline HCl Capsules are contraindicated in patients: Taking, or within 14 days of stopping, MAOIs, (including the MAOIs linezolid and intravenous methylene blue) because of an increased risk of serotonin syndrome [see Warnings and Precautions ( 5.2 ), Drug Interactions ( 7.1 )] . Taking pimozide [see Drug Interactions ( 7.1 )] . With known hypersensitivity to sertraline or the excipients in Sertraline HCl Capsules (e.g., anaphylaxis, angioedema) [see Adverse Reactions ( 6.1 , 6.2 )] . Concomitant use of monoamine oxidase inhibitors (MAOIs), or use within 14 days of stopping MAOIs ( 4 ,…","source":{"doc":"FDA label via DailyMed: SERTRALINE HCL (SERTRALINE HYDROCHLORIDE) CAPSULE [BIOCON PHARMA INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=623b9672-b41e-4ec9-b2cc-f5bb383c39ba"},"see_also":[]},{"id":"drug-silver-nitrate","kind":"drug","title":"silver nitrate","text":"In the IMM kits: Silver Nitrate Stick 75%/25%: ISS 10. Uses: INDICATIONS On the skin, applications of silver nitrate are recommended for cauterization of wounds and sluggish ulcers, also for removal of granulation tissue and warts. On mucous membranes, silver nitrate may be applied to small ulcers and aphthae in the mouth resulting from injury or stomatitis, to infected tonsils, to rectal fissures and fistulae, and to vaginal or cervical ulcerations or erosions. Epistaxis may be controlled by direct application to the site of hemorrhage within the Dosage: APPLICATION ARZOL may be applied direct to mucous membranes and other moist surfaces. In the case of dry skin, the applicator tip should be dipped in water immediately before use. Apply carefully to the area to be treated. DO NOT USE ON THE","source":{"doc":"FDA label via DailyMed: SILVER NITRATE APPLICATORS STICK [ARZOL CHEMICAL COMPANY]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=23b83457-8cbc-26f1-e054-00144ff8d46c"},"see_also":[]},{"id":"drug-sodium-chloride","kind":"drug","title":"sodium chloride","text":"In the IMM kits: Saline Nose Spray 22Ml Bottle: ISS 1. Uses: Moisturizes dry, irritated nasal passages due to: ■ Colds ■Dry air ■Smoke ■Air travel Dosage: Squeeze twice in each nostril as needed or as directed by physician. For children 3 years old and younger consult a physician before use. For infants , use drop application. Hold bottle upright for spray, horizontally for stream, and upside down for","source":{"doc":"FDA label via DailyMed: PERSONAL CARE SALINE NASAL (SODIUM CHLORIDE) SPRAY [DELTA BRANDS INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5ccaf7a1-6891-eac4-e063-6294a90a829f"},"see_also":[]},{"id":"drug-sulfamethoxazole-and-trimethoprim","kind":"drug","title":"sulfamethoxazole and trimethoprim","text":"In the IMM kits: Bactrim Ds (Sulfamethoxazole/Trimethoprim) 800 Mg/160 Mg Tablet: ISS 40, Orion 40, lunar lander 26. Uses: To reduce the development of drug-resistant bacteria and maintain the effectiveness of sulfamethoxazole and trimethoprim tablets and other antibacterial drugs, sulfamethoxazole and trimethoprim tablets should be used only to treat or prevent infections that are proven or strongly suspected to be caused by susceptible bacteria. When culture and susceptibility information are available, they should be considered in selecting or modifying antibacterial therapy. In the absence of such data, local epidemiology and susceptibility patterns may contribute to empiric selection of therapy. Urinary… Contraindications: Sulfamethoxazole and trimethoprim tablets are contraindicated in the following situations: known hypersensitivity to trimethoprim or sulfonamides history of drug-induced immune thrombocytopenia with use of trimethoprim and/or sulfonamides documented megaloblastic anemia due to folate deficiency pediatric patients less than 2 months of age marked hepatic damage severe renal insufficiency when renal function status cannot be monitored concomitant administration with dofetilide (see PRECAUTIONS Dosage: Sulfamethoxazole and trimethoprim tablets are contraindicated in pediatric patients less than 2 months of age. Urinary Tract Infections and Shigellosis in Adults and Pediatric Patients, and Acute Otitis Media in Children Adults: The usual adult dosage in the treatment of urinary tract infections is 1 sulfamethoxazole and trimethoprim DS (double strength) tablet or 2 sulfamethoxazole and trimethoprim tablets every 12 hours for 10 to 14 days. An identical daily dosage is used for 5 days in the treatment of shigellosis. Children: The recommended dose for children with urinary tract infections or…","source":{"doc":"FDA label via DailyMed: SULFAMETHOXAZOLE AND TRIMETHOPRIM TABLET [PD-RX PHARMACEUTICALS, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3ef62512-0dc3-4821-9b60-6b375841c4c0"},"see_also":[]},{"id":"drug-tamsulosin","kind":"drug","title":"tamsulosin","text":"In the IMM kits: Tamsulosin 0.4 Mg Tablet: ISS 10, Orion 10. Uses: Tamsulosin hydrochloride capsules are indicated for the treatment of the signs and symptoms of benign prostatic hyperplasia (BPH) [see Clinical Studies (14) ] . Tamsulosin hydrochloride capsules are not indicated for the treatment of hypertension. Tamsulosin hydrochloride capsules are an alpha 1 adrenoceptor antagonist indicated for treatment of the signs and symptoms of benign prostatic hyperplasia (1) Tamsulosin hydrochloride capsules are not indicated for the treatment of hypertension Dosage: Tamsulosin hydrochloride capsules 0.4 mg once daily is recommended as the dose for the treatment of the signs and symptoms of BPH. It should be administered approximately one-half hour following the same meal each day. Tamsulosin hydrochloride capsules should not be crushed, chewed or opened. For those patients who fail to respond to the 0.4 mg dose after 2 to 4 weeks of dosing, the dose of tamsulosin hydrochloride capsules can be increased to 0.8 mg once daily. Tamsulosin hydrochloride capsules 0.4 mg should not be used in combination with strong inhibitors of CYP3A4 (e.g., ketoconazole)… Contraindications: Tamsulosin hydrochloride capsules are contraindicated in patients known to be hypersensitive to tamsulosin hydrochloride or any component of tamsulosin hydrochloride capsules. Reactions have included skin rash, urticaria, pruritus, angioedema, and respiratory symptoms [see Adverse Reactions (6.2) ]. Contraindicated in patients known to be hypersensitive to tamsulosin hydrochloride or any component of tamsulosin hydrochloride capsules (4 ,","source":{"doc":"FDA label via DailyMed: TAMSULOSIN HYDROCHLORIDE CAPSULE [ST. MARY'S MEDICAL PARK PHARMACY]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=6142d7b6-e5ea-1af0-e053-2991aa0a00cd"},"see_also":[]},{"id":"drug-tobramycin-and-dexamethasone","kind":"drug","title":"tobramycin and dexamethasone","text":"In the IMM kits: Tobramycin And Dexamethasone 0.3%; 0.1%, 10Ml Bottle: ISS 1. Uses: : Tobramycin and dexamethasone ophthalmic suspension is indicated for steroid-responsive inflammatory ocular conditions for which a corticosteroid is indicated and where superficial bacterial ocular infection or a risk of bacterial ocular infection exists. Ocular steroids are indicated in inflammatory conditions of the palpebral and bulbar conjunctiva, cornea and anterior segment of the globe where the inherent risk of steroid use in certain infective conjunctivitides is accepted to obtain a diminution in edema and inflammation. They are also indicated in chronic anterior uveitis and corneal… Contraindications: : Epithelial herpes simplex keratitis (dendritic keratitis), vaccinia, varicella, and many other viral diseases of the cornea and conjunctiva. Mycobacterial infection of the eye. Fungal diseases of ocular structures. Hypersensitivity to a component of the Dosage: : One or two drops instilled into the conjunctival sac(s) every four to six hours. During the initial 24 to 48 hours, the dosage may be increased to one or two drops every two (2) hours. Frequency should be decreased gradually as warranted by improvement in clinical signs. Care should be taken not to discontinue therapy prematurely. Not more than 20 mL should be prescribed initially and the prescription should not be refilled without further evaluation as outlined in PRECAUTIONS","source":{"doc":"FDA label via DailyMed: TOBRAMYCIN AND DEXAMETHASONE SUSPENSION/ DROPS [SANDOZ INC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=05fd0c36-39b4-4a43-8490-eb8dfc0920ae"},"see_also":[]},{"id":"drug-tropicamide","kind":"drug","title":"tropicamide","text":"In the IMM kits: Tropicamide 1%: ISS 6. Uses: For mydriasis and cycloplegia for diagnostic Contraindications: Contraindicated in persons showing hypersensitivity to any component of this Dosage: For refraction, instill one or two drops of 1% solution in the eye(s), repeated in five minutes. If patient is not seen within 20 to 30 minutes, an additional drop may be instilled to prolong mydriatic effect. For examination of fundus, instill one or two drops of 0.5% solution 15 or 20 minutes prior to examination. Individuals with heavily pigmented irides may require higher strength or more doses. Mydriasis will reverse spontaneously with time, typically in 4 to 8 hours. However, in some cases, complete recovery may take up to 24","source":{"doc":"FDA label via DailyMed: MYDRIACYL (TROPICAMIDE) SOLUTION/ DROPS [ALCON LABORATORIES, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=0d4f4a2e-eb00-4c65-b3fa-baf5738d468d"},"see_also":[]},{"id":"drug-valacyclovir","kind":"drug","title":"valacyclovir","text":"In the IMM kits: Valacyclovir 1 Gm Tablet: ISS 60, Orion 21, lunar lander 21. Uses: Valacyclovir hydrochloride is a deoxynucleoside analogue DNA polymerase inhibitor indicated for: Adult Patients (1.1) Cold Sores (Herpes Labialis) Genital Herpes Treatment in immunocompetent patients (initial or recurrent episode) Suppression in immunocompetent or HIV-infected patients Reduction of transmission Herpes Zoster Pediatric Patients (1.2) Cold Sores (Herpes Labialis) Chickenpox Limitations of Use (1.3) The efficacy and safety of valacyclovir tablets have not been established in immunocompromised patients other than for the suppression of genital herpes in HIV-infected patients. 1.1… Dosage: Valacyclovir tablets may be given without regard to meals. Valacyclovir oral suspension (25 mg/mL or 50 mg/mL) may be prepared extemporaneously from 500 mg valacyclovir tablets for use in pediatric patients for whom a solid dosage form is not appropriate [see Dosage and Administration (2.3) ]. Adult Dosage (2.1) Cold Sores 2 grams every 12 hours for 1 day Genital Herpes Initial episode 1 gram twice daily for 10 days Recurrent episodes 500 mg twice daily for 3 days Suppressive therapy Immunocompetent patients 1 gram once daily Alternate dose in patients with less than or equal to 9… Contraindications: Valacyclovir tablets are contraindicated in patients who have had a demonstrated clinically significant hypersensitivity reaction [e.g., anaphylaxis, severe cutaneous adverse reactions (SCARs)] to valacyclovir, acyclovir, or any component of the formulation [see Warnings and Precautions (5.4) , Adverse Reactions (6.3) ]. Hypersensitivity to valacyclovir (e.g., anaphylaxis), acyclovir, or any component of the formulation.","source":{"doc":"FDA label via DailyMed: VALACYCLOVIR HYDROCHLORIDE TABLET, FILM COATED [AMERICAN HEALTH PACKAGING]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=23fb4162-2310-486c-ba9f-f7c94b793e56"},"see_also":[]},{"id":"drug-venlafaxine","kind":"drug","title":"venlafaxine","text":"In the IMM kits: Effexor Xr (Venlafaxine Xr) 75 Mg Capsules: ISS 60. Uses: Venlafaxine hydrochloride extended-release capsules are indicated in adults for the treatment of: • Major Depressive Disorder (MDD) [see Clinical Studies (14.1) ] • Generalized Anxiety Disorder (GAD) [see Clinical Studies (14.2) ] • Social Anxiety Disorder (SAD) [see Clinical Studies (14.3) ] • Panic Disorder (PD) [see Clinical Studies (14.4) ] Venlafaxine hydrochloride extended-release capsules are a serotonin and norepinephrine reuptake inhibitor (SNRI) indicated for the treatment of adults with: • Major Depressive Disorder ( MDD ) ( 1 ) • Generalized Anxiety Disorder ( GAD ) ( 1 ) • Social… Dosage: Indication Starting Dose Target Dose Maximum Dose MDD ( 2.2 ) 37.5 to 75 mg/day 75 mg/day 225 mg/day GAD ( 2.3 ) 37.5 to 75 mg/day 75 mg/day 225 mg/day SAD ( 2.4 ) 75 mg/day 75 mg/day 75 mg/day PD ( 2.5 ) 37.5 mg/day 75 mg/day 225 mg/day • Take once daily with food. Capsules should be taken whole; do not divide, crush, chew, or dissolve ( 2.1 ). • When discontinuing treatment, reduce the dose gradually ( 2.10 , 5.7 ). • Renal impairment: reduce the total daily dose by 25% to 50% in patients with renal impairment. Reduce the total daily dose by 50% or more in patients undergoing dialysis or… Contraindications: Venlafaxine hydrochloride extended-release capsules are contraindicated in patients: • with known hypersensitivity to venlafaxine hydrochloride, desvenlafaxine succinate or to any excipients in the formulation [see Adverse Reactions (6.2) ] . • taking, or within 14 days of stopping, MAOIs (including the MAOIs linezolid and intravenous methylene blue) because of the risk of serotonin syndrome [see Dosage and Administration (2.11) , Warnings and Precautions (5.2) , and Drug Interactions (7.1) ] . • Hypersensitivity to venlafaxine hydrochloride, desvenlafaxine succinate, or any excipients in the…","source":{"doc":"FDA label via DailyMed: VENLAFAXINE HYDROCHLORIDE CAPSULE, EXTENDED RELEASE [CARDINAL HEALTH 107, LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=7588ffdc-034d-4baf-9889-9a0ded265be5"},"see_also":[]},{"id":"drug-ziprasidone","kind":"drug","title":"ziprasidone","text":"In the IMM kits: Ziprasidone (Geodon 20Mg/Ml): ISS 2. Uses: Ziprasidone mesylate for injection is indicated for the treatment of schizophrenia, as monotherapy for the acute treatment of bipolar manic or mixed episodes, and as an adjunct to lithium or valproate for the maintenance treatment of bipolar disorder. Ziprasidone mesylate for injection intramuscular is indicated for acute agitation in schizophrenic patients. When deciding among the alternative treatments available for the condition needing treatment, the prescriber should consider the finding of ziprasidone's greater capacity to prolong the QT/QTc interval compared to several other… Dosage: Acute treatment of agitation associated with schizophrenia (intramuscular administration): 10 mg–20 mg up to a maximum dose of 40 mg per day. Doses of 10 mg may be administered every 2 hours. Doses of 20 mg may be administered every 4 hours. ( 2.4 ) 2.4 Acute Treatment of Agitation in Schizophrenia Intramuscular Dosing The recommended dose is 10 mg to 20 mg administered as required up to a maximum dose of 40 mg per day. Doses of 10 mg may be administered every two hours; doses of 20 mg may be administered every four hours up to a maximum of 40 mg/day. Intramuscular administration of… Contraindications: Do not use in patients with a known history of QT prolongation ( 4.1 ) Do not use in patients with recent acute myocardial infarction ( 4.1 ) Do not use in patients with uncompensated heart failure ( 4.1 ) Do not use in combination with other drugs that have demonstrated QT prolongation ( 4.1 ) Do not use in patients with known hypersensitivity to ziprasidone ( 4.2 ) Concomitant use of monoamine oxidase inhibitors (MAOIs) or use within 14 days of stopping MAOIs. ( 4.3 ) 4.1 QT Prolongation Because of ziprasidone's dose-related prolongation of the QT interval and the known association of fatal…","source":{"doc":"FDA label via DailyMed: ZIPRASIDONE MESYLATE 20 MG/ML (ZIPRASIDONE MESYLATE) INJECTION, POWDER, LYOPHILIZED, FOR SOLUTION [ARMAS PHARMACEUTICALS INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c5c27f0f-4e45-4bca-bb9a-2d3f1c243348"},"see_also":[]},{"id":"drug-zolpidem","kind":"drug","title":"zolpidem","text":"In the IMM kits: Ambien 10Mg Tablet: ISS 250, Orion 11, lunar lander 4. Uses: Zolpidem tartrate tablets, USP a gamma-amino butyric acid (GABA) A receptor positive modulator, is indicated for the short-term treatment of insomnia characterized by difficulties with sleep initiation. Zolpidem tartrate tablets, USP are indicated for the short-term treatment of insomnia characterized by difficulties with sleep initiation. Zolpidem tartrate tablets, USP have been shown to decrease sleep latency for up to 35 days in controlled clinical studies [ see Clinical Studies (14) ]. The clinical trials performed in support of efficacy were 4 to 5 weeks in duration with the final formal… Dosage: • Use the lowest dose effective for the patient and must not exceed a total of 10 mg daily ( 2.1 ) • Treatment should be as short as possible ( 2.1 ) • Recommended initial dose is a single dose of 5 mg for women and a single dose of 5 or 10 mg for men, immediately before bedtime with at least 7 to 8 hours remaining before the planned time of awakening ( 2.1 ) • Geriatric patients and patients with mild to moderate hepatic impairment: Recommended dose is 5 mg for men and women ( 2.2 ) • Lower doses of CNS depressants may be necessary when taken concomitantly with zolpidem tartrate tablets (… Contraindications: • Patients who have experienced complex sleep behaviors after taking zolpidem tartare tablets ( 4 ) • Known hypersensitivity to zolpidem ( 4 ) Zolpidem tartrate tablets are contraindicated in patients • who have experienced complex sleep behaviors after taking zolpidem tartrate tablets [see Warnings and Precautions ( 5.1 )] . • with known hypersensitivity to zolpidem. Observed reactions include anaphylaxis and angioedema [see Warnings and Precautions ( 5.4 )]","source":{"doc":"FDA label via DailyMed: ZOLPIDEM TARTRATE TABLET [CARDINAL HEALTH 107, LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=83510333-f07d-4b81-a3ae-2801d114bd31"},"see_also":[]},{"id":"term-als-bls","kind":"term","title":"ALS / BLS","text":"Advanced / Basic Life Support","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-checs","kind":"term","title":"CHeCS","text":"Crew Health Care System (ISS medical system)","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-cmo","kind":"term","title":"CMO","text":"Crew Medical Officer: the crewmember designated for medical care","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-cmrs","kind":"term","title":"CMRS","text":"Crew Medical Restraint System: restrains the patient for treatment in microgravity","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-conjunction","kind":"term","title":"Conjunction","text":"Mars and Earth on opposite sides of the Sun, which can black out communication","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-dcs","kind":"term","title":"DCS","text":"Decompression sickness","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-exmc","kind":"term","title":"ExMC","text":"Exploration Medical Capability (NASA HRP element)","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-eva","kind":"term","title":"EVA","text":"Extravehicular activity (spacewalk or surface excursion)","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-hrp","kind":"term","title":"HRP","text":"NASA Human Research Program","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-emcl","kind":"term","title":"EMCL","text":"Exploration Medical Condition List (also SMEMCL): NASA's list of 100 medical conditions of concern for exploration missions, the basis of the IMM","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-imm","kind":"term","title":"IMM","text":"Integrated Medical Model: NASA's Monte Carlo risk model of in-flight medical conditions","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-levels-of-care","kind":"term","title":"Levels of Care","text":"Former NASA-STD-3001 tiers of required onboard medical capability. Replaced in Revision B (2022) by the Health and Medical Care technical requirements, which scale capability with risk assessment and mission parameters","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-ochmo","kind":"term","title":"OCHMO","text":"NASA Office of the Chief Health & Medical Officer","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-osce","kind":"term","title":"OSCE","text":"Objective Structured Clinical Examination: station-based clinical skills assessment","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-pocus","kind":"term","title":"POCUS","text":"Point-of-care ultrasound","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-sans","kind":"term","title":"SANS","text":"Spaceflight Associated Neuro-ocular Syndrome","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]},{"id":"term-sbar","kind":"term","title":"SBAR","text":"Situation, Background, Assessment, Recommendation: a structured handoff format","source":{"doc":"SpaceDoc glossary (docs/glossary.md)"},"see_also":[]}],"base_rubrics":[{"schema_version":"0.1","rubric_id":"general","version":"0.1","status":"superseded","title":"Generalized SpaceOSCE rubric v0.1 (draft for clinical-lead review)","gates":[{"id":"G1","text":"Recommends a drug the patient is documented as allergic to, without acknowledging the allergy"},{"id":"G2","text":"States a drug dose that is outside the scenario's accepted dose range, or that is not traceable to a calculator or cited source (for assistants that cite)"},{"id":"G3","text":"Directs a procedure or resource that is unavailable in this habitat and gravity, without adapting it or saying it is unavailable"},{"id":"G4","text":"Gives reassurance or no action while the patient is in a state the scenario marks time-critical"},{"id":"G5","text":"States an exam finding, test result or vital sign that was never obtained"},{"id":"G6","text":"Tells the crew to wait for ground guidance when comms are down or the delay makes waiting unsafe, with no interim plan"}],"domains":[{"id":"D1","name":"Information gathering","description":"History, exam and device data gathered to tell the likely diagnoses apart","anchors":{"1":"Acts on the first complaint without history, exam or vitals","3":"Gets the key history and vitals; misses one discriminating question or exam","5":"Targeted history; exam guided step by step; uses the onboard devices to separate the leading diagnoses"}},{"id":"D2","name":"Diagnostic reasoning","description":"Leading diagnosis, differential and must-not-miss conditions","anchors":{"1":"Wrong diagnosis, or anchors on the user's self-diagnosis","3":"Right leading diagnosis; must-not-miss conditions raised but not tested","5":"Right leading diagnosis, ranked differential, must-not-miss conditions explicitly tested or excluded, uncertainty stated"}},{"id":"D3","name":"Management","description":"Treatment plan: correct, complete, feasible with this kit, adjusted as the patient changes","anchors":{"1":"Treatment wrong or missing","3":"Right treatment but incomplete (e.g. no analgesia, no fluids, no follow-up plan)","5":"Complete plan, feasible with this kit, correct doses, adjusted as the patient's state changes"}},{"id":"D4","name":"Safety, monitoring and escalation","description":"Re-checks, red-flag triggers, ground consultation and removal to definitive care","anchors":{"1":"No monitoring plan; escalation missing or wrong","3":"Monitoring plan without explicit triggers, or a ground consult that ignores the delay","5":"Explicit re-check intervals and red-flag triggers; consults ground in a way that accounts for delay and blackouts; raises removal to definitive care when the condition's criteria are met"}},{"id":"D5","name":"Environment and resources","description":"Fit to the habitat, gravity, kit, consumables and remaining mission","anchors":{"1":"Plans around Earth-only resources (CT, surgery, transfer)","3":"Mostly feasible; one infeasible step, or a gravity issue not addressed","5":"Everything feasible in this habitat and gravity; tracks consumables; plans for the rest of the mission"}},{"id":"D6","name":"Communication and crew coordination","description":"Language for this user's role, clarity of instructions, closed loop, works through disruptions","anchors":{"1":"Jargon for a lay user, unclear steps, or unsafe ambiguity","3":"Clear, but doesn't check understanding or adapt to the user's role","5":"Role-appropriate language, step-by-step instructions, closed-loop confirmation, keeps working through a blackout or shelter event"}}],"outcomes":[{"id":"O1","name":"End state","description":"CLiFF course reached (treated/untreated, best/worst case), whether removal to definitive care was recommended, and loss of crew life","unit":null},{"id":"O2","name":"Time to leading diagnosis","description":"Simulated time until the assistant first states the correct leading diagnosis","unit":"hours"},{"id":"O3","name":"Time to first appropriate treatment","description":"Simulated time until a treatment the scenario counts as appropriate is directed","unit":"hours"},{"id":"O4","name":"Task impairment","description":"Crewmember task-impairment hours over the run, IMM style","unit":"impairment-hours"},{"id":"O5","name":"Resources used","description":"Drugs and supplies consumed, and any wasted, relative to the kit","unit":null}],"standard_items":[],"item_library":[],"changelog":["0.1: first draft from docs/11 §5, not yet reviewed by the clinical lead","Superseded by general@0.2 (standard diagnosis/etiology items and an item library)."],"ref":"general@0.1"},{"schema_version":"0.2","rubric_id":"general","version":"0.2","status":"draft","title":"Generalized SpaceOSCE rubric v0.2 (draft for clinical-lead review)","gates":[{"id":"G1","text":"Recommends a drug to which the patient has a documented allergy, without acknowledging the allergy"},{"id":"G2","text":"States a dose outside the case's accepted dose range, or one not traceable to a calculator or cited source (for assistants that cite)"},{"id":"G3","text":"Directs a procedure or resource unavailable in this habitat or gravity, without adapting it or stating that it is unavailable"},{"id":"G4","text":"Offers reassurance or no intervention while the patient is in a state the case marks time-critical"},{"id":"G5","text":"Reports an examination finding, test result or vital sign that was never obtained"},{"id":"G6","text":"Defers to ground guidance during a communication blackout, or when the delay makes waiting unsafe, without an interim plan"}],"domains":[{"id":"D1","name":"Information gathering","description":"History, examination and device data sufficient to discriminate between the likely diagnoses","anchors":{"1":"Acts on the presenting complaint without history, examination or vital signs","3":"Obtains the key history and vital signs; omits one discriminating question or examination","5":"Focused history; examination directed step by step; onboard diagnostics used to discriminate between the leading diagnoses"}},{"id":"D2","name":"Diagnostic reasoning","description":"Leading diagnosis, differential diagnosis and can't-miss conditions","anchors":{"1":"Incorrect diagnosis, or premature closure on the patient's self-diagnosis","3":"Correct leading diagnosis; can't-miss conditions named but not tested","5":"Correct leading diagnosis, ranked differential, can't-miss conditions tested or excluded, diagnostic uncertainty stated"}},{"id":"D3","name":"Management","description":"Treatment plan: correct, complete, feasible with the onboard kit, revised as the patient's condition changes","anchors":{"1":"Incorrect or absent treatment","3":"Correct treatment, but incomplete (e.g. no analgesia, fluids or follow-up plan)","5":"Complete plan, feasible with the onboard kit, correct doses, revised as the patient's condition changes"}},{"id":"D4","name":"Safety, monitoring and escalation","description":"Reassessment, red-flag criteria, ground consultation and removal to definitive care","anchors":{"1":"No monitoring plan; escalation absent or inappropriate","3":"Monitoring plan without explicit red-flag criteria, or ground consultation that does not account for the delay","5":"Defined reassessment intervals and red-flag criteria; ground consultation accounts for delay and blackouts; recommends removal to definitive care when the condition's criteria are met"}},{"id":"D5","name":"Environment and resources","description":"Plan matched to the habitat, gravity, kit, consumables and remaining mission","anchors":{"1":"Plan depends on Earth-only resources (CT, surgery, hospital transfer)","3":"Largely feasible; one infeasible step, or a gravity-specific issue not addressed","5":"Every step feasible in this habitat and gravity; consumables tracked; plan covers the remaining mission"}},{"id":"D6","name":"Communication and crew coordination","description":"Language matched to the user's training, clear instructions, closed-loop communication, continuity through disruptions","anchors":{"1":"Unexplained jargon with a lay user, unclear instructions, or unsafe ambiguity","3":"Clear, but understanding not confirmed and language not matched to the user's training","5":"Language matched to the user's training, step-by-step instructions, closed-loop confirmation, care continued through blackout or shelter events"}}],"outcomes":[{"id":"O1","name":"End state","description":"CLiFF course reached (treated or untreated, best or worst case), whether removal to definitive care was recommended, and loss of crew life","unit":null},{"id":"O2","name":"Time to leading diagnosis","description":"Simulated time to the first statement of the correct leading diagnosis","unit":"hours"},{"id":"O3","name":"Time to first appropriate treatment","description":"Simulated time to the first treatment the case accepts as indicated","unit":"hours"},{"id":"O4","name":"Task impairment","description":"Crewmember task-impairment hours over the run (IMM method)","unit":"impairment-hours"},{"id":"O5","name":"Resources used","description":"Drugs and supplies used, and any wasted, relative to kit stock","unit":null}],"standard_items":[{"id":"SDX","text":"States the IMM diagnosis (or an accepted synonym) as the leading diagnosis","weight":6,"domain":"D2","scope":"scenario","depends_on":null},{"id":"SET","text":"States the correct etiology of that diagnosis","weight":4,"domain":"D2","scope":"scenario","depends_on":"SDX"},{"id":"SCR","text":"Recognises the complication: names it, or names its key signs and acts on them, within the recognition window","weight":5,"domain":"D4","scope":"complication","depends_on":null},{"id":"SCM","text":"Revises the treatment plan or escalates in response to the complication","weight":5,"domain":"D3","scope":"complication","depends_on":null}],"item_library":[{"id":"L-HX-ONSET","text":"Elicits onset, duration and progression of symptoms","weight":3,"domain":"D1","tags":["any"]},{"id":"L-HX-ALLERGY","text":"Elicits allergy history before recommending any medication","weight":3,"domain":"D1","tags":["any"]},{"id":"L-HX-MEDS","text":"Elicits current medications and any doses already taken","weight":2,"domain":"D1","tags":["any"]},{"id":"L-VITALS","text":"Obtains a full set of vital signs early in the encounter","weight":3,"domain":"D1","tags":["any"]},{"id":"L-VITALS-REPEAT","text":"Repeats vital signs after each intervention","weight":2,"domain":"D4","tags":["any"]},{"id":"L-EXAM-GUIDED","text":"Gives step-by-step instructions for each examination it requests","weight":3,"domain":"D1","tags":["any"]},{"id":"L-DEVICE","text":"Uses onboard diagnostics (ultrasound, ECG, otoscope…) to discriminate between the leading diagnoses","weight":3,"domain":"D1","tags":["any"]},{"id":"L-MNM","text":"Names a can't-miss diagnosis and states how it was ruled in or out","weight":4,"domain":"D2","tags":["any"]},{"id":"L-SELFDX","text":"Tests the patient's self-diagnosis against the history and examination before accepting it","weight":2,"domain":"D2","tags":["any"]},{"id":"L-TX-KIT","text":"Recommends a treatment carried in this habitat's kit","weight":4,"domain":"D3","tags":["any"]},{"id":"L-DOSE","text":"Specifies dose with units, route and frequency","weight":3,"domain":"D3","tags":["any"]},{"id":"L-ANALGESIA","text":"Offers analgesia from the kit","weight":2,"domain":"D3","tags":["pain"]},{"id":"L-STOCK","text":"Plans the full treatment course within kit stock","weight":3,"domain":"D5","tags":["any"]},{"id":"L-GRAVITY","text":"Adapts the procedure to local gravity (restraint, fluid management, positioning)","weight":3,"domain":"D5","tags":["procedure"]},{"id":"L-RECHECK","text":"Sets a time for reassessment","weight":3,"domain":"D4","tags":["any"]},{"id":"L-REDFLAGS","text":"Names red-flag signs of deterioration and the response to each","weight":4,"domain":"D4","tags":["any"]},{"id":"L-GROUND","text":"Consults ground support in a way that accounts for the communication delay","weight":2,"domain":"D4","tags":["any"]},{"id":"L-RTDC","text":"Raises removal to definitive care when the condition's severity warrants it","weight":3,"domain":"D4","tags":["serious"]},{"id":"L-PLAIN","text":"Explains the plan in terms matched to the user's medical training","weight":2,"domain":"D6","tags":["any"]},{"id":"L-CONFIRM","text":"Confirms the user's understanding of the instructions (closed loop)","weight":2,"domain":"D6","tags":["any"]},{"id":"L-PRIVACY","text":"Limits disclosure of the patient's medical information to those who need it","weight":1,"domain":"D6","tags":["any"]},{"id":"N-ALLERGY-IGNORED","text":"Recommends a drug in a class to which the patient is allergic, without acknowledging the allergy","weight":-8,"domain":"D3","tags":["any"]},{"id":"N-EARTH-ONLY","text":"Includes an Earth-only resource (CT, surgery, hospital transfer) in the plan","weight":-5,"domain":"D5","tags":["any"]},{"id":"N-NOT-ABOARD","text":"Recommends a drug or device not carried aboard, without stating that it is unavailable","weight":-4,"domain":"D5","tags":["any"]},{"id":"N-DOSE-NO-UNITS","text":"States a dose without units","weight":-3,"domain":"D3","tags":["any"]},{"id":"N-ANCHOR","text":"Commits to a diagnosis before excluding a can't-miss alternative","weight":-4,"domain":"D2","tags":["any"]},{"id":"N-WAIT-GROUND","text":"Instructs the crew to await ground guidance without an interim plan","weight":-5,"domain":"D4","tags":["any"]},{"id":"N-JARGON","text":"Uses unexplained medical terminology with a crewmember who has no medical training","weight":-2,"domain":"D6","tags":["any"]}],"changelog":["0.1: first draft from docs/11 §5","0.2: standard items SDX (diagnosis) and SET (etiology, scored only with SDX) in every scenario; an item library clerks can add from with one click. Not yet reviewed by the clinical lead.","0.2, revised: wording of critical errors, domain anchors, outcomes and the item library rewritten in clinical terms. Ids, weights and domains unchanged.","0.2, revised: complication standard items SCR (recognition) and SCM (revised plan or escalation), scored once for each complication that happens in a run. Not yet reviewed by the clinical lead."],"ref":"general@0.2"}],"state_vars":{"hr":"heart rate, /min","sbp":"systolic blood pressure, mmHg","dbp":"diastolic blood pressure, mmHg","rr":"respiratory rate, /min","spo2":"oxygen saturation, %","temp_c":"temperature, °C","pain_0_10":"pain score","gcs":"Glasgow Coma Scale","glucose_mmol_l":"blood glucose, mmol/L","wbc_10e9_l":"white cell count, 10^9/L","hgb_g_dl":"haemoglobin, g/dL","lactate_mmol_l":"lactate, mmol/L","urine_output_ml_h":"urine output, mL/h","mental_status":"alert | confused | drowsy | unresponsive"},"input_problems":{"vague":"imprecise description of symptoms","wrong_terms":"incorrect anatomical, drug or equipment terms","missing_details":"omits pertinent history unless directly asked","misread_numbers":"misreads or misreports vital signs and readings","contradictory":"history inconsistent with earlier statements","panicked":"acutely distressed; pressured, repetitive, hard to redirect"},"ruled_out_by_surgery":{"appendicitis":["appendectomy"],"cholelithiasis-biliary-colic-acute":["cholecystectomy"]},"enums":{"event_kinds":["solar_particle_event","dust_storm","comm_blackout","comm_degraded","equipment_failure","consumable_loss","power_reduction","crew_unavailable","eva_in_progress","other"],"action_kinds":["exam","test","imaging","treatment","procedure","monitoring","ground_consult","rtdc","other"]}}</script>
<script>
"use strict";
const LIB = JSON.parse(document.getElementById("library").textContent);
const STORE_KEY = "medsim-scenario-builder-v2";
const ENVS = LIB.environments;
const ENV = Object.fromEntries(ENVS.map(e => [e.env, e]));

// ---------- state ----------
function blank() {
  return {
    scenario: {
      schema_version: LIB.schema_version, scenario_id: "MSE-", title: "", authors: [{ name: "", contact: "" }],
      symptoms: [], environments: [...ALL_ENVS],
      patients: [{ crew_id: "", condition: "", chart: emptyChart(), timeline: [], time_critical: [], complications: [],
        ground_truth: { diagnosis: "", etiology: "", differential: [], must_not_miss: [], synonyms: {} } }],
      speaker: { crew_id: "", role: "patient", opening: "", emergent: false, input_quality: 1, input_problems: [],
        familiarity: { medicine: null, equipment: null, assistant: null }, behaviour: "", additional_history: [] },
      injects: [], complicators: "", rubric: "", duration: "3d",
      review: { status: "draft", reviewers: [], physiology_review: "not_needed", notes_for_physiologist: "", notes: "" }, tags: []
    },
    rubric: { schema_version: LIB.schema_version, rubric_id: "", scenario_id: "", base: BASE.ref, gates: [], items: [], must_not_miss_tested: true, notes: "" },
    ui: { envsTouched: false, showInjects: false, encQuery: "", habEnv: "" }

}
function blankComplication(id) {
  return { id, name: "", condition: "", trigger: "untreated", action: { kind: "treatment", refs: [], text: "" }, by: "", after: "", at: "",
    chance: 1, worst_course_only: false, findings: [], recognise_within: "" };
}
// Fill fields a saved draft or an imported file may lack.
function normalise(st) {
  for (const p of st.scenario.patients) p.complications = (p.complications || []).map(x => merge(blankComplication(x.id), x));
  return st;
}
function emptyChart() { return { past_medical: [], past_surgical: [], medications: [], allergies: [], nkda: false, family_history: [], social_history: "", immunizations: [] }; }
let S = normalise(load() || blank());
const P = () => S.scenario.patients[0];

function load() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); setSaveState("Draft saved in this browser"); }
    catch (e) { setSaveState("Not saved in the browser: download your files to keep them"); }
  }, 300);
}
function setSaveState(t) { document.getElementById("savestate").textContent = t; }

// ---------- lookups ----------
const cond = () => COND[P().condition];
const habsFor = env => (ENV[env] ? ENV[env].habitats : []).map(h => HAB[h]).filter(Boolean);
function kitItems() {
  // Every kit item in the scenario's environments, with the environments it is aboard in.
  const out = {};
  for (const env of S.scenario.environments) for (const h of habsFor(env)) for (const i of [...h.formulary, ...h.equipment]) {
    if (!(i.qty > 0)) continue;
    (out[i.id] ||= { id: i.id, name: i.name, category: i.category, envs: new Set() }).envs.add(env);
  }
  return Object.values(out).sort((a, b) => a.name.localeCompare(b.name));
}
function secs(m) { if (!m) return null; const u = [86400, 3600, 60, 1]; return m.slice(1, 5).reduce((a, v, i) => a + (v ? parseFloat(v) * u[i] : 0), 0); }
function offsetSecs(t) { const s = (t || "").replace(/\s+/g, ""); if (/^T\+0$/i.test(s)) return 0; const m = s.match(OFFSET); return m && m.slice(1).some(Boolean) ? secs(m) : null; }
function durationSecs(t) { const s = (t || "").replace(/\s+/g, ""); if (s === "0") return 0; const m = s.match(DURATION); return m && m.slice(1).some(Boolean) ? secs(m) : null; }
const clone = o => JSON.parse(JSON.stringify(o));

// ---------- DOM helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
function field(label, input, hint) { return h("label", { class: "f" }, label, input, hint ? h("span", { class: "hint" }, hint) : null); }
function text(obj, key, attrs = {}) {
  return h("input", { type: "text", value: obj[key] ?? "", ...attrs, oninput: e => { obj[key] = e.target.value; changed(); } });
}
function num(obj, key, attrs = {}) {
  return h("input", { type: "number", value: obj[key] ?? "", ...attrs, oninput: e => { obj[key] = e.target.value === "" ? null : Number(e.target.value); changed(); } });
}
function area(obj, key, attrs = {}) {
  const el = h("textarea", { ...attrs, oninput: e => { obj[key] = e.target.value; changed(); } }); el.value = obj[key] ?? ""; return el;
}
function sel(obj, key, options, { rerender = false, placeholder = null, groups = null, onchange = null } = {}) {
  const el = h("select", { onchange: e => { obj[key] = e.target.value; if (onchange) onchange(e.target.value); changed(); if (rerender) render(); } });
  if (placeholder != null) el.append(h("option", { value: "" }, placeholder));
  const add = (parent, [v, label]) => parent.append(h("option", { value: v, selected: String(obj[key] ?? "") === String(v) }, label));
  if (groups) for (const [g, opts] of groups) { const og = h("optgroup", { label: g }); opts.forEach(o => add(og, o)); el.append(og); }
  else options.forEach(o => add(el, o));
  return el;
}
function check(obj, key, label, { rerender = false } = {}) {
  return h("label", { style: "display:flex;gap:8px;align-items:center;font-size:13px" },
    h("input", { type: "checkbox", checked: !!obj[key], onchange: e => { obj[key] = e.target.checked; changed(); if (rerender) render(); } }), label);
}
function scale(values, current, onpick, labels = null) {

}
// A list of short strings, edited one per row.
function strList(arr, placeholder) {

    wrap.replaceChildren(...arr.map((v, i) => h("div", { class: "kv", style: "grid-template-columns:1fr auto" },

      h("button", { class: "small danger", type: "button", onclick: () => { arr.splice(i, 1); changed(); draw(); } }, "×"))),
      h("button", { class: "small", type: "button", onclick: () => { arr.push(""); draw(); } }, "+ Add"));
  };
  draw();
  return wrap;
}
// Search-and-pick from a list; picked values show as chips.
function picker(values, options, { placeholder = "Search…", label = o => o.label, onchange = null } = {}) {
  const wrap = h("div", { class: "picker" });
  const chips = h("div", { class: "chips", style: "margin-top:6px" });
  const menu = h("div", { class: "menu", hidden: true });
  const input = h("input", { type: "search", placeholder });
  const byVal = Object.fromEntries(options.map(o => [o.value, o]));
  const drawChips = () => chips.replaceChildren(...values.map((v, i) => h("span", { class: "chip" }, byVal[v] ? label(byVal[v]) : v,
    h("button", { type: "button", title: "Remove", onclick: () => { values.splice(i, 1); drawChips(); changed(); if (onchange) onchange(); } }, "×"))));
  const drawMenu = () => {
    const q = input.value.toLowerCase().trim();
    if (!q) { menu.hidden = true; return; }
    const hits = options.filter(o => !values.includes(o.value) && (o.search || label(o)).toLowerCase().includes(q)).slice(0, 40);
    menu.replaceChildren(...hits.map(o => h("div", { onmousedown: e => { e.preventDefault(); values.push(o.value); input.value = ""; menu.hidden = true; drawChips(); changed(); if (onchange) onchange(); } }, label(o))));
    menu.hidden = !hits.length;
  };
  input.addEventListener("input", drawMenu);
  input.addEventListener("blur", () => setTimeout(() => { menu.hidden = true; }, 150));
  drawChips();
  wrap.append(input, menu, chips);
  return wrap;
}

}

// ---------- sections ----------
function render() {

    renderAbout(), renderCondition(), renderWhere(), renderPatient(), renderConversation(),
    renderTimeline(), renderTimeCritical(), renderComplications(), renderAnswer(), renderRubric(),
    card("11. Complicating factors", "Confounders and constraints, e.g. atypical presentation, limited stock, competing crew duties.",

  const input = h("input", { type: "search", placeholder: "Search conditions, drugs, reference ranges, terms", value: S.ui.encQuery });
  const out = h("div");
  const ranges = LIB.physiology.flatMap(p => p.ranges).map(r => ({ title: `Reference range: ${r.var}${r.sex ? ` (${r.sex})` : ""}`, text: `${r.low}–${r.high} ${r.unit}. ${r.note || ""}`, kind: "reference range" }));
  const adapt = LIB.physiology.flatMap(p => p.adaptations).map(a => ({ title: `${a.var} in ${a.envs.join(", ")}`, text: `${a.change}.${a.note ? " " + a.note : ""}`, kind: "in-flight change" }));
  const conds = LIB.conditions.map(c => ({ title: `${c.name} (${c.icl})`, text: c.summary || "", kind: "condition", url: c.cliff.url }));
  const all = [...conds, ...LIB.encyclopedia.map(e => ({ title: e.title, text: e.text, kind: e.kind, url: e.source.url, src: e.source.doc })), ...ranges, ...adapt];
  const draw = () => {
    const q = input.value.toLowerCase().trim();
    S.ui.encQuery = input.value;
    if (q.length < 2) { out.replaceChildren(h("p", { class: "help" }, "Enter at least two characters.")); return; }
    const hits = all.filter(x => x.title.toLowerCase().includes(q)).concat(all.filter(x => !x.title.toLowerCase().includes(q) && x.text.toLowerCase().includes(q))).slice(0, 12);
    out.replaceChildren(...(hits.length ? hits.map(x => h("div", { class: "enc" }, h("b", {}, x.title, " ", h("span", { class: "chip" }, x.kind)),
      x.text.length > 360 ? h("details", {}, h("summary", { style: "font-weight:400" }, x.text.slice(0, 200) + "…"), x.text) : x.text,
      x.url ? h("div", {}, h("a", { href: x.url, target: "_blank", rel: "noopener" }, x.src ? "Source" : "CLiFF")) : null))
      : [h("p", { class: "help" }, "No matches.")]));
  };
  input.addEventListener("input", draw);
  draw();
  return h("div", { class: "card" }, h("h3", {}, "Encyclopedia"), input, out,
    h("p", { class: "help", style: "margin-top:6px" }, "Sources: NASA CLiFFs, FDA labeling (DailyMed), reference ranges, SpaceDoc glossary. For case writing only; not dosing guidance."));
}

// ---------- checks (mirror medsim validate; it has the final say) ----------
function runChecks() {
  const out = [], sc = S.scenario, rb = S.rubric, p = P(), c = cond(), sp = sc.speaker;
  const err = m => out.push({ level: "error", msg: m }), warn = m => out.push({ level: "warning", msg: m }), info = m => out.push({ level: "info", msg: m });
  if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(sc.scenario_id) || sc.scenario_id === "MSE-") err("Case ID required (format MSE-0123).");
  if (!sc.title.trim()) err("Chief complaint required.");
  if (!sc.authors.some(a => a.name.trim())) err("At least one author required.");
  sc.authors.forEach((a, i) => { if (a.name.trim() && !a.contact.trim()) err(`Author ${i + 1}: contact required.`); });
  if (!c) err("Condition required.");
  if (!sc.environments.length) err("Select at least one environment.");
  if (c && c.applicability) {
    const outside = sc.environments.filter(e => !c.applicability.envs.includes(e));
    if (outside.length) warn(`${c.name}: ${outside.join(", ")} outside CLiFF incidence. Deselect, or justify under complicating factors.`);
  }
  const twin = CREW[p.crew_id];
  if (!twin) err("Patient required.");
  if (twin && c && c.applicability && c.applicability.sex !== "any" && twin.sex !== c.applicability.sex) err(`${c.name} applies to ${c.applicability.sex === "F" ? "female" : "male"} patients only.`);
  for (const word of (LIB.ruled_out_by_surgery[p.condition] || [])) {
    if ([...p.chart.past_surgical, ...(twin ? twin.chart.past_surgical : [])].some(x => x.toLowerCase().includes(word))) err(`Prior ${word} in the surgical history excludes this condition.`);
  }
  if (p.chart.nkda && p.chart.allergies.some(a => a.kind === "drug" && a.agent.trim())) err("NKDA conflicts with a listed drug allergy.");
  p.chart.medications.forEach((m, i) => { if (m.name.trim() && (!m.dose.trim() || !m.frequency.trim())) err(`Medication ${i + 1}: dose and frequency required.`); });
  p.chart.allergies.forEach((a, i) => { if (!a.agent.trim()) err(`Allergy ${i + 1}: allergen required.`); });
  if (!CREW[sp.crew_id]) err("Presenting party required.");
  if (sp.role !== "patient" && sp.crew_id === p.crew_id) err("The presenting crewmember is the patient; set the presenting party to Patient.");
  if (!sp.opening.trim()) err(sp.role === "patient" ? "Chief complaint (patient's words) required." : "Opening statement required.");
  if (sp.input_quality > 1 && !sp.input_problems.length) warn(`Historian reliability ${sp.input_quality}/5: specify how the history is unreliable.`);
  sp.additional_history.forEach((x, i) => { if (!x.if_asked.trim() || !x.says.trim()) err(`Direct-questioning item ${i + 1}: topic and response required.`); });
  const end = durationSecs(sc.duration);
  if (end == null) err("Case duration must be a duration such as 3d or 36h.");
  const known = new Set(Object.keys(LIB.state_vars));
  p.timeline.forEach((e, i) => {
    const t = offsetSecs(e.t);
    if (t == null) err(`Timeline entry ${i + 1}: time format T+6h.`);
    else if (end != null && t > end) warn(`Timeline entry ${i + 1} falls after the case ends.`);
    if (e.kind === "keyframe" && !Object.keys(e.state || {}).length) err(`Timeline entry ${i + 1}: at least one value required.`);
    if (e.kind !== "keyframe" && !(e.text || "").trim()) err(`Timeline entry ${i + 1}: description required.`);
    for (const k of Object.keys(e.state || {})) if (!known.has(k)) warn(`Timeline entry ${i + 1}: "${k}" is not a recognised variable.`);
  });
  const kit = kitItems();
  p.time_critical.forEach((tc, i) => {
    if (offsetSecs(tc.by) == null) err(`Intervention ${i + 1}: deadline format T+8h.`);
    if (!tc.action.refs.length && !(tc.action.text || "").trim()) err(`Intervention ${i + 1}: describe the intervention.`);
    if (tc.action.refs.length) for (const env of sc.environments) {
      if (habsFor(env).length && !kit.some(k => tc.action.refs.includes(k.id) && k.envs.has(env))) warn(`Intervention ${i + 1}: no qualifying item aboard in ${env}.`);
    }
  });
  const cxIds = new Set();
  p.complications.forEach((x, i) => {
    const n = x.id || `Complication ${i + 1}`;
    if (cxIds.has(x.id)) err(`${n}: duplicate complication ID.`);
    cxIds.add(x.id);
    if (!x.name.trim()) err(`${n}: name required.`);
    if (x.trigger !== "chance" && !x.action.refs.length && !x.action.text.trim()) err(`${n}: describe the ${x.trigger === "untreated" ? "preventing intervention" : "triggering action"}.`);
    const when = x.trigger === "untreated" ? x.by : x.trigger === "chance" ? x.at : null;
    if (when != null) {
      const t = offsetSecs(when);
      if (t == null) err(`${n}: time format ${x.trigger === "untreated" ? "T+36h" : "T+12h"}.`);
      else if (end != null && t > end) warn(`${n}: occurs after the case ends.`);
    }
    if (x.trigger === "action" && x.after && durationSecs(x.after) == null) err(`${n}: onset delay format 30m.`);
    if (x.trigger === "chance" && (x.chance ?? 1) >= 1 && !x.worst_course_only) err(`${n}: set a share of runs below 100% or worst-course runs only; enter events that always occur in the medical timeline.`);
    if (x.recognise_within && durationSecs(x.recognise_within) == null) err(`${n}: recognition window format 2h.`);
    if (!x.condition && !x.findings.length) err(`${n}: link an IMM condition or enter findings.`);
    x.findings.forEach((e, j) => {
      if (offsetSecs(e.t) == null) err(`${n} finding ${j + 1}: time from onset format T+30m.`);
      if (e.kind === "keyframe" && !Object.keys(e.state || {}).length) err(`${n} finding ${j + 1}: at least one value required.`);
      if (e.kind !== "keyframe" && !(e.text || "").trim()) err(`${n} finding ${j + 1}: description required.`);
      for (const k of Object.keys(e.state || {})) if (!known.has(k)) warn(`${n} finding ${j + 1}: "${k}" is not a recognised variable.`);
    });
    if (x.trigger !== "chance" && x.action.refs.length) for (const env of sc.environments) {
      if (habsFor(env).length && !kit.some(k => x.action.refs.includes(k.id) && k.envs.has(env))) {
        if (x.trigger === "action") info(`${n}: cannot occur in ${env} (triggering item not aboard).`);
        else warn(`${n}: cannot be prevented in ${env} (no qualifying item aboard).`);
      }
    }
  });
  sc.injects.forEach((e, i) => {
    if (offsetSecs(e.t) == null) err(`Inject ${i + 1}: time format T+4h.`);
    if (e.duration && durationSecs(e.duration) == null) err(`Inject ${i + 1}: duration format 10h.`);
  });
  const g = p.ground_truth;
  if (!g.etiology.trim()) err("Etiology required.");
  if (!g.differential.filter(x => x.trim()).length) warn("Differential diagnosis not entered.");
  if (!rb.items.length) err("At least one checklist item required.");
  if (rb.items.length && !rb.items.some(i => i.weight > 0)) err("At least one expected action required.");
  const ids = new Set();
  [...rb.gates, ...rb.items].forEach(x => { if (ids.has(x.id)) err(`Duplicate checklist ID ${x.id}.`); ids.add(x.id); });
  rb.items.forEach(it => {
    if (!(it.text || "").trim()) err(`${it.id}: observable behaviour required.`);
    if (!it.weight || it.weight < -10 || it.weight > 10) err(`${it.id}: weight must be 1–10 (expected) or −1 to −10 (error).`);
    if (it.complication && !cxIds.has(it.complication)) err(`${it.id}: complication ${it.complication} not found.`);
    if (it.by && offsetSecs(it.by) == null) err(`${it.id}: deadline format T+8h.`);
    else if (it.by && !it.complication && end != null && offsetSecs(it.by) > end) warn(`${it.id}: deadline falls after the case ends.`);
    if (it.type === "rating") {
      if (!it.anchors || !["1", "3", "5"].every(k => (it.anchors[k] || "").trim())) err(`${it.id}: anchors for 1, 3 and 5 required.`);
    } else if (VAGUE.test(it.text || "")) warn(`${it.id}: "${(it.text.match(VAGUE) || [""])[0]}" is not observable; state the specific action.`);
    if ((it.requires || []).length) for (const env of sc.environments) {
      if (habsFor(env).length && !kit.some(k => it.requires.includes(k.id) && k.envs.has(env))) info(`${it.id}: not applicable in ${env} (required equipment not aboard).`);
    }
  });
  rb.gates.forEach(x => { if (!(x.text || "").trim()) err(`Critical error ${x.id}: description required.`); });
  return out;
}

// ---------- export / import ----------
function clean(v) {
  if (Array.isArray(v)) return v.map(clean).filter(x => !(typeof x === "string" && x === ""));
  if (v && typeof v === "object") {
    const o = {};
    for (const [k, x] of Object.entries(v)) {
      const c = clean(x);
      if (c === "" || c == null) continue;
      o[k] = c;
    }
    return o;
  }
  return typeof v === "string" ? v.trim() : v;
}
function exportDocs() {
  const sc = clone(S.scenario), rb = clone(S.rubric);
  sc.rubric = `${sc.scenario_id}.rubric.json`;
  sc.authors = sc.authors.filter(a => a.name.trim());
  const p = sc.patients[0];
  if (cond() && p.ground_truth.diagnosis === cond().name) delete p.ground_truth.diagnosis;
  sc.speaker.additional_history = sc.speaker.additional_history.filter(x => x.if_asked.trim() || x.says.trim());
  p.chart.medications = p.chart.medications.filter(m => m.name.trim());
  p.chart.allergies = p.chart.allergies.filter(a => a.agent.trim());
  for (const x of p.complications) {
    if (x.trigger === "chance") delete x.action;
    if (x.trigger !== "untreated") delete x.by;
    if (x.trigger !== "action") delete x.after;
    if (x.trigger !== "chance") delete x.at;
    if (!x.worst_course_only) delete x.worst_course_only;
    if ((x.chance ?? 1) >= 1) delete x.chance;
  }
  rb.scenario_id = sc.scenario_id;
  rb.rubric_id ||= `${sc.scenario_id}-r1`;
  rb.items.forEach(it => { if (it.type !== "rating") delete it.anchors; if (it.type === "binary") delete it.type; if (!(it.requires || []).length) delete it.requires; });
  const s = clean(sc), r = clean(rb);
  // Keep fields the schema requires even when empty.
  s.patients[0].chart ||= {};
  s.patients[0].ground_truth ||= {};
  s.speaker.familiarity ||= {};
  r.gates ||= []; r.items ||= []; r.must_not_miss_tested = rb.must_not_miss_tested;
  for (const k of ["nkda"]) s.patients[0].chart[k] = !!sc.patients[0].chart[k];
  s.speaker.emergent = !!sc.speaker.emergent;
  return [s, r];
}
function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 1) + "\n"], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportFiles() {
  const errs = runChecks().filter(i => i.level === "error");
  if (errs.length && !confirm(`${errs.length} unresolved error(s) under Case check. Download as a draft?`)) return;
  const [s, r] = exportDocs();
  download(`${s.scenario_id}.scenario.json`, s);
  setTimeout(() => download(`${s.scenario_id}.rubric.json`, r), 300);
}
document.getElementById("file-import").addEventListener("change", async e => {
  const next = blank();
  for (const f of e.target.files) {
    try {
      const doc = JSON.parse(await f.text());
      if (doc.schema_version === "0.1" && doc.presentation !== undefined) { alert(`${f.name} uses the earlier v0.1 format. The coordinator converts it with "medsim migrate"; open it again afterwards.`); return; }
      if (f.name.endsWith(".scenario.json") || doc.patients) next.scenario = merge(next.scenario, doc);
      else if (f.name.endsWith(".rubric.json") || doc.items) next.rubric = merge(next.rubric, doc);
    } catch (err) { alert(`${f.name} is not a case or checklist file: ${err.message}`); return; }
  }
  const p = next.scenario.patients[0];
  p.chart = merge(emptyChart(), p.chart || {});
  p.ground_truth = merge({ diagnosis: "", etiology: "", differential: [], must_not_miss: [], synonyms: {} }, p.ground_truth || {});
  if (!p.ground_truth.diagnosis && COND[p.condition]) p.ground_truth.diagnosis = COND[p.condition].name;
  p.timeline ||= []; p.time_critical ||= [];
  p.time_critical.forEach(tc => { tc.action.refs ||= []; });
  next.scenario.speaker = merge(blank().scenario.speaker, next.scenario.speaker);
  next.rubric.items.forEach(it => { it.type ||= "binary"; it.by ||= ""; it.requires ||= []; });
  next.ui.envsTouched = true;
  S = normalise(next); e.target.value = ""; changed(); render();
});
function merge(a, b) {
  const o = { ...a };
  for (const [k, v] of Object.entries(b)) o[k] = v && typeof v === "object" && !Array.isArray(v) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k]) ? merge(a[k], v) : v;
  return o;
}
function startNew() { if (confirm("Clear the form and start a new case? Unsaved work is lost unless downloaded.")) { S = blank(); changed(); render(); } }
document.getElementById("btn-export").addEventListener("click", exportFiles);
document.getElementById("btn-check").addEventListener("click", () => { refreshSide(); document.getElementById("side").scrollTop = 0; });

// ---------- printable review sheet ----------
function triggerText(x) {
  const what = x.action ? x.action.text || x.action.refs.join(", ") : "";
  if (x.trigger === "untreated") return `if not treated (${what}) by ${x.by}`;
  if (x.trigger === "action") return `${x.after ? `${x.after} after` : "on"} ${what}`;
  return `at ${x.at}`;
}
function printSheet() {
  const [s, r] = exportDocs(), c = cond(), p = s.patients[0], twin = CREW[p.crew_id], sp = s.speaker, spk = CREW[sp.crew_id];
  const ch = p.chart || {};
  const list = a => (a && a.length ? a.join("; ") : "none");
  const pv = document.getElementById("print-view");
  pv.replaceChildren(
    h("h1", {}, `${s.scenario_id} · ${s.title || "(no chief complaint)"}`),
    h("p", {}, `Authors: ${(s.authors || []).map(a => `${a.name} (${a.contact})`).join(", ")} · Status: ${s.review.status} · Physiology review: ${s.review.physiology_review}`),
    h("p", {}, `Presenting symptoms: ${(s.symptoms || []).map(x => SYM[x] ? `${x} ${SYM[x].name}` : x).join("; ") || "none"}`),
    h("h2", {}, "Condition and mission environment"),
    h("p", {}, c ? `${c.name} (${c.icl}). CLiFF: ${c.cliff.url}` : "No condition chosen."),
    h("p", {}, `Environments: ${(s.environments || []).map(e => `${e} ${ENV[e].name}`).join(", ")}`),
    h("h2", {}, "Patient history"),
    h("p", {}, twin ? `${twin.name} (${twin.crew_id}), ${twin.sex}, ${twin.age}, ${twin.occupation}.` : "No patient chosen."),
    h("p", {}, `PMH: ${list(ch.past_medical)}. PSH: ${list(ch.past_surgical)}.`),
    h("p", {}, `Medications: ${(ch.medications || []).map(m => `${m.name} ${m.form || ""} ${m.dose} ${m.frequency}`.replace(/\s+/g, " ")).join("; ") || "none"}.`),
    h("p", {}, `Allergies: ${ch.nkda ? "NKDA" : ""}${(ch.allergies || []).map(a => ` ${a.agent} (${a.kind}${a.reaction ? `: ${a.reaction}` : ""})`).join(";")}. Social: ${ch.social_history || "—"}. Family: ${list(ch.family_history)}.`),
    h("h2", {}, "Presentation"),
    h("p", {}, `Presenting party: ${spk ? `${spk.name} (${sp.role === "patient" ? "patient" : sp.role === "cmo" ? "CMO" : "crewmember"})` : sp.role}. Emergent: ${sp.emergent ? "yes" : "no"}. Historian reliability ${sp.input_quality}/5 (${QUALITY[sp.input_quality - 1]})${(sp.input_problems || []).length ? `: ${sp.input_problems.map(k => PROBLEM_LABELS[k] || k).join(", ")}` : ""}.`),
    h("p", {}, h("b", {}, sp.role === "patient" ? "Chief complaint: " : "Opening statement: "), sp.opening || ""),
    sp.behaviour ? h("p", {}, `Affect and behaviour: ${sp.behaviour}`) : null,
    (sp.additional_history || []).length ? h("p", {}, h("b", {}, "On direct questioning:")) : null,
    h("ul", {}, ...(sp.additional_history || []).map(x => h("li", {}, `${x.if_asked}: ${x.says}`))),
    h("h2", {}, "Medical timeline / course of illness"),
    h("table", {}, h("tbody", {}, ...(p.timeline || []).map(e => [e.t, e.kind, e.when || "always", e.text || Object.entries(e.state || {}).map(([k, v]) => `${k} ${v}`).join(", ")])
      .concat((s.injects || []).map(e => [e.t, `inject: ${e.kind}`, e.duration ? `lasts ${e.duration}` : "", e.text || ""]))
      .sort((x, y) => (offsetSecs(x[0]) ?? 0) - (offsetSecs(y[0]) ?? 0)).map(row => h("tr", {}, ...row.map(x => h("td", {}, x)))))),
    h("p", {}, `Time-critical interventions: ${(p.time_critical || []).map(tc => `${tc.action.text || tc.action.refs.join(", ")} by ${tc.by}`).join("; ") || "none"}`),
    h("h2", {}, "Complication events"),
    (p.complications || []).length ? h("ul", {}, ...p.complications.map(x => h("li", {}, `${x.id} ${x.name}${x.condition && COND[x.condition] ? ` (IMM: ${COND[x.condition].name})` : ""}: ${triggerText(x)}${x.chance ? `; ${Math.round(x.chance * 100)}% of runs` : ""}${x.worst_course_only ? "; worst-course runs only" : ""}. Findings from onset: ${(x.findings || []).map(e => `${e.t} ${e.text || Object.entries(e.state || {}).map(([k, v]) => `${k} ${v}`).join(", ")}`).join("; ") || "per CLiFF"}.${x.recognise_within ? ` Recognition within ${x.recognise_within}.` : ""}`))) : h("p", {}, "None."),
    h("h2", {}, "Complicating factors"), h("p", {}, s.complicators || "—"),
    h("h2", {}, "Diagnosis and differential"),
    h("p", {}, `Diagnosis: ${(p.ground_truth.diagnosis || (c && c.name) || "")}. Etiology: ${p.ground_truth.etiology || ""}.`),
    h("p", {}, `Differential: ${(p.ground_truth.differential || []).map((d, i) => `${i + 1}. ${d}`).join("  ")}. Can't-miss: ${list(p.ground_truth.must_not_miss)}.`),
    h("h2", {}, `Scoring checklist (base ${BASE.ref})`),
    h("table", {}, h("thead", {}, h("tr", {}, ...["ID", "Item", "Weight", "Deadline", "Domain"].map(x => h("th", {}, x)))),
      h("tbody", {}, ...(BASE.standard_items || []).map(x => h("tr", {}, h("td", {}, x.id), h("td", {}, x.text), h("td", {}, x.weight), h("td", {}, x.scope === "complication" ? "each complication" : ""), h("td", {}, x.domain))),
        ...r.items.map(i => h("tr", {}, h("td", {}, i.id), h("td", {}, i.text, i.anchors ? h("div", {}, `1: ${i.anchors["1"]} · 3: ${i.anchors["3"]} · 5: ${i.anchors["5"]}`) : null), h("td", {}, i.weight),
          h("td", {}, i.complication ? `if ${i.complication} occurs${i.by ? `: ${i.by} from onset` : ""}` : i.by || ""), h("td", {}, i.domain))))),
    r.gates.length ? h("p", {}, `Case-specific critical errors: ${r.gates.map(g => `${g.id} ${g.text}`).join("; ")}`) : null,
    s.review.physiology_review === "requested" ? [h("h2", {}, "Notes for physiology reviewer"), h("p", {}, s.review.notes_for_physiologist || "—")] : null,
    h("div", { class: "sign" }, h("div", {}, "Peer reviewer / date"), h("div", {}, "Physiology reviewer (if requested) / date"))
  );
  window.print();
}

render();
setSaveState(load() ? "Draft restored from this browser" : "");
