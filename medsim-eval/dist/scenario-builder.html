 space due to the observation that crewmembers experience large bowel ileus, and decreased bowel mobility. This may be exacerbated by dehydration due to space motion sickness and hormonal responses to fluid redistribution. Maintaining hydration is encouraged. Oral and rectal bowel stimulants and psyllium wafers are available on orbit for constipation. (Marshburn et al, 2020)","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"early_flight","eva":false,"sex":"any","onset_hours":[1.0,120.0],"mapped":"automatic"},"course":{"incidence_mean":0.1877,"incidence_sd":0.01371,"incidence_text":"Mean: 0.1877 SD: 0.01371","treated_best":{"probability_pct":[84.0,84.0],"cp1_ti_pct":100.0,"cp1_hours":0.45,"cp2_ti_pct":0.0,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[16.0,16.0],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":13.553,"cp2_hours":[72.0,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.45,"cp2_ti_pct":0.172735,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.5,"cp2_ti_pct":17.6986,"cp2_hours":[72.0,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"space-adaptation-epistaxis","icl":"ICL93","name":"Space Adaptation - Epistaxis","category":"Otolaryngological Conditions","cliff":{"label":"Epistaxis (Space Adaptation) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-epistaxis-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Space Adaptation Urinary Retention CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-urinary-retention-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Epistaxis, or nosebleeds, are regular events and often do not require medical treatment. Only six percent of people who experience an epistaxis event will ever seek additional expertise (Seikaly, 2021). Although nearly all nosebleeds will resolve with minimal involvement, the severity of the bleed can be complicated by the location, coagulation abnormalities, platelet dysfunction, and cardiovascular disease. Most bleeds are ‘anterior bleeds’ and occur along the septum from the Kiesselbach plexus in Little’s area. This vascular supply is formed by terminal branches of the internal carotid artery and external carotid artery. Anterior bleeds are typically simpler to manage as the area is visible and compressible. Frequently, nasal compression and topical vasoconstrictors are all that is necessary; albeit cauterization, topical hemostasis agents and anterior packs are commonly used as well. Posterior bleeds comprise of 10-20% of cases and occur along the posterior septum, the lateral nasal wall, or the nasal floor (Krulewitz et al., 2019). These areas are supplied by the sphenopalatine and ascending pharyngeal arteries and often result in brisk bleeds warranting immediate intervention to prevent aspiration and hemorrhagic shock (Womack et al, 2018). Posterior packing is painful both upon insertion and in situ. This type of packing is associated with a higher risk of complications such as otitis media, sinusitis, pressure necrosis, airway obstruction, vagal nerve stimulation, cavernous sinus thrombosis, and toxic shock syndrome (Feusi et al., 2005; Morgan et al. 2014). There have been several epistaxis events in spaceflight. Nosebleeds occurring in the first five days of a mission are associated with space adaptation epistaxis. These are typically attributed to the cephalad fluid shift secondary to increased blood volume and intravascular pressure (Barratt et al., 2019). As a result of these shifts, astronauts experience facial edema and report subjective symptoms of nasal stuffiness and head pressure. The engorgement of the nasal mucosa, use of decongestants and the propensity for digital trauma during this time increases the likelihood of an epistaxis event. After the first five days, an equilibrium is established. The temporal nature of these fluid shifts is further supported by the finding that there is no significant difference in paranasal sinus opacification in head magnetic resonance imaging after spaceflight (Inglesby et al., 2020). Events that occur after five days are covered separately in another CLiFF (ICL 38- Epistaxis) and can be attributed to the low relative humidity of the mission craft, overuse of decongestants, trauma, sinusitis, or upper respiratory infections.","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"early_flight","eva":false,"sex":"any","onset_hours":[1.0,120.0],"mapped":"automatic"},"course":{"incidence_mean":0.0136,"incidence_sd":0.00417,"incidence_text":"mean: 0.0136 and SD:0.00417","treated_best":{"probability_pct":[95.0,95.0],"cp1_ti_pct":100.0,"cp1_hours":0.56,"cp2_ti_pct":4.73027,"cp2_hours":[0.0833333,0.58],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[5.0,5.0],"cp1_ti_pct":100.0,"cp1_hours":1.12,"cp2_ti_pct":50.0,"cp2_hours":[24.0,96.0],"cp3_ti_pct":0.0,"rtdc_pct":[5.6,18.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.56,"cp2_ti_pct":6.65692,"cp2_hours":[0.0833333,0.58],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.12,"cp2_ti_pct":100.0,"cp2_hours":[24.0,912.0],"cp3_ti_pct":100.0,"rtdc_pct":[18.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"space-adaptation-headache","icl":"ICL94","name":"Space Adaptation - Headache","category":"Headache","cliff":{"label":"Headache (Space Adaptation) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-headache-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Headache (Space Adaptation) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/headache-space-adaptation-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Space Adaptation Urinary Retention CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-urinary-retention-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Spaceflight headache or space adaptation headache is a headache attributed to travel in microgravity (Starling 2018). Previously, space motion sickness syndrome was inclusive of this condition, but it is now recognized as a separate disorder. There has been acknowledgment that space adaptation headaches often do not occur concomitantly with motion sickness. In the 3rd edition of the International Classification of Headache Disorders (ICHD-3), the International Headache Society (IHS) defines this condition as a nonspecific headache with the following: “A. Any new headache fulfilling criterion C; B. The subject has travelled through space; C. Evidence of causation demonstrated by both of the following: 1. headache has occurred exclusively during space travel and 2. headache has spontaneously improved on return to earth; D. Not better accounted for by another ICHD-3 diagnosis.” Headaches that occur within the first five days of spaceflight are typically attributed to this condition. They are usually self-limited and typically resolve when homeostasis of cephalad fluid shifts occur (Hodkinson et al., 2017). Analog studies using simulated microgravity have demonstrated that in addition to fluid redistribution, there are changes in hemoconcentration, hormones and tight-junctions that may contribute to space adaptation headaches as well (Feuerecker et al., 2016). Other conditions that are related but not covered in this CLiFF include: headache, headache-CO2 and altitude sickness.","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"early_flight","eva":false,"sex":"any","onset_hours":[1.0,120.0],"mapped":"automatic"},"course":{"incidence_sd":0.01678,"incidence_text":"0.3488 person- missions and SD 0.01678","treated_best":{"probability_pct":[98.0,98.0],"cp1_ti_pct":100.0,"cp1_hours":0.21,"cp2_ti_pct":23.2527,"cp2_hours":[1.0,8.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[2.0,2.0],"cp1_ti_pct":100.0,"cp1_hours":1.03,"cp2_ti_pct":26.7606,"cp2_hours":[24.0,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.21,"cp2_ti_pct":29.1257,"cp2_hours":[1.0,8.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.03,"cp2_ti_pct":53.8932,"cp2_hours":[24.0,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"space-adaptation-insomnia","icl":"ICL95","name":"Space Adaptation - Insomnia","category":"Sleep Disturbance","cliff":{"label":"Insomnia (Space Adaptation) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-insomnia-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Insomnia (Space Adaptation) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/insomnia-space-adaptation-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Space Adaptation Insomnia CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-insomnia-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Insomnia is a sleep disorder resulting in a lack of adequate, restful sleep. It is usually characterized by complaints of difficulty sleeping, such as difficulty initiating sleep, difficulty maintaining sleep, early morning awakening, and nonrestorative sleep. A specific form of this condition, Early Insomnia due to Space Adaptation Syndrome, usually occurs in the first 3-5 days of a space mission during the adaptation to microgravity, multiple short light-dark cycles per work day, abnormally long work periods, variations in sleep-wake schedules, shift work, temperature, humidity, medication, and noise. It is distinct from late insomnia which occurs after adapting to spaceflight. General efforts used to partially mitigate this specific condition fall in line with good sleep hygiene measures and include private sleep quarters, noise-reducing ear plugs, window covers, blindfolds and adhering to a consistent schedule if possible. Treatment includes short acting hypnotics. (Putcha, 2008) Of note, use of sleep medications in flight has increased from reported 15% in 1990 to 45% in 2008. (Slack, 2009)","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"early_flight","eva":false,"sex":"any","onset_hours":[1.0,120.0],"mapped":"automatic"},"course":{"incidence_mean":0.472,"incidence_sd":0.01754,"incidence_text":"mean: 0.472 and SD: 0.01754","treated_best":{"probability_pct":[96.0,96.0],"cp1_ti_pct":100.0,"cp1_hours":0.65,"cp2_ti_pct":13.3803,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[4.0,4.0],"cp1_ti_pct":100.0,"cp1_hours":0.64996,"cp2_ti_pct":14.5628,"cp2_hours":[72.0,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.65,"cp2_ti_pct":14.5628,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.64996,"cp2_ti_pct":17.5259,"cp2_hours":[72.0,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"space-adaptation-nasal-congestion","icl":"ICL96","name":"Space Adaptation - Nasal Congestion","category":"Otolaryngological Conditions","cliff":{"label":"Nasal Congestion (Space Adaptation) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-nasal-congestion-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Nasal Congestion (Space Adaptation) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/nasal-congestion-space-adaptation-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Space Adaptation Nasal Congestion CLIFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-nasal-congestion-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"A few minutes to a few hours after being weightless a sensation of fullness in the head is commonly reported along with nasal congestion. Subjectively crew members complain of discomfort feeling of facial fullness, especially behind the eyes and the in the maxillary and frontal sinus areas. This last from a few hours to a few days, and it usually resolves to a tolerable level when new set points for fluid regulation are established (Baker, 2008). Although nasal congestion poses minimal risk to the crew, it can distract from mission tasks and increase insensible fluid loss from mouth breathing (Marshburn, 2008).","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"early_flight","eva":false,"sex":"any","onset_hours":[1.0,120.0],"mapped":"automatic"},"course":{"incidence_mean":0.5676,"incidence_sd":0.01747,"incidence_text":"mean 0.5676 & SD 0.01747","treated_best":{"probability_pct":[62.0,62.0],"cp1_ti_pct":100.0,"cp1_hours":0.08,"cp2_ti_pct":0.0,"cp2_hours":[0.08,12.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[38.0,38.0],"cp1_ti_pct":100.0,"cp1_hours":0.46,"cp2_ti_pct":2.80361,"cp2_hours":[0.08,216.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.08,"cp2_ti_pct":0.0,"cp2_hours":[0.08,12.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.46,"cp2_ti_pct":2.80361,"cp2_hours":[0.08,216.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"space-adaptation-space-motion-sickness","icl":"ICL97","name":"Space Adaptation - Space Motion Sickness","category":"Neurovestibular Disturbance","cliff":{"label":"Space Motion Sickness (Space Adaptation) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-space-motion-sickness-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Space Motion Sickness (Space Adaptation) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-motion-sickness-space-adaptation-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Space Adaptation Space Motion Sickness CLIFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-space-motion-sickness-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Space Motion Sickness (SMS) is a phenomenon that is experienced by large proportion of spaceflight crew members, up to 60% (Davis et al., 1998; Ortega et al., 2019), that results in general malaise, nausea, gastrointestinal discomfort, and fatigue. There are several theories to explain its etiology including cephalad fluid shifts and neuroanatomical sensory conflicts (Russomano et al., 2019; Lackner et al., 2006). SMS is considered to be part of Space Adaptation Syndrome. This CLiFF condition only includes SMS which initiates from transitioning from gravity to microgravity. Entry Motion Sickness (EMS) or Earth-readaptation syndrome is a similar condition that results from transitioning from microgravity to gravity, and is handled in a different CLiFF.","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"early_flight","eva":false,"sex":"any","onset_hours":[1.0,120.0],"mapped":"automatic"},"course":{"incidence_mean":0.7121,"incidence_sd":0.01875,"incidence_text":"mean: 0.7121 person-missions SD: 0.01875","treated_best":{"probability_pct":[97.0,97.0],"cp1_ti_pct":100.0,"cp1_hours":0.53,"cp2_ti_pct":13.3138,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[3.0,3.0],"cp1_ti_pct":100.0,"cp1_hours":0.53,"cp2_ti_pct":30.9593, a distended bladder secondary to SAS-related urinary retention. Urinary incontinence in flight can also occur secondary to a urinary tract infection. (Jones, 2008a) A urologist who is a NASA flight surgeon reports that of the cases of urinary incontinence which have occurred in-flight most have been stress incontinence, a few cases were of post-void dribbling which was categorized as a minor nuisance, and one case was over flow incontinence secondary to urinary retention. (Jones, 2008b) Irritation of the perineal skin due to continuous contact with wet undergarments or absorbent pads is possible and it is addressed in the Skin Rash CLiFF. Incontinence secondary to urine retention is addressed in the Urinary Retention CLiFF.","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"early_flight","eva":false,"sex":"any","onset_hours":[1.0,120.0],"mapped":"automatic"},"course":{"incidence_mean":0.001415,"incidence_sd":0.001391,"incidence_text":"mean: 0.001415 and SD: 0.001391/male, mean: 0.05101 and SD:","treated_best":{"probability_pct":[100.0,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.75,"cp2_ti_pct":15.9,"cp2_hours":[0.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,0.0],"cp1_ti_pct":100.0,"cp1_hours":0.0,"cp2_ti_pct":0.0,"cp2_hours":[0.0,0.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.75,"cp2_ti_pct":15.9,"cp2_hours":[0.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.0,"cp2_ti_pct":0.0,"cp2_hours":[0.0,0.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"space-flight-associated-neuro-ocular-syndrome-sans","icl":"ICL100","name":"Space Flight Associated Neuro-Ocular Syndrome (Sans)","category":"Vision Changes","cliff":{"label":"Spaceflight Associated Neuro-Ocular Syndrom (SANS) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-flight-associated-neuro-ocular-syndrome-sans-cliff-2023.pdf","list":"cliff119_2023"},"summary":"For the last several decades it has been known that there are changes in visual acuity among astronauts that are due to a complex combination of retinal, ocular, and neurological changes during spaceflight. Several theories to the underlying etiology exist including cephalad fluid shifts, venous congestion, ischemia and inflammation but none seem to completely explain the observed changes. Crew members have been found to have hyperopic shifts, choroidal folds, kinks in the optic nerve, flattening of the posterior globe, increased ICP and several other abnormal findings that are not consistent with terrestrial ophthalmologic diseases. Initially this condition was called Visual Impairment with Increased Intracranial Pressure (VIIP) but more recently has been renamed Spaceflight Associated Neuro-ocular Syndrome (SANS). This constellation of changes has been hard to characterize and classify into a clear and distinct disease process as there is substantial variability among crew members. More recently there has been standardization with the use of ocular coherence tomography among all crew members preflight, in-flight, and post flight which shows total retinal thickness (TRT) changes as one of the most reliable and consistent pathophysiologic findings. The onset of this process can start within 14 day and the end point of these changes is still unclear but the incidence of this condition is much higher in long duration flight than short duration which is troubling for lunar and mars mission planning. For crew members with visual acuity changes due to hyperopic shift, \"space anticipation glasses\" have been used effectively. Other countermeasures to changes in IOP or ICP are still theoretical and have unclear clinical benefit. Much is still unknown about this disease and in preparing this CLIFF the definition and criteria for SANS was being updated based on new data. Our understanding and mitigation of these visual and neurologic changes is expected to evolve substantially in the ensuing years.","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"any","eva":false,"sex":"any","onset_hours":[336.0,2880.0],"mapped":"automatic"},"course":{"incidence_mean":0.2789,"incidence_sd":0.08342,"incidence_text":"Mean 0.2789 and SD 0.08342","treated_best":{"probability_pct":[86.0,86.0],"cp1_ti_pct":100.0,"cp1_hours":2.12,"cp2_ti_pct":22.6947,"cp2_hours":[0.0,12.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[14.0,14.0],"cp1_ti_pct":100.0,"cp1_hours":2.12,"cp2_ti_pct":49.4552,"cp2_hours":[0.0,12.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":2.12,"cp2_ti_pct":31.8097,"cp2_hours":[0.0,12.0],"cp3_ti_pct":22.6947,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":2.12,"cp2_ti_pct":49.4552,"cp2_hours":[0.0,12.0],"cp3_ti_pct":31.8097,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"sprain-strain-back","icl":"ICL101","name":"Sprain/Strain - Back","category":"Musculoskeletal Conditions","cliff":{"label":"Back Sprain/Strain CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/sprain-strain-back-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Back Sprain/Strain CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/back-sprain-strain-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Back Sprain/Strain CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/back-sprain-strain-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Back injury usually involves a strain or sprain in the supporting muscles of the vertebral spine, especially common in the lumbar region, and usually involves pain and task impairment. The most common mechanism of injury terrestrially is lifting. The dynamics of this injury are different in microgravity but may occur when a crewmember is translating a high mass object or during regular exercise (Scheuring et al, 2009). A pre-existing history of a significant back injury increases the risk of occurrence on orbit. For the purpose of this CliFF, back sprain/strain injuries are limited to muscles and ligamentous tissue of the back.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":1.367,"incidence_sd":0.1774,"incidence_text":"Mean: 1.367 SD: 0.1774","treated_best":{"probability_pct":[97.0,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.87,"cp2_ti_pct":17.1937,"cp2_hours":[24.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,3.0],"cp1_ti_pct":100.0,"cp1_hours":2.2,"cp2_ti_pct":44.5952,"cp2_hours":[730.0,11680.0],"cp3_ti_pct":39.2506,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.87,"cp2_ti_pct":44.5952,"cp2_hours":[72.0,672.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":2.2,"cp2_ti_pct":46.8243,"cp2_hours":[730.0,11680.0],"cp3_ti_pct":39.2506,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"sprain-strain-lower-extremity","icl":"ICL102","name":"Sprain/Strain - Lower Extremity","category":"Lower Extremity Injury","cliff":{"label":"Lower Extremity Sprain/Strain CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/sprain-strain-lower-extremity-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Lower Extremity Sprain/Strain CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/lower-extremity-sprain-strain-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Sprains and strains are common musculoskeletal injuries. The most common injury in the United States is Ankle Spra . As this CLIFF is specific to streptococcus, all other bacterial and viral etiologies of pharyngitis are included within ICL 82 - Upper Respiratory Infection.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.008092,"incidence_sd":6.017e-05,"incidence_text":"mean 0.008092 and SD 6.017E-5","treated_best":{"probability_pct":[99.0,99.0],"cp1_ti_pct":100.0,"cp1_hours":0.83,"cp2_ti_pct":2.80361,"cp2_hours":[24.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[1.0,1.0],"cp1_ti_pct":100.0,"cp1_hours":0.83,"cp2_ti_pct":29.5908,"cp2_hours":[240.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[13.0,24.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.83,"cp2_ti_pct":17.991,"cp2_hours":[240.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.83,"cp2_ti_pct":60.085,"cp2_hours":[240.0,336.0],"cp3_ti_pct":60.085,"rtdc_pct":[24.0,24.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"sudden-cardiac-arrest","icl":"ICL106","name":"Sudden Cardiac Arrest","category":"Cardiovascular Conditions","cliff":{"label":"Sudden Cardiac Arrest CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/sudden-cardiac-arrest-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Sudden Cardiac Arrest CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/sudden-cardiac-arrest-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Sudden Cardiac Arrest CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/sudden-cardiac-arrest-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"In Sudden Cardiac Arrest (SCA) the heart suddenly and unexpectedly stops beating. If this happens, blood stops flowing to the brain and other vital organs putting them at risk of severe, irreversible damage in as little as 4 minutes if blood flow is not restored (Maron, 2009). In the context of spaceflight with NASA astronauts, who are heavily screened prior to flight, this condition is most likely to occur as a result of an electrical shock or as the end state of one of the other included conditions capable of affecting heart and lung function.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":4.775e-05,"incidence_sd":1.716e-05,"incidence_text":"mean 4.775E-5 and SD 1.716E-5","treated_best":{"probability_pct":[25.0,25.0],"cp1_ti_pct":100.0,"cp1_hours":0.383,"cp2_ti_pct":54.5575,"cp2_hours":[3.37,432.0],"cp3_ti_pct":9.11507,"rtdc_pct":[100.0,100.0],"locl_pct":[53.0,81.0]},"treated_worst":{"probability_pct":[75.0,75.0],"cp1_ti_pct":100.0,"cp1_hours":0.383,"cp2_ti_pct":100.0,"cp2_hours":[3.37,432.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[94.0,100.0]},"untreated_best":{"cp1_hours":0.383,"cp2_ti_pct":100.0,"cp2_hours":[0.0,3.37],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[100.0,100.0]},"untreated_worst":{"cp1_hours":0.383,"cp2_ti_pct":100.0,"cp2_hours":[0.0,3.37],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[100.0,100.0]},"extraction":"automatic"}},{"cliff_id":"tendinopathy-enthesopathy-bursitis-over-use-injuries-lower-extremity","icl":"ICL107","name":"Tendinopathy/Enthesopathy/Bursitis/Over-Use Injuries - Lower Extremity","category":"Lower Extremity Injury","cliff":{"label":"Lower Extremity Tendinopathy Enthesopathy (Bursitis/Over Use Injuries) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/tendinopathy-enthesopathy-bursitis-over-use-injuries-lower-extremity-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Lower Extremity Tendinopathy Enthesopathy (Bursitis/Over Use Injuries) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/tendinopathy-enthesopathy-bursitis-over-use-injury-lower-extremity-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"This CliFF includes tendinopathy, tendinitis, tenosynovitis, and bursitis of the lower extremity. Tendinopathy is a degeneration of the collagen protein that forms the tendon. Tendinopathy is often caused by overuse of a tendon. Bursitis is an inflammation of a bursa. Symptoms of tendinopathy and bursitis include pain, swelling, and reduced function. Treatment may include rest, activity modification, physical therapy, medications, injections, and surgery. There are no documented episodes of tendinopathy or bursitis in spaceflight. Therefore, terrestrial studies are used to estimate the incidence and outcomes of this condition in spaceflight. This may result in overestimation of the incidence and impact of this condition since the microgravity environment of spaceflight typically results in decreased forces on joints, muscles, and tendons of the lower extremities. However, exercise countermeasures during the transit phase of spaceflight missions and terrestrial EVAs could contribute to the development of lower extremity tendinopathies. The incidence and outcomes of overuse injuries was not included. These conditions may need to be considered in separate CliFFs. There is no IMM CliFF for this condition.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.01469,"incidence_sd":0.005576,"incidence_text":"mean 0.01469 and SD 0.005576","treated_best":{"probability_pct":[62.0,70.0],"cp1_ti_pct":100.0,"cp1_hours":1.36,"cp2_ti_pct":2.80361,"cp2_hours":[672.0,1008.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[30.0,38.0],"cp1_ti_pct":100.0,"cp1_hours":1.36,"cp2_ti_pct":7.62689,"cp2_hours":[1008.0,1344.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.36,"cp2_ti_pct":18.203 _ti_pct":41.4031,"cp2_hours":[720.0,1680.0],"cp3_ti_pct":25.0066,"rtdc_pct":[29.0,100.0],"locl_pct":[29.0,30.0]},"extraction":"automatic"}},{"cliff_id":"toxic-inhalation-exposure","icl":"ICL110","name":"Toxic Inhalation Exposure","category":"Respiratory System Injury","cliff":{"label":"Toxic Inhalation Exposure CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/toxic-inhalation-exposure-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Toxic Inhalation Exposure (Combustion Products) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/toxic-inhalation-exposure-combustion-products-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"The vehicles used in spaceflight use an extensive variety of chemical compounds for propulsion, operation, and life support systems. These compounds often have unique properties that make them invaluable for their specific engineering function. However, they often are also potentially hazardous to crew members aboard these vehicles and may result in a toxic chemical exposure. This CLIFF focuses on chemical irritants that injure the bronchopulmonary system and excludes inhalation of combustion products and chemical skin burns as well as respiratory failure, as these are covered in other CLIFFS. Instead the focus is on chemical pneumonitis resulting in mild pulmonary injury. Inhalational injury is dependent on duration of the exposure, concentration of the offending agent, and its unique chemical properties.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.3543,"incidence_sd":0.1468,"incidence_text":"Mean 0.3543 events per year and SD 0.1468.","treated_best":{"probability_pct":[83.0,83.0],"cp1_ti_pct":100.0,"cp1_hours":1.2,"cp2_ti_pct":15.3069,"cp2_hours":[0.5,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[17.0,17.0],"cp1_ti_pct":100.0,"cp1_hours":1.2,"cp2_ti_pct":37.5365,"cp2_hours":[24.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.2,"cp2_ti_pct":17.991,"cp2_hours":[0.5,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.2,"cp2_ti_pct":75.0731,"cp2_hours":[48.0,336.0],"cp3_ti_pct":75.0731,"rtdc_pct":[0.0,50.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"toxic-inhalation-exposure-combustion-products","icl":"ICL111","name":"Toxic Inhalation Exposure - Combustion Products","category":"Respiratory System Injury","cliff":{"label":"Toxic Inhalation Exposure (Combustion Products) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/toxic-inhalation-exposure-combustion-products-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Toxic Inhalation Exposure (Combustion Products) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/toxic-inhalation-exposure-combustion-products-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Toxic inhalation exposure - combustion products is intended to be a condition that occurs during or after a fire within the habitable volume of the spacecraft in which smoke is inhaled by the crew. This smoke inhalation has 3 primary mechanisms of injury: thermal damage, asphyxiation, and pulmonary irritation. Thermal damage is typically limited to the oropharyngeal area. In animal studies the inhaled air can be 142o C then when it reaches the carina it has cooled to 38o C. Asphyxia causing tissue hypoxia occurs as the combustion utilizes the oxygen, which decreases the concentration of oxygen to 10-13%. The decrease in fraction of inspired oxygen (FI02) leads to hypoxia. Carbon monoxide further contributes to the tissue hypoxia by decreasing the oxygen-carrying capacity of the blood. Lastly pulmonary irritation can cause direct tissue injury, acute bronchospasm and activation of the body’s inflammatory response system (Lafferty, 2010) Smoke inhalation injury continues to increase morbidity and mortality in burn patients in both the third world and industrialized countries. The lack of uniform criteria for the diagnosis and definition of smoke inhalation injury contributes to the fact that, despite extensive research, mortality rates have changed little in recent decades. The formation of reactive oxygen and nitrogen species, as well as the procoagulant and antifibrinolytic imbalance of alveolar homeostasis, all play a central role in the pathogenesis of smoke inhalation injury. Further hallmarks include massive airway obstruction owing to cast formation, bronchospasm, the increase in bronchial circulation and transvascular fluid flux. Therefore, anticoagulants, antioxidants and bronchodilators, especially when administered as an aerosol, represent the most promising treatment strategies (Rehberg, 2009)","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_sd":0.00668,"incidence_text":"9E-3 and SD 6.68E-3","treated_best":{"probability_pct":[94.1,100.0],"cp1_ti_pct":100.0,"cp1_hours":1.2,"cp2_ti_pct":44.8047,"cp2_hours":[3.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,27.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,5.9],"cp1_ti_pct":100.0,"cp1_hours":1.2,"cp2_ti_pct":50.0,"cp2_hours":[22.4,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[20.0,88.6],"locl_pct":[2.6,47.0]},"untreated_best":{"cp1_hours":1.2,"cp2_ti_pct":69.8047,"cp2_hours":[8.7,72.0],"cp3_ti_pct":50.0,"rtdc_pct":[0.0,53.7],"locl_pct":[0.0,1.5]},"untreated_worst":{"cp1_hours":1.2,"cp2_ti_pct":100.0,"cp2_hours":[36.0,168.0],"cp3_ti_pct":100.0,"rtdc_pct":[33.0,100.0],"locl_pct":[14.9,100.0]},"extraction":"automatic"}},{"cliff_id":"trauma-abdominal-injury-blunt","icl":"ICL112","name":"Trauma - Abdominal Injury (Blunt)","category":"Abdominal Injury","cliff":{"label":"Abdominal Injury (Blunt/Trauma) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/trauma-abdominal-injury-blunt-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Trauma-Chest Injury (Blunt) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/trauma-chest-injury-blunt-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Trauma injuries, in general, account for 8% of terrestrial mortality (WHO 2021), and are one of the leading causes of death for those under age 45. Blunt abdominal trauma (BAT) makes up a significant proportion of these injuries and can be as benign as acute abdominal pain or abdominal wall bruising, or can lead to serious organ or vascular injury. Injury to abdominal organs occurs through several mechanisms including but not limited to crush injuries from direct trauma, transmission of stress waves from direct trauma, or shear injury from deceleration. Such complications from blunt injuries may not always be immediately clinically apparent, thus making diagnosis, especially in a resource-limited setting, important. However, as BAT encompasses a heterogenous group of injuries, management can range from expectant management to immediate need for surgical intervention. In this CLiFF we explore acute blunt abdominal traumas that may occur during spaceflight, namely during surface operations.","applicability":{"incidence_type":"UNK","segment":"Surface","envs":["T3","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0001787,"incidence_sd":7.607e-07,"incidence_text":"mean 1.787E-4 and SD 7.607E-7","treated_best":{"probability_pct":[86.0,86.0],"cp1_ti_pct":100.0,"cp1_hours":1.4,"cp2_ti_pct":3.25538,"cp2_hours":[0.0,23.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[14.0,14.0],"cp1_ti_pct":100.0,"cp1_hours":1.67,"cp2_ti_pct":50.0,"cp2_hours":[175.2,2880.0],"cp3_ti_pct":0.0,"rtdc_pct":[13.7,20.0],"locl_pct":[13.0,15.6]},"untreated_best":{"cp1_hours":1.4,"cp2_ti_pct":22.4422,"cp2_hours":[0.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.67,"cp2_ti_pct":100.0,"cp2_hours":[1008.0,2880.0],"cp3_ti_pct":100.0,"rtdc_pct":[20.0,100.0],"locl_pct":[15.6,31.0]},"extraction":"automatic"}},{"cliff_id":"trauma-chest-injury-blunt","icl":"ICL113","name":"Trauma - Chest Injury (Blunt)","category":"Chest Injury","cliff":{"label":"Chest Injury (Blunt/Trauma) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/trauma-chest-injury-blunt-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Trauma-Chest Injury (Blunt) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/trauma-chest-injury-blunt-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Thoracic injury is a common reason to be admitted to major trauma centers. The spectrum of thoracic injuries ranges from brief, uneventful injuries to critical conditions requiring treatment in intensive care units (ICUs) such as pneumothorax, hemothorax, rib fracture, flail chest, and acute respiratory distress syndrome (ARDS). Chest trauma is traditionally classified as blunt or penetrating. In blunt trauma the chest wall remains intact; in penetrating injuries the integrity of the chest wall is breached. Blunt trauma is more common than penetrating chest injury. Ribs may be fractured and produce bruising or puncture the lung. Associated pain may impair breathing. Pneumothoraces and hemothoraces are space-occupying lesions that interfere with gas exchange primarily by compressing otherwise healthy lung parenchyma. Pneumothorax is the collection of air within the pleural cavity. As the pneumothorax enlarges, the lung becomes smaller. A hemothorax can accommodate approximately 40% of the total blood volume. A lung contusion is usually a combination of alveolar hemorrhage with interstitial hemorrhage and edema. Most patients have minimal respiratory deficit as a result of the injury. Extensive contusions may result in respiratory difficulty or progress to acute respiratory distress syndrome (Khan, 2008). For this CliFF, modeling of chest injuries in spaceflight on the International Space Station (Lewandowski, 2013) is used to estimate the incidence of blunt chest injury among astronauts in spaceflight and to estimate the best case/worst case percentages. Terrestrial general population studies are used to estimate the outcomes (RTDC and LOCL) for chest injury in spaceflight.","applicability":{"incidence_type":"UNK","segment":"Surface","envs":["T3","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.012,"incidence_sd":0.006,"incidence_text":"mean 1.2E-2 and SD6E-3","treated_best":{"probability_pct":[93.0,93.0],"cp1_ti_pct":100.0,"cp1_hours":1.66,"cp2_ti_pct":5.18204,"cp2_hours":[6.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[7.0,7.0],"cp1_ti_pct":100.0,"cp1_hours":1.9,"cp2_ti_pct":52.8036,"cp2_hours":[24.0,528.0],"cp3_ti_pct":5.60723,"rtdc_pct":[0.0,32.0],"locl_pct":[0.0,3.65]},"untreated_best":{"cp1_hours":1.66,"cp2_ti_pct":22.4422,"cp2_hours":[6.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.9,"cp2_ti_pct":100.0,"cp2_hours":[72.0,648.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,49.0]},"extraction":"automatic"}},{"cliff_id":"trauma-minor-head","icl":"ICL114","name":"Trauma - Minor Head","category":"Head Injury","cliff":{"label":"Minor Head Injury (Trauma) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/trauma-minor-head.pdf","list":"cliff119_2023"},"peer_review":{"label":"Trauma-Minor Head CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/trauma-–-minor-head-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"This CLiFF includes concussion, post-concussion syndrome, and non-operative intracranial bleeds resulting in concussive or post-concussive symptoms. Most sources consider a concussion to be a mild, temporary, traumatic brain injury. Concussions are cause by impact with the head or body that causes the brain to move rapidly within the skull (CDC, 2021). Symptoms of concussion vary, but can include headache, nausea, vomiting, fatigue, changes in vision, confusion, amnesia, dizziness, changes in speech and response time, and forgetfulness (Mayo, 2021). Concussive symptoms typically resolve within 3 months. Post-concussive syndrome involves persistent concussive symptoms. (Mayo, 2021)","applicability":{"incidence_type":"UNK","segment":"Surface","envs":["T3","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.001937,"incidence_sd":3.911e-06,"incidence_text":"Mean: 0.001937 SD: 3.911E-6","treated_best":{"probability_pct":[87.0,87.0],"cp1_ti_pct":100.0,"cp1_hours":0.783,"cp2_ti_pct":32.979,"cp2_hours":[24.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[7.4,10.3],"locl_pct":[0.0,0.6]},"treated_worst":{"probability_pct":[13.0,13.0],"cp1_ti_pct":100.0,"cp1_hours":0.783,"cp2_ti_pct":55.6737,"cp2_hours":[336.0,744.0],"cp3_ti_pct":0.0,"rtdc_pct":[10.3,17.8],"locl_pct":[0.0,0.6]},"untreated_best":{"cp1_hours":0.783,"cp2_ti_pct":41.9081,"cp2_hours":[24.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[7.4,10.3],"locl_pct":[0.0,0.6]},"untreated_worst":{"cp1_hours":0.783,"cp2_ti_pct":64.6027,"cp2_hours":[336.0,8760.0],"cp3_ti_pct":0.0,"rtdc_pct":[10.3,17.8],"locl_pct":[0.0,0.6]},"extraction":"automatic"}},{"cliff_id":"trauma-severe-head","icl":"ICL115","name":"Trauma - Severe Head","category":"Head Injury","cliff":{"label":"Severe Head Injury (Trauma) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/trauma-severe-head-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Trauma-Severe Head CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/trauma-–-severe-head-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Traumatic Brain Injury (TBI) occurs as a result of a \"violent blow\" or jolt to the head (Mayo, 2021). This CLiFF pertains only to severe TBI. Unfortunately, there is no globally accepted definition of severe TBI and multiple classifications systems exist. The classification is complicated by the heterogeneity of presentations with TBI. Classification systems can be based on symptoms, pathoanatomic, etiologic, mechanistic, or prognostic. A post-resuscitative Glasgow Coma Scale (GCS) score of < 9 is often used as one of the criteria for severe TBI. (Hawryluk and Manley, 2015) This CLiFF uses a GCS of < 9. Most severe TBI injuries involve a loss of consciousness and many classification systems also describe a length of loss of consciousness as part of their criteria. Because of the heterogeneity between these classification systems, this was not considered for the definition of this CLiFF. Symptoms of severe TBI may include loss of consciousness, headache, nausea and vomiting, convulsions/seizures, pupillary changes, weakness or numbness, loss or coordination, and/or cerebrospinal fluid leaking from the nose or ears (Mayo, 2021). Note that seizures are a separate CLiFF (ICL 83 - Seizures) and not considered in this CLiFF.","applicability":{"incidence_type":"UNK","segment":"Surface","envs":["T3","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.000196,"incidence_sd":1.037e-06,"incidence_text":"Mean: 1.96E-4 SD: 1.037E-6","treated_best":{"probability_pct":[2.77,10.0],"cp1_ti_pct":100.0,"cp1_hours":1.82,"cp2_ti_pct":100.0,"cp2_hours":[96.0,70080.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[25.0,35.0]},"treated_worst":{"probability_pct":[90.0,97.23],"cp1_ti_pct":100.0,"cp1_hours":1.82,"cp2_ti_pct":54.5575,"cp2_hours":[0.0,2568.0],"cp3_ti_pct":9.115,"rtdc_pct":[100.0,100.0],"locl_pct":[37.0,65.0]},"untreated_best":{"cp1_hours":1.82,"cp2_ti_pct":100.0,"cp2_hours":[0.0,336.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[100.0,100.0]},"untreated_worst":{"cp1_hours":1.82,"cp2_ti_pct":100.0,"cp2_hours":[0.0,64.8],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[100.0,100.0]},"extraction":"automatic"}},{"cliff_id":"traumatic-hypovolemic-shock","icl":"ICL116","name":"Traumatic Hypovolemic Shock","category":"Cardiovascular Conditions","cliff":{"label":"Traumatic Hypovolemic Shock CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/traumatic-hypovolemic-shock-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Traumatic Hypovolemic Shock CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/traumatic-hypovolemic-shock-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Traumatic Hypovolemic Shock CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/traumatic-hypovolemic-shock-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"The state of \"shock\" is defined as cellular and tissue hypoxia due to circulatory failure to meet cellular metabolic and oxygen requirements. Blood loss can cause depletion of intravascular volume and clinical decompensation, resulting in hypovolemic shock (Suresh, 2018). Blunt or penetrating trauma can often lead to significant blood loss, making traumatic hypovolemic shock one of the most common etiologies of shock. The general principal for treatment of hypovolemic shock is fluid repletion. Delayed treatment can often result in multi-organ failure. In addition to treating the underlying cause of hypovolemia (stopping the bleeding), traumatic hypovolemic shock should generally be managed initially with crystalloid solutions followed by blood products (Neal, 2012). In space, the greatest risk of severe trauma is present during extravehicular activities (EVAs) (McCuaig, 1992; Trunkey, 1986). Micrometeorites can cause penetrating traumas while many objects can potentially result in crush-type injuries during EVAs (Kirkpatrick, 2009).","applicability":{"incidence_type":"UNK","segment":"Surface","envs":["T3","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_sd":0.001155,"incidence_text":"0.004295 SD 0.001155","treated_best":{"probability_pct":[80.0,80.0],"cp1_ti_pct":100.0,"cp1_hours":2.0,"cp2_ti_pct":100.0,"cp2_hours":[3.0,48.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[20.0,20.0],"cp1_ti_pct":100.0,"cp1_hours":2.0,"cp2_ti_pct":100.0,"cp2_hours":[264.0,912.0],"cp3_ti_pct":0.0,"rtdc_pct":[86.0,100.0],"locl_pct":[20.0,100.0]},"untreated_best":{"cp1_hours":2.0,"cp2_ti_pct":100.0,"cp2_hours":[24.0,48.0],"cp3_ti_pct":0.0,"rtdc_pct":[20.0,86.0],"locl_pct":[10.0,20.0]},"untreated_worst":{"cp1_hours":2.0,"cp2_ti_pct":100.0,"cp2_hours":[264.0,912.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[80.0,100.0]},"extraction":"automatic"}},{"cliff_id":"urinary-tract-infection","icl":"ICL117","name":"Urinary Tract Infection","category":"Urogenital Conditions","cliff":{"label":"Urinary Tract Infection CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/urinary-tract-infection-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Urinary Tract Infection CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/urinary-tract-infection-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Urinary Tract Infection CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/urinary-tract-infection-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Urinary tract infections encompass multiple pathologies including an infection of the lower urinary tract (involving the urethra or bladder; urethritis or cystitis) or an ascending infection from the bladder through the ureters to the kidneys leading to pyelonephritis. \"Uncomplicated\" UTIs are defined as UTIs that occur in non-pregnant hosts with no structural or functional abnormalities, and who have not been instrumented (ex. with a catheter or cystoscope). All other UTIs are considered \"complicated\". Other risk factors for UTI in men include benign prostatic hypertrophy (BPH) or a stricture causing obstruction, and being uncircumcised. While some forms of prostatitis can be closely related or even considered to be UTIs, prostatitis is covered under a separate condition (ICL #77). The overwhelming majority of infections in females are caused by E. coli (Schaeffer 2007, Foxman, 2010). Other organisms include members of the family Enterobacteriaceae, streptococci and staphylococci species, and yeast. Importantly, the microgravity environment predisposes astronauts to UTIs by promoting the formation of urinary tract calculi and relative dehydration through fluid shifts and decreased oral intake. There are well-documented past cases of UTIs during spaceflight in both men and women as we will cover below","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.1345,"incidence_sd":0.06114,"incidence_text":"male mean 0.1345 and SD 0.06114, female mean 0.858 and SD","treated_best":{"probability_pct":[99.0,99.0],"cp1_ti_pct":100.0,"cp1_hours":0.81,"cp2_ti_pct":9.11507,"cp2_hours":[72.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[1.0,1.0],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":30.6139,"cp2_hours":[168.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,8.8],"locl_pct":[0.0,8.7]},"untreated_best":{"cp1_hours":0.81,"cp2_ti_pct":30.7733,"cp2_hours":[96.0,1008.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.0,"cp2_ti_pct":39.41,"cp2_hours":[168.0,1008.0],"cp3_ti_pct":39.41,"rtdc_pct":[7.0,40.0],"locl_pct":[4.1,20.0]},"extraction":"automatic"}},{"cliff_id":"vaginal-yeast-infection","icl":"ICL118","name":"Vaginal Yeast Infection","category":"Urogenital Conditions","cliff":{"label":"Vaginal Yeast Infection CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/vaginal-yeast-infection-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Vaginal Yeast Infection CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/vaginal-yeast-infection-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Vaginal Yeast Infections CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/vaginal-yeast-infection-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Vulvovaginal Candidiasis (VVC) is a yeast infection of the vulva and/or vagina mainly caused by Candida albicans. Candida albicans is normally a harmless yeast infection that can be found in the mouth, intestinal tract, or vagina. It can lead to symptoms when overgrowth occurs, and this can often follow administration of systemic antibiotics that kill off the normal flora in these locations. VVC is characterized by pruritis, discomfort/pain, abnormal vaginal discharge, dysuria, and/or dyspareunia. Signs can include swelling, redness, fissures, excoriations. Up to 75% of women will have at least one episode of VVC in their life and 40-45% will have 2+ episodes. On the basis of clinical presentation, microbiology, host factors, and response to therapy, VVC infections can be labeled as complicated or uncomplicated. Uncomplicated VVC infections, by definition, include: sporadic or infrequent VVC, mild-to-moderate VVC, and likely to be C. albicans in non-immunocompromised women. Complicated VVC can be recurrent, severe, nonalbicans species, or women with immunocompromising conditions including HIV infection, diabetes, debilitation, or immunosuppressive therapy. 10-20% of VVC may be complicated by these criteria (CDC 2015). Of all infectious vaginitis, 20-25% is caused by candida, while 40-50% is caused by bacterial vaginosis (BV), and 15-20% is caused by trichomoniasis. Pre-flight screening and treatment should prevent trichomoniasis while BV will likely be investigated in a future CLiFF.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"F","mapped":"automatic"},"course":{"incidence_mean":0.2553,"incidence_sd":0.01771,"incidence_text":"mean 0.2553 and SD 0.01771","treated_best":{"probability_pct":[90.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":0.666,"cp2_ti_pct":5.76668,"cp2_hours":[24.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,10.0],"cp1_ti_pct":100.0,"cp1_hours":0.666,"cp2_ti_pct":5.76668,"cp2_hours":[72.0,4380.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.666,"cp2_ti_pct":5.76668,"cp2_hours":[72.0,8760.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.666,"cp2_ti_pct":5.76668,"cp2_hours":[336.0,8760.0],"cp3_ti_pct":5.76668,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"venous-thromboembolism","icl":"ICL119","name":"Venous Thromboembolism","category":"Cardiovascular Conditions","cliff":{"label":"Venous Thromboembolism (VTE) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/venous-thromboembolism-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Venous Thromboembolism (VTE) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/venous-thromboembolism-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Venous thromboembolism (VTE) - this is intended to be a condition that occurs secondary to the increased stasis of blood in the venous vasculature as a result of the changing fluid dynamics from spaceflight and micro-gravity. At this time, this is an evolving condition for human spaceflight. Previously, this condition was predicted to be a low risk, due in large part to the lack of symptoms present in crew during missions and upon return to home. However, recent events (potentially more than one crew member with VTE during missions on ISS) have called this risk profile into question. VTE derives from blood clots that have formed in the deeper venous vasculature and can occlude blood flow return to the heart or can break free (emboli) and lodge into and potentially obstruct flow into the pulmonary or other vasculature causing ischemia (pulmonary embolism). Terrestrially, the venous vasculature that is particularly dangerous are the deeper veins because these are larger in diameter resulting in larger clots that are more damaging when they break free. Immobilization is a strong risk factor for VTE as blood pools platelets aggregate and the coagulation cascade is activated. In microgravity, blood is commonly displaced from its normal flow pattern and can pool more readily, particularly in the vasculature in the upper body, rather than the lower body as is seen on the ground. It is likely for this reason that the VTEs observed on orbit were in the upper body, which is much less common terrestrially.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.000398,"incidence_sd":0.000182,"incidence_text":"mean 3.98E-4 and SD 1.82E-4","treated_best":{"probability_pct":[60.0,60.0],"cp1_ti_pct":100.0,"cp1_hours":1.416,"cp2_ti_pct":5.60723,"cp2_hours":[2016.0,8736.0],"cp3_ti_pct":5.60723,"rtdc_pct":[4.74,12.0],"locl_pct":[1.45,11.1]},"treated_worst":{"probability_pct":[40.0,40.0],"cp1_ti_pct":100.0,"cp1_hours":2.0,"cp2_ti_pct":9.46054,"cp2_hours":[2016.0,8736.0],"cp3_ti_pct":5.60723,"rtdc_pct":[100.0,100.0],"locl_pct":[2.4,15.0]},"untreated_best":{"cp1_hours":1.416,"cp2_ti_pct":9.46054,"cp2_hours":[2016.0,8736.0],"cp3_ti_pct":5.60723,"rtdc_pct":[51.0,51.0],"locl_pct":[2.5,20.3]},"untreated_worst":{"cp1_hours":2.0,"cp2_ti_pct":100.0,"cp2_hours":[2016.0,8736.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[5.0,26.32]},"extraction":"automatic"}},{"cliff_id":"gravity-well-entry-motion-sickness","icl":"ICL122","name":"Gravity Well Entry Motion Sickness","category":"Neurovestibular Disturbance","cliff":{"label":"Gravity Well Entry (Motion Sickness) Cliff (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/gravity-well-entry-motion-sickness-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Gravity Well Entry Motion Sickness Cliff Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/gravity-well-entry-motion-sickness-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Entry Motion Sickness is the collection of physiologic changes during the initial postflight period of motion sickness when the astronaut is readapting to Earth's gravity or a partial gravity environment after adaptation to a period weightlessness. It is a state of diminished health in response to reacclimating from a microgravity environment, to which the astronaut has adapted to, back to a gravitational field, requiring readaptation. This includes the possibility for symptoms regarding the lunar gravitational field of 1/6th g. Symptomatic presentation is highly variable. (Ortega, 2019) It is usually a self-limited condition, mild in severity for shorter missions, resembling acute terrestrial motion sickness. Longer missions could possibly, though unlikely, pose an operational risk with respect to astronaut reentry tasks such as piloting and egress. (Heer 2006, Bacal 2003)","applicability":{"incidence_type":"UNK","segment":"Gravity Well Transition","envs":["T3","T5"],"timing":"surface_arrival","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.07191,"incidence_sd":0.06703,"incidence_text":"mean 0.07191 per person and SD 0.06703","treated_best":{"probability_pct":[100.0,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":13.38,"cp2_hours":[0.0,48.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,0.0] ptoms last do not take more than 6 tablets in 24 hours, unless directed by a doctor do not take for more than 10 days unless directed by a doctor children under 12 years: ask a","source":{"doc":"FDA label via DailyMed: ACETAMINOPHEN EXTRA STRENGTH (ACETAMINOPHEN) TABLET, FILM COATED [CVS PHARMACY]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=64a1ebe7-af28-4b09-96e8-28fa4dcc52bd"},"see_also":[]},{"id":"drug-acetazolamide","kind":"drug","title":"acetazolamide","text":"In the IMM kits: Diamox (Acetazolamide) 250 Mg Tablets: ISS 100, Orion 6. Uses: For adjunctive treatment of: edema due to congestive heart failure; drug-induced edema; centrencephalic epilepsies (petit mal, unlocalized seizures); chronic simple (open-angle) glaucoma, secondary glaucoma, and preoperatively in acute angle-closure glaucoma where delay of surgery is desired in order to lower intraocular pressure. Acetazolamide tablets, USP are also indicated for the prevention or amelioration of symptoms associated with acute mountain sickness in climbers attempting rapid ascent and in those who are very susceptible to acute mountain sickness despite gradual Contraindications: Hypersensitivity to acetazolamide or any excipients in the formulation. Since acetazolamide is a sulfonamide derivative, cross sensitivity between acetazolamide, sulfonamides and other sulfonamide derivatives is possible. Acetazolamide therapy is contraindicated in situations in which sodium and/or potassium blood serum levels are depressed, in cases of marked kidney and liver disease or dysfunction, in suprarenal gland failure, and in hyperchloremic acidosis. It is contraindicated in patients with cirrhosis because of the risk of development of hepatic encephalopathy. Long-term… Dosage: Glaucoma: Acetazolamide should be used as an adjunct to the usual therapy. The dosage employed in the treatment of chronic simple (open-angle) glaucoma ranges from 250 mg to 1 g of acetazolamide per 24 hours, usually in divided doses for amounts over 250 mg. It has usually been found that a dosage in excess of 1 g per 24 hours does not produce an increased effect. In all cases, the dosage should be adjusted with careful individual attention both to symptomatology and ocular tension. Continuous supervision by a physician is advisable. In treatment of secondary glaucoma and in the preoperative…","source":{"doc":"FDA label via DailyMed: ACETAZOLAMIDE TABLET [AJANTA PHARMA USA INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=240ab24b-3124-4805-80c2-36dd1945e3b3"},"see_also":[]},{"id":"drug-albuterol","kind":"drug","title":"albuterol","text":"In the IMM kits: Albuterol Inhaler (Proventil) 90 Mcg, 6.7 Gm: ISS 3, Orion 2. Uses: Albuterol sulfate inhalation aerosol is a beta 2 -adrenergic agonist indicated for: • Treatment or prevention of bronchospasm in patients 4 years of age and older with reversible obstructive airway disease. ( 1.1 ) • Prevention of exercise-induced bronchospasm in patients 4 years of age and older. ( 1.2 ) 1.1 Bronchospasm Albuterol sulfate inhalation aerosol is indicated for the treatment or prevention of bronchospasm in patients 4 years of age and older with reversible obstructive airway disease. 1.2 Exercise-Induced Bronchospasm Albuterol sulfate inhalation aerosol is indicated for the… Dosage: For oral inhalation only • Treatment or prevention of bronchospasm in adults and children 4 years of age and older: 2 inhalations every 4 to 6 hours. In some patients, one inhalation every 4 hours may be sufficient. ( 2.1 ) • Prevention of exercise-induced bronchospasm in adults and children 4 years of age and older: 2 inhalations 15 to 30 minutes before exercise. ( 2.2 ) • Priming information: Prime albuterol sulfate inhalation aerosol before using for the first time, or when the inhaler has not been used for more than 2 weeks. To prime albuterol sulfate inhalation aerosol, release 3 sprays… Contraindications: Albuterol sulfate inhalation aerosol is contraindicated in patients with a history of hypersensitivity to albuterol and any other albuterol sulfate inhalation aerosol components. Rare cases of hypersensitivity reactions, including urticaria, angioedema, and rash have been reported after the use of albuterol sulfate [see WARNINGS AND PRECAUTIONS ( 5.6 )] . Hypersensitivity to albuterol and any other albuterol sulfate inhalation aerosol Components. ( 4","source":{"doc":"FDA label via DailyMed: ALBUTEROL SULFATE AEROSOL, METERED [A-S MEDICATION SOLUTIONS]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=52e209ac-7156-4496-ba5a-42ee59d45deb"},"see_also":[]},{"id":"drug-amoxicillin","kind":"drug","title":"amoxicillin","text":"In the IMM kits: Amoxicillin 500 Mg Capsule: ISS 60, Orion 22, lunar lander 14. Uses: Adults and Pediatric Patients Upper Respiratory Tract Infections of the Ear, Nose, and Throat Amoxicillin is indicated in the treatment of infections due to susceptible (ONLY β-lactamase–negative) isolates of Streptococcus species. (α- and β-hemolytic isolates only), Streptococcus pneumoniae , Staphylococcus spp. , or Haemophilus influenzae. Infections of the Genitourinary Tract Amoxicillin is indicated in the treatment of infections due to susceptible (ONLY β-lactamase–negative) isolates of Escherichia coli, Proteus mirabilis, or Enterococcus faecalis. Infections of the Skin and Skin… Dosage: In Adults, 750 to1750 mg/day in divided doses every 8 to12 hours. In Pediatric Patients over 3 Months of Age, 20 to 45 mg/kg/day in divided doses every 8 to12 hours. Refer to full prescribing information for specific dosing regimens. ( 2.2 , 2.3 ) The upper dose for neonates and infants aged 3 months or younger is 30 mg/kg/day divided every 12 hours. ( 2.3 ) Dosing for H. pylori Infection (in Adults): Triple therapy: 1 gram amoxicillin, 500 mg clarithromycin, and 30 mg lansoprazole, all given twice daily (every 12 hours) for 14 days. Dual therapy: 1 gram amoxicillin and 30 mg lansoprazole,… Contraindications: Amoxicillin is contraindicated in patients who have experienced a serious hypersensitivity reaction (e.g., anaphylaxis or Stevens-Johnson syndrome) to amoxicillin or to other β-lactam antibacterial drugs (e.g., penicillins and cephalosporins). History of a serious hypersensitivity reaction (e.g., anaphylaxis or Stevens-Johnson syndrome) to amoxicillin or to other beta-lactams (e.g., penicillins or cephalosporins) ( 4","source":{"doc":"FDA label via DailyMed: AMOXICILLIN CAPSULE [REMEDYREPACK INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=82c0c5d1-df2d-4352-bd12-99f955af569e"},"see_also":[]},{"id":"drug-aripiprazole","kind":"drug","title":"aripiprazole","text":"In the IMM kits: Abilify (Aripiprazole) 5 Mg: ISS 60; Abilify (Aripiprazole) 7.5 Mg/Ml, 1.3 Ml: ISS 2. Uses: Aripiprazole Tablets are indicated for the treatment of: • Schizophrenia • Irritability Associated with Autistic Disorder • Treatment of Tourette’s Disorder Aripiprazole tablets are an atypical antipsychotic. Aripiprazole tablets are indicated for: • Schizophrenia. ( 14.1 ) • Irritability Associated with Autistic Disorder. ( 14.4 ) • Treatment of Tourette’s Disorder. ( 14.5 Dosage: • Administer once daily without regard to meals ( 2 ) Initial Dose Recommended Dose Maximum Dose Schizophrenia – adults (2.1) 10 to 15 mg/day 10 to 15 mg/day 30 mg/day Schizophrenia – adolescents (2.1) 2 mg/day 10 mg/day 30 mg/day Irritability associated with autistic disorder – pediatric patients (2.4) 2 mg/day 5 to 10 mg/day 15 mg/day Tourette’s Disorder – (2.5) Patients <50 kg 2 mg/day 5 mg/day 10 mg/day Patients ≥50 kg 2 mg/day 10 mg/day 20 mg/day • Known CYP2D6 poor metabolizers: Half of the usual dose. ( 2.6 ) 2.1 Schizophrenia Adults The recommended starting and target dose for… Contraindications: Aripiprazole tablets are contraindicated in patients with a history of a hypersensitivity reaction to aripiprazole. Reactions have ranged from pruritus/urticaria to anaphylaxis [see Adverse Reactions (6.2) ] . • Known hypersensitivity to aripiprazole. ( 4","source":{"doc":"FDA label via DailyMed: ARIPIPRAZOLE TABLET [MAJOR PHARMACEUTICALS]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=573c6bb6-941f-4413-8c23-826025385864"},"see_also":[]},{"id":"drug-aspirin","kind":"drug","title":"aspirin","text":"In the IMM kits: Aspirin 325Mg Tab.: ISS 120, Orion 1, lunar lander 3. Uses: temporarily relieves headache muscle pain toothache menstrual pain pain and fever of colds minor pain of Dosage: drink a full glass of water with each dose adults and children 12 years and over: take 1 or 2 tablets every 4 hours or 3 tablets every 6 hours, not to exceed 12 tablets in 24 hours children under 12 years: consult a","source":{"doc":"FDA label via DailyMed: BAYER GENUINE ASPIRIN (ASPIRIN) TABLET [SELECT CONSUMER GROUP]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3ca776c2-47ed-5107-e063-6394a90ac5df"},"see_also":[]},{"id":"drug-atropine","kind":"drug","title":"atropine","text":"In the IMM kits: Atropine 1 Mg, 10Ml Syringe.: ISS 2. Uses: Atropine Sulfate Injection, USP, is indicated for temporary blockade of severe or life threatening muscarinic effects, e.g., as an antisialagogue, an antivagal agent, an antidote for organophosphorus or muscarinic mushroom poisoning, and to treat bradyasystolic cardiac arrest. Atropine is a muscarinic antagonist indicated for temporary blockade of severe or life threatening muscarinic effects. ( 1 Dosage: For intravenous administration ( 2.1 ) Titrate according to heart rate, PR interval, blood pressure and symptoms ( 2.1 ) Adult dosage Antisialagogue or for antivagal effects: Initial single dose of 0.5 mg to 1 mg ( 2.2 ) Antidote for organophosphorus or muscarinic mushroom poisoning: Initial single dose of 2 mg to 3 mg, repeated every 20-30 minutes ( 2.2 ) Bradyasystolic cardiac arrest: 1 mg dose, repeated every 3-5 minutes if asystole persists ( 2.2 ) Patients with Coronary Artery Disease: Limit the total dose t Med: CANKERMELTS (BENZOCAINE) LOZENGE [QUEST PRODUCTS, LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=070dae82-14c2-66d2-e063-6394a90ab259"},"see_also":[]},{"id":"drug-bisacodyl","kind":"drug","title":"bisacodyl","text":"In the IMM kits: Dulcolax (Bisacodyl) Tablet 5Mg: ISS 40, Orion 16, lunar lander 2. Uses: ▪ for temporary relief of occasional constipation and irregularity ▪ this product generally produces a bowel movement in 6 to 12 Dosage: take with a glass of water adults and children 12 years of age and over 1 to 3 tablets in a single daily dose children 6 to under 12 years of age 1 tablet in a single daily dose children under 6 years of age ask a","source":{"doc":"FDA label via DailyMed: PUBLIX STIMULANT LAXATIVE (BISACODYL) TABLET, COATED [PUBLIX SUPER MARKETS, INC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=02e596a7-b8e5-4f55-9bc6-6d17e0fabda7"},"see_also":[]},{"id":"drug-bismuth-subsalicylate","kind":"drug","title":"bismuth subsalicylate","text":"In the IMM kits: Pepto-Bismol 262Mg Chewable Tabs: ISS 80, Orion 6, lunar lander 4. Uses: relieves ▪ travelers' diarrhea ▪ diarrhea ▪ upset stomach due to overindulgence in food and drink, including ▪ heartburn ▪ indigestion ▪ nausea ▪ gas ▪ belching ▪ Dosage: ▪ chew or dissolve tablets in mouth ▪ adults and children 12 years and over: 2 tablets every 1/2 to 1 hour as needed ▪ do not exceed 8 doses (16 tablets) in 24 hours ▪ use until diarrhea stops but not more than 2 days ▪ drink plenty of clear fluids to help prevent dehydration caused by diarrhea ▪ children under 12 years: ask a","source":{"doc":"FDA label via DailyMed: CHEWABLE STOMACH RELIEF (BISMUTH SUBSALICYLATE) TABLET, CHEWABLE [PUBLIX SUPER MARKETS INC,]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2a316e06-5c16-46b8-b9ac-71fe0f92c515"},"see_also":[]},{"id":"drug-carbamide-peroxide","kind":"drug","title":"carbamide peroxide","text":"In the IMM kits: Debrox For Earwax (Carbamide Peroxide) 6.5% 15Ml Bottle: ISS 4. Uses: For occasional use as an aid to soften, loosen and remove excessive Dosage: FOR USE IN THE EAR ONLY Remove any earing aids before use Adults and children over 12 yrs of age: tilt head to the side and place 10 drops into the ear. Tip of applicator should not enter into the ear canal Keep drops in ear for several minutes by keeping head tilted sideways or placing cotton in the ear. Use twice daily for up to 4 days if needed, or as directed by a doctor. Any wax remaining after treatment may be removed by gently flushing the ear with warm water, using a soft rubber bulb ear syringe. Children under 12 yrs of age: Consult a","source":{"doc":"FDA label via DailyMed: EAR DROPS (CARBAMIDE PEROXIDE 6.5%) LIQUID [BIONPHARMA INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=e8bcf92c-ad32-49d5-e053-2995a90ae0c6"},"see_also":[]},{"id":"drug-carboxymethylcellulose","kind":"drug","title":"carboxymethylcellulose","text":"In the IMM kits: Refresh Artificial Tears (Carboxymethylcellulose) 0.5%, 0.4Ml Bottle: ISS 40, Orion 6, lunar lander 3. Uses: As a lubricant to relieve dryness of the eye. As a protectant against further irritation of the eye. For temporary relief of burning, irritation, and discomfort including exposure to wind or Dosage: To open, twist tab completely off. Instill 1 or 2 drops in the affected eye(s) as","source":{"doc":"FDA label via DailyMed: THERATEARS LUBRICANT (CARBOXYMETHYLCELLULOSE SODIUM) SOLUTION/ DROPS [MEDTECH PRODUCTS INC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=797b0394-2f0f-4733-8d20-ec5bdf3e085d"},"see_also":[]},{"id":"drug-ceftriaxone","kind":"drug","title":"ceftriaxone","text":"In the IMM kits: Rocephin (Ceftriaxone) 1 Gm: ISS 3, Orion 1. Uses: Before instituting treatment with Ceftriaxone for Injection, USP, appropriate specimens should be obtained for isolation of the causative organism and for determination of its susceptibility to the drug. Therapy may be instituted prior to obtaining results of susceptibility testing. To reduce the development of drug-resistant bacteria and maintain the effectiveness of Ceftriaxone for Injection, USP and other antibacterial drugs, Ceftriaxone for Injection, USP should be used only to treat or prevent infections that are proven or strongly suspected to be caused by susceptible bacteria. When… Contraindications: Hypersensitivity Ceftriaxone is contraindicated in patients with known hypersensitivity to ceftriaxone, any of its excipients or to any other cephalosporin. Patients with previous hypersensitivity reactions to penicillin and other beta lactam antibacterial agents may be at greater risk of hypersensitivity to ceftriaxone (see WARNINGS – Hypersensitivity ). Neonates Premature neonates: Ceftriaxone is contraindicated in premature neonates up to a postmenstrual age of 41 weeks (gestational age + chronological age). Hyperbilirubinemic neonates: Hyperbilirubinemic neonates should not be treated… Dosage: Ceftriaxone may be administered intravenously or intramuscularly. Do not use diluents containing calcium, such as Ringer’s solution or Hartmann’s solution, to reconstitute ceftriaxone vials or to further dilute a reconstituted vial for IV administration because a precipitate can form. Precipitation of ceftriaxone-calcium can also occur when ceftriaxone is mixed with calcium-containing solutions in the same IV administration line. Ceftriaxone must not be administered simultaneously with calcium‑containing IV solutions, including continuous calcium-containing infusions such as parenteral…","source":{"doc":"FDA label via DailyMed: CEFTRIAXONE INJECTION, POWDER, FOR SOLUTION CEFTRIAXONE INJECTION, POWDER, FOR SOLUTION [HIKMA PHARMACEUTICALS USA INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8351aa37-552d-471d-b293-c564dcb6ec29"},"see_also":[]},{"id":"drug-cetirizine","kind":"drug","title":"cetirizine","text":"In the IMM kits: Zyrtec (Cetirizine) 10 Mg Tablet: ISS 30. Uses: tempo
