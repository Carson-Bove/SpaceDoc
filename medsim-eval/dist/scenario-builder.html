cliff119_2023"},"summary":"Fracture - Femur encompasses any traumatic fracture of the femur, including the proximal femur and femoral neck (often referred to as \"hip\" fracture).","applicability":{"incidence_type":"EVA","segment":"EVA Surface","envs":["T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":1.22e-05,"incidence_sd":4.81e-05,"incidence_text":"Surface-Ops EVA: mean 1.22E-5 SD 4.81E-5.","treated_best":{"probability_pct":[30.0,30.0],"cp1_ti_pct":100.0,"cp1_hours":1.22,"cp2_ti_pct":18.6553,"cp2_hours":[1008.0,4368.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,56.0],"locl_pct":[0.0,8.58]},"treated_worst":{"probability_pct":[70.0,70.0],"cp1_ti_pct":100.0,"cp1_hours":2.07,"cp2_ti_pct":32.6867,"cp2_hours":[2016.0,4368.0],"cp3_ti_pct":16.1573,"rtdc_pct":[40.0,100.0],"locl_pct":[1.3,28.0]},"untreated_best":{"cp1_hours":1.22,"cp2_ti_pct":41.815,"cp2_hours":[1008.0,4368.0],"cp3_ti_pct":17.0609,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,8.58]},"untreated_worst":{"cp1_hours":2.07,"cp2_ti_pct":56.5363,"cp2_hours":[2016.0,4368.0],"cp3_ti_pct":40.5793,"rtdc_pct":[40.0,100.0],"locl_pct":[28.0,50.0]},"extraction":"automatic"}},{"cliff_id":"fracture-hand","icl":"ICL55","name":"Fracture - Hand","category":"Upper Extremity Injury","cliff":{"label":"Fracture Hand CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/fracture-hand-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Hand Fracture CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/hand-fracture-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"During nominal operations, the crew members are unlikely to generate loads similar to the athletes studied in these references. Athletes are likely to be performing more dangerous (i.e. more likely to lead to fracture) than astronauts would, so the evidence is not a perfect analog and is likely to over represent risk. Therefore, the assumptions made by the team is to use this risk assessment only for instances when crew are performing operations similar to an athlete, such as an EVA. During nominal operations, incidence of hand fracture is assumed to be 0%. The hands are used to provide stability and propulsion on microgravity the chance of injury may be greater in space flight than on the ground. (Marshburn, 2008) Spaceflight- induced bone atrophy is due to the mechanical unloading of the skeletal system and is targeted to specific regions of the skeleton. These site- specific losses occur at normally weight-bearing skeletal areas (on Earth) suggesting that the regions that experience the larger deficits in mechanical loading undergo the greater adaptation. Collectively, the average decrement of preflight areal bone mineral density (BMD) per month is 1-1.5%, although there are considerable variations of loss between different skeletal sites and between different crewmembers. In microgravity demineralization is potentiated by the poor absorption of vitamin D. The radiation shielding on ISS prevents ultraviolet conversion of 7- dehydrocholesterol in the skin to vitamin D. Vitamin D is associated with improved neuromuscular coordination. In addition, a deficiency in vitamin D could lead to mal-absorption of calcium in the intestine and poor re-absorption by the proximal tubules of the kidney. The failure to conserve calcium because of vitamin D deficiency will limit the availability of calcium to support the anabolic effects of exercise and physical activity on bone and muscles. It is noted that the hands and wrists are the primary means of ambulation on orbit.","applicability":{"incidence_type":"EVA","segment":"EVA Surface","envs":["T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":2.485e-06,"incidence_sd":9.343e-09,"incidence_text":"mean 2.485E-6 and SD 9.343E-9","treated_best":{"probability_pct":[74.0,100.0],"cp1_ti_pct":100.0,"cp1_hours":1.65,"cp2_ti_pct":5.46107,"cp2_hours":[216.0,1134.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,26.0],"cp1_ti_pct":100.0,"cp1_hours":1.81,"cp2_ti_pct":19.2931,"cp2_hours":[672.0,1344.0],"cp3_ti_pct":10.0186,"rtdc_pct":[8.0,26.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.65,"cp2_ti_pct":35.3973,"cp2_hours":[720.0,1440.0],"cp3_ti_pct":10.0186,"rtdc_pct":[0.0,3.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.81,"cp2_ti_pct":41.7087,"cp2_hours":[840.0,3696.0],"cp3_ti_pct":10.9221,"rtdc_pct":[8.0,26.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"fracture-wrist","icl":"ICL56","name":"Fracture - Wrist","category":"Upper Extremity Injury","cliff":{"label":"Fracture Wrist CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/fracture-wrist-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Wrist Fracture CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/wrist-fracture-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Wrist Fracture CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/wrist-fracture-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"The wrist is an anatomic linkage bridging the hand to the forearm. The hand relative to the forearm can flex, extend, pronate, supinate, and deviate radially and ulnarly. Malfunction of the wrist occurs when the structural alignment of the bones has changed, i.e. distal radius malunion and acute fracture of carpal bones (Steinberg, 2002). For the purposes of this CLiFF, a “Wrist Fracture” includes a fracture of the distal radius or ulna, or fracture of any of the carpal bones (scaphoid, lunate, triquetrum, trapezoid, trapezium, capitate, hamate, and pisiform). Distal radius fractures are the most common type of wrist fracture, and one of the most common fractures in adults (Baawa-Ameyaw et al, 2020). The most injured carpal bone is the scaphoid where 70% of carpal fractures occur (Steinberg, 2002). Potential mechanisms of injury for wrist fracture in space include impact to structure from an outstretched hand during intra-vehicular translation, hyperflexion or a direct blow to the wrist such as while stowing equipment, or excessive forces exerted such as doing a repair during an EVA (Scheuring, 2009). Acute fractures results in pain, tenderness, swelling and potential deformity. Crewmembers may be faced with substantial morbidity if fracture healing is delayed or results in clinically significant deformity. Worst-case fractures pose additional risks of complex regional pain syndrome, infection, and neurovascular compromise. All best-case fractures are terrestrially recommended to be treated with splinting, followed by casting. All worst-case fractures terrestrially are treated with surgical intervention. Spaceflight- induced bone atrophy is due to the mechanical unloading of the skeletal system and is targeted to specific regions of the skeleton. These site- specific losses occur at normally weight-bearing skeletal areas (on Earth) suggesting that the regions that experience the larger deficits in mechanical loading undergo the greater adaptation. In low Earth orbit operations, the degree of BMD loss in the wrist has not been substantial. Radiation increases bone resorption and outside low earth orbit; BMD may be greater. In microgravity demineralization may be potentiated by the poor absorption of vitamin D. A deficiency in vitamin D could lead to malabsorption of calcium in the intestine and poor re-absorption by the proximal tubules of the kidney. The failure to conserve calcium because of vitamin D deficiency will limit the availability of calcium to support the anabolic effects of exercise and physical activity on bone and muscles. It is noted that the hands and wrists are the primary means of ambulation on orbit. The possible effect of mineralization or de-mineralization of wrist bones is not known (Sibonga, 2008).","applicability":{"incidence_type":"EVA","segment":"EVA Surface","envs":["T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0052,"incidence_sd":0.0052,"incidence_text":"Males: mean: 0.0052, SD: 0.0052 Females: mean:0.004, SD:","treated_best":{"probability_pct":[61.0,84.0],"cp1_ti_pct":100.0,"cp1_hours":1.23,"cp2_ti_pct":5.46107,"cp2_hours":[672.0,1512.0],"cp3_ti_pct":0.0,"rtdc_pct":[3.0,6.7],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[16.0,39.0],"cp1_ti_pct":100.0,"cp1_hours":2.52,"cp2_ti_pct":19.2931,"cp2_hours":[2160.0,8760.0],"cp3_ti_pct":10.0186,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.23,"cp2_ti_pct":35.3973,"cp2_hours":[672.0,1512.0],"cp3_ti_pct":10.0186,"rtdc_pct":[3.0,6.7],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":2.52,"cp2_ti_pct":50.1063,"cp2_hours":[2160.0,8760.0],"cp3_ti_pct":27.7172,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"fracture-thoracic-lumbar-spine","icl":"ICL57","name":"Fracture- Thoracic/Lumbar Spine","category":"Musculoskeletal Conditions","cliff":{"label":"Fracture Thoracic Lumbar Spine (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/fracture-thoracic-lumbar-spine-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Lumbar Spine Fracture CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/lumbar-spine-fracture-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Thoracic/Lumbar Spine Fracture CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/thoracic-lumbar-spine-fracture-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"There is no IMM CliFF for Fracture - Thoracic Lumbar Spine. There is an IMM CliFF for Lumbar Spine Fracture. This IMM CliFF is based on a Glenn Research Center biomechanical and bone loading model that accounts for the microgravity environment of the ISS. The incidence of a lumbar spine fracture based on this model is estimated as 0.00014 events/ person-year. There have been no occurrences of thoracic or lumbar spine fractures in spaceflight to date. Therefore, terrestrial data is used to estimate incidence and outcomes for of thoracic and lumbar spine fractures for this CliFF. This may result in an overestimation of the probability of thoracic and lumbar spine fractures in spaceflight. However, the Glenn Research Center biomechanical and bone loading model and terrestrial data does not account for possible bone loss of the thoracic and lumbar spine associated with spaceflight microgravity and partial gravity environments.","applicability":{"incidence_type":"EVA","segment":"EVA Surface","envs":["T3","T5"],"timing":"any","eva":true,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":2.08e-07,"incidence_sd":1.82e-09,"incidence_text":"mean 2.08E-7 and SD 1.82E-9","treated_best":{"probability_pct":[85.0,85.0],"cp1_ti_pct":100.0,"cp1_hours":1.5,"cp2_ti_pct":5.18204,"cp2_hours":[1344.0,2016.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[15.0,15.0],"cp1_ti_pct":100.0,"cp1_hours":2.0,"cp2_ti_pct":26.3354,"cp2_hours":[2880.0,4320.0],"cp3_ti_pct":14.4567,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.5,"cp2_ti_pct":19.8379,"cp2_hours":[1344.0,2016.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":2.0,"cp2_ti_pct":54.903,"cp2_hours":[2880.0,4320.0],"cp3_ti_pct":37.3107,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"gastritis-reflux-esophagitis","icl":"ICL58","name":"Gastritis/Reflux/Esophagitis","category":"Gastrointestinal Conditions","cliff":{"label":"Gastritis/Reflux/Esophagitis CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/gastritis-reflux-esophagitis-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Gastritis/Reflux CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/gastritis-reflux-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Gastritis is a broad term that typically refers to inflammation of the esophagus, stomach, or duodenum (Azer et al. 2021; Kashiwagi 2005). Symptoms of gastritis in mild cases often include epigastric burning, abdominal discomfort, nausea, postprandial fullness, and progress to abdominal or chest pain and hematemesis in severe cases. Importantly, this CLiFF condition does not cover gastroenteritis, sepsis or shock which are covered in other CLiFF conditions. Also, this CLiFF only pertains to acute gastritis with neutrophil predominance as the likelihood of a crew member experiencing chronic gastritis (as can be seen in Crohn’s disease, Barrett’s esophagus, esophageal malignancy, chronic delayed gastric emptying/manometry disorders, functional dyspepsia or improper NSAID use) is minimal given the pre-mission medical screening (Michael et al. 2019). Given the breadth of medical complaints this condition encompasses, key-word lists were formed to differentiate between resources for the best and worst cases. Best Case Keywords: acute gastritis, gastroesophageal reflux disease (GERD), acute esophagitis, indigestion, dyspepsia, heartburn, esophageal disease, epigastralgia, digestive-system disorders (excluding gastroenteritis), gastrointestinal diseases (excluding gastroenteritis) Worst Case Keywords: peptic ulcer disease, gastric ulcer, duodenal ulcer, acute nonvariceal upper-gastrointestinal bleeding, helicobacter pylori and any keyword included above with a more prolonged course than a single incident.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.034,"incidence_sd":0.00734,"incidence_text":"mean: 0.034 SD: 0.00734","treated_best":{"probability_pct":[99.0,99.0],"cp1_ti_pct":100.0,"cp1_hours":0.47,"cp2_ti_pct":0.0,"cp2_hours":[0.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[1.0,1.0],"cp1_ti_pct":100.0,"cp1_hours":1.72,"cp2_ti_pct":15.4797,"cp2_hours":[336.0,1344.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.1,1.0],"locl_pct":[0.00021,0.021]},"untreated_best":{"cp1_hours":0.47,"cp2_ti_pct":2.97635,"cp2_hours":[0.0,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.72,"cp2_ti_pct":31.3972,"cp2_hours":[672.0,2016.0],"cp3_ti_pct":29.47,"rtdc_pct":[0.08,1.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"gastroenteritis-acute-diarrhea","icl":"ICL59","name":"Gastroenteritis/Acute Diarrhea","category":"Gastrointestinal Conditions","cliff":{"label":"Gastroenteritis Acute Diarrhea (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/gastroenteritis-acute-diarrhea-cliff-2023.pdf","list":"cliff119_2023"},"summary":"Gastroenteritis is a non-specific term for various pathologic states of the gastrointestinal tract. However, the primary manifestation is diarrhea. This is often accompanied by associated symptoms of nausea, vomiting, anorexia, abdominal pain/cramping, bloating, and bowel gas. It can be caused by a number of different etiologies ranging from reactions to medications or other chemicals/toxins or even radiation, however, gastroenteritis is typically caused by viruses (ex. rotavirus, norovirus), bacteria (ex. E. coli, Salmonella, Campylobacter, Shigella), or parasites (ex. Giardia, Cryptosporidium). These can be foodborne, waterborne, or spread from person-to-person, often through a fecal-oral route. However, the threat of many of these infections is likely low in the spaceflight environment with good hygiene and access to clean food and water. Workup of gastroenteritis in spaceflight will be limited as infectious work-up will likely not be feasible. Treatment, as explained below, will be centered around prevention and management of dehydration.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.92,"incidence_sd":0.15,"incidence_text":"mean: 0.92 per py, SD: 0.15 per py","treated_best":{"probability_pct":[93.0,93.0],"cp1_ti_pct":100.0,"cp1_hours":0.666,"cp2_ti_pct":6.657,"cp2_hours":[9.7,57.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[7.0,7.0],"cp1_ti_pct":100.0,"cp1_hours":1.25,"cp2_ti_pct":25.9633,"cp2_hours":[21.0,108.0],"cp3_ti_pct":0.0,"rtdc_pct":[2.0,3.0],"locl_pct":[0.0029,0.0032]},"untreated_best":{"cp1_hours":0.666,"cp2_ti_pct":15.4797,"cp2_hours":[27.0,71.0],"cp3_ti_pct":0.0,"rtdc_pct":[1.0,13.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.25,"cp2_ti_pct":78.9265,"cp2_hours":[36.0,108.0],"cp3_ti_pct":100.0,"rtdc_pct":[2.0,13.0],"locl_pct":[0.0032,0.0618]},"extraction":"automatic"}},{"cliff_id":"glaucoma-acute-angle-closure","icl":"ICL60","name":"Glaucoma, Acute Angle-Closure","category":"Vision Changes","cliff":{"label":"Glaucoma (Acute Angle Closure) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/glaucoma-acute-angle-closure-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Acute Angle-Closure Glaucoma CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-angle-closure-glaucoma-cliff.pdf","list":"cliff100"},"summary":"Angle closure glaucoma results from appositional or synechial narrowing of the anterior chamber angle resulting in limited aqueous outflow (Prum et al., 2016). This in turn, results in increased intraocular pressure elevation and optic nerve injury. Primary angle closure is due to pupillary block. Secondary angle closure is caused by any other disorder. There are several pathologies associated with primary angle closure: primary angle closure suspect (PACS), primary angle closure (PAC), and primary angle closure glaucoma (PACG) (Wright et al., 2016). PACG requires optic neuropathy to be present. When angle closure happens acutely, an ocular emergency occurs as vision loss can develop quickly without treatment. This CLiFF condition only covers acute angle glaucoma. Acute angle glaucoma often has a dramatic presentation with blurring of vision, painful red eye, headache, nausea, and vomiting. Most subjects who experience acute angle glaucoma do seek medical care. Gonioscopy is the gold-standard for diagnosis, however other techniques such as tonometry may be employed (Flores-Sanchez et al., 2019). The mainstay of treatment is rapidly lowering the intraocular pressure, preferably by medicinal therapies initially. However, in resistant cases, a procedural or surgical intervention may be necessary more rapidly. In cases where medical management is effective, laser peripheral iridotomy, argon laser peripheral iridoplasty, or lens extraction may be pursued the next day as an outpatient with ophthalmology.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_sd":5.871e-07,"incidence_text":"Males: 3.254E-5 and SD 5.871E-7 Females: 8.249E-5 and SD","treated_best":{"probability_pct":[88.8,88.8],"cp1_ti_pct":100.0,"cp1_hours":2.22,"cp2_ti_pct":17.8315,"cp2_hours":[0.25,24.0],"cp3_ti_pct":0.0,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[11.2,11.2],"cp1_ti_pct":100.0,"cp1_hours":2.22,"cp2_ti_pct":77.9431,"cp2_hours":[24.0,192.0],"cp3_ti_pct":66.8084,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":2.22,"cp2_ti_pct":61.241,"cp2_hours":[1.0,336.0],"cp3_ti_pct":66.8084,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":2.22,"cp2_ti_pct":83.0853,"cp2_hours":[24.0,336.0],"cp3_ti_pct":66.8084,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"gravity-well-entry-sensorimotor-neurovestibular-disturbance","icl":"ICL61","name":"Gravity Well - Entry Sensorimotor/Neurovestibular Disturbance","category":"Neurovestibular Disturbance","cliff":{"label":"Gravity Well Entry (Sensorimotor Neurovestibular Disturbance) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/gravity-well-entry-sensorimotor-neurovestibular-disturbance-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Gravity Well Entry Neurovestibular Disturbance Cliff Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/gravity-well-neurovestibular-disturbance-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Gravity well sensorimotor neurovestibular disturbances are the collection of physiologic changes during the initial postflight period when the astronaut is readapting to Earth's gravity or a partial gravity environment following adaptation to weightlessness. It is a state of diminished health in response to reacclimating from a microgravity environment, to which the astronaut has adapted to, back to a gravitational field, requiring readaptation. This includes the possibility for symptoms regarding the lunar gravitational field of 1/6th g. Symptomatic presentation is highly variable and includes vertigo as well as postural, vestibular and ocular disturbances and orientation issues. (Ortega, 2019, Clark, 2019) It is usually a self-limited condition, mild in severity for shorter missions and \"unlikely to have a significant impact on the mission.\" (Bacal, 2003)","applicability":{"incidence_type":"UNK","segment":"Gravity Well Transition","envs":["T3","T5"],"timing":"surface_arrival","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.07191,"incidence_sd":0.06703,"incidence_text":"mean 0.07191 per person and SD 0.06703","treated_best":{"probability_pct":[100.0,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.53,"cp2_ti_pct":11.6264,"cp2_hours":[24.0,192.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,0.0],"cp1_ti_pct":100.0,"cp1_hours":1.7,"cp2_ti_pct":27.9564,"cp2_hours":[0.0 gravity to the 1/6 G environment of the moon. The estimated incidence of gravity well orthostatic intolerance is based on no reported cases of orthostatic intolerance upon transition from microgravity to the 1/6 G environment of the moon among the 12 astronauts who walked on the moon.","applicability":{"incidence_type":"UNK","segment":"Gravity Well Transition","envs":["T3","T5"],"timing":"surface_arrival","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.07191,"incidence_sd":0.06703,"incidence_text":"mean 0.07191 and SD 0.06703","treated_best":{"probability_pct":[100.0,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.73,"cp2_ti_pct":19.3861,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[0.0,0.0],"cp1_ti_pct":100.0,"cp1_hours":0.78,"cp2_ti_pct":19.3861,"cp2_hours":[0.0,0.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.73,"cp2_ti_pct":19.3861,"cp2_hours":[0.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.78,"cp2_ti_pct":49.2293,"cp2_hours":[0.0,0.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"headache","icl":"ICL63","name":"Headache","category":"Headache","cliff":{"label":"Headache CLiFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/headache-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Headache (Space Adaptation) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/headache-space-adaptation-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Spaceflight Associated Headache CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/spaceflight-associated-headache-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Terrestrially tension headaches are the most frequent cause of headaches in general and the high workload of crewmembers during a mission makes tension headache a likely diagnosis for in-flight headaches after the first 5 days on orbit. (Marshburn, 2008) There have been several headache events in this category reported on orbit. Most have resolved within a couple hours, and were readily treatable with available medication. (Walton, 2010)","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":2.56,"incidence_sd":0.7432,"incidence_text":"mean 2.56 and SD 0.7432","treated_best":{"probability_pct":[99.0,99.0],"cp1_ti_pct":100.0,"cp1_hours":0.53,"cp2_ti_pct":0.0,"cp2_hours":[0.0,2.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[1.0,1.0],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":16.4895,"cp2_hours":[2.0,72.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,1.2],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.53,"cp2_ti_pct":15.3069,"cp2_hours":[0.5,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.0,"cp2_ti_pct":28.6208,"cp2_hours":[4.0,773.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,1.2],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"headache-co2-induced","icl":"ICL64","name":"Headache - Co2 Induced","category":"Headache","cliff":{"label":"Headache (CO2-Induced) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/headache-co2-induced-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Headache (CO2 Induced) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/headache-co2-induced-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Headache CO2 Induced CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/headache-co2-induced-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"A carbon dioxide induced headache results from the build up of ambient carbon dioxide. Several cases have been reported in the US space program. Ambient carbon di  one of the most common medical morbidities on Earth. Asymptomatic hemorrhoids can be diagnosed incidentally in 39% of individuals undergoing colorectal cancer screening, the prevalence of symptomatic hemorrhoids in the U.S. is 4.4% (Mott et. al., 2018, Lohsiriwat et. al. 2015, Johanson et. al., 1990). They develop when the venous drainage of the anus is altered leading to dilation of the venous plexus that creates an outgrowth of the anal mucosa from the rectal wall. Hemorrhoids can be classified as internal or external. External hemorrhoids usually require no specific treatment unless they become thrombosed. Depending upon their location and the extent of prolapse and their ability to be reduced, internal hemorrhoids can be graded on a scale from I-IV. However, while this system grades internal hemorrhoids anatomically, it falls short of grading hemorrhoids by complications such as pressure, pain, and bleeding.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.088,"incidence_sd":0.044,"incidence_text":"mean 0.088 and SD 0.044","treated_best":{"probability_pct":[95.0,95.0],"cp1_ti_pct":100.0,"cp1_hours":0.617,"cp2_ti_pct":0.172735,"cp2_hours":[72.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[5.0,5.0],"cp1_ti_pct":100.0,"cp1_hours":0.7,"cp2_ti_pct":17.114,"cp2_hours":[168.0,8760.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,1.4],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.617,"cp2_ti_pct":13.7258,"cp2_hours":[72.0,240.0],"cp3_ti_pct":0.345469,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.7,"cp2_ti_pct":31.1188,"cp2_hours":[240.0,8760.0],"cp3_ti_pct":28.0096,"rtdc_pct":[0.0,1.4],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"herpes-zoster-reactivation-shingles","icl":"ICL68","name":"Herpes Zoster Reactivation (Shingles)","category":"Infectious Disease","cliff":{"label":"Herpes Zoster Reactivation (Shingles) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/herpes-zoster-reactivation-shingles-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Herpes Zoster Reactivation (Shingles) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/herpes-zoster-reactivation-shingles-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Herpes Zoster Reactivation (Shingles) CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/hzv-reactivation-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Herpes zoster (HZV) is caused by the varicella virus which can remain latent in the dorsal root ganglia for years and then be reactivated in adults who had a primary infection (chickenpox) in their youth. It can cause a self-limited infection that, while uncomfortable, usually only causes a rash in a single dermatomal distribution. More invasive infections can result in meningoencephalitis, involvement of the auditory and visual systems, and a widely disseminated rash. Facial involvement can result in post-herpetic neuralgia that can last for months or even years. Due to the current average age of current astronauts, the timing of the Varicella vaccine creation (rolled out in the U.S. in 1995), and the extremely high incidence of prior exposure to HZ, most astronauts are at risk for HZ reactivation. While there is laboratory evidence that astronauts may be more at risk due to a compromised immune system, potentially from the stress of spaceflight and the spaceflight environment itself, there have been no reported cases of herpes zoster during spaceflight.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.03331,"incidence_sd":0.01501,"incidence_text":"mean 0.03331 and SD 0.01501","treated_best":{"probability_pct":[80.0,80.0],"cp p1_hours":0.5,"cp2_ti_pct":0.478342,"cp2_hours":[96.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.5,"cp2_ti_pct":26.0962,"cp2_hours":[240.0,1008.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"nephrolithiasis","icl":"ICL71","name":"Nephrolithiasis","category":"Urogenital Conditions","cliff":{"label":"Nephrolithiasis CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/nephrolithiasis-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Nephrolithiasis CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/nephrolithiasis-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Nephrolithiasis CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/nephrolithiasis-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Kidney stones form as a result of physicochemical or genetic derangements leading to super saturation of the urine with stone-forming salts or, less commonly, from recurrent urinary tract infection with unease-producing bacteria. Stasis in the upper urinary tract due to local anatomic anomalies may also promote or enhance stone formation in susceptible individuals. Spaceflight is associated with biochemical alterations that promote kidney stone formation. Microgravity associated bone demineralization has been shown to result in hypercalciuria, and hypocitraturia, and reductions in urinary pH. Citrate, an inhibitor of stone formation, was shown to be reduced particularly in early spaceflight. Dietary intake known to be protective of stone formation was also found to be reduced including protein, potassium phosphorus and magnesium. (Whitson, 1997); (Whitson, 1993). Hypercalciuria is a characteristic of the skeletal adaptation to space, and contributes to the increased super saturation of urine such as with calcium phosphate or calcium oxalate. However, whether a renal stone forms in supersaturated urine depends upon other risk factors. The presence of these aggregates in the renal collection or excretion system can potentially result in renal colic, hematuria, infection, and can obstruct urine flow to cause hydronephrosis (Sibonga, 2008). Factors contributing to dehydration on orbit include dehydration associated with space motion sickness in the first few days of flight, and decreased urine output due to lower oral fluid intake associated with depressed appetite, increased workload and exercise (Jones, 2008). There has been one reported episode of an inflight renal stone occurrence in a cosmonaut during a long duration mission. This episode was associated with severe pain and significantly impacted mission operations. Symptoms subsided, the stone apparently passed spontaneously over a period of days, and the mission was completed. (Barratt, 2019). There are no instances of symptomatic kidney stone formation during spaceflight among U.S. astronauts. There have been 7 cases within 12 months of landing postflight. NASA’s Glenn Research Center (GRC) prepared a Bayesian Analysis for the IMM to provide an estimate of the incidence of kidney stones among astronauts inflight (Gilkey, 2012). Future work may include updating the estimate of incidence of symptomatic inflight kidney stones based on the inclusion of more recent data and the use of inflight renal stone modeling currently under development at GRC which accounts for the biochemical alterations and environmental factors of spaceflight. Additional future work may include accounting for future medical technologies that allow for the noninvasive treatment of kidney stones inflight on the outcomes of these events.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.00396,"incidence_sd":0.00046,"incidence_text":"mean 0.00396 and SD 0.00046","treated_best":{"probability_pct":[74.0,74.0],"cp1_  cervical impingement and lumbar impingement. Best case/worst case percentages and CP2 durations based on terrestrial general population data. RTDC probabilities are based on best and worst case definitions and terrestrial general population data. LOCL probabilities are based on best case and worst case definitions.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.006646,"incidence_sd":2.223e-05,"incidence_text":"mean 6.646E-3 and SD 2.223E-5","treated_best":{"probability_pct":[54.0,74.0],"cp1_ti_pct":100.0,"cp1_hours":1.8,"cp2_ti_pct":38.67,"cp2_hours":[336.0,672.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[26.0,46.0],"cp1_ti_pct":100.0,"cp1_hours":1.9,"cp2_ti_pct":38.67,"cp2_hours":[1008.0,1344.0],"cp3_ti_pct":0.0,"rtdc_pct":[1.0,5.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.8,"cp2_ti_pct":42.52,"cp2_hours":[336.0,672.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.9,"cp2_ti_pct":44.88,"cp2_hours":[1008.0,1344.0],"cp3_ti_pct":38.7,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"otitis-externa","icl":"ICL73","name":"Otitis Externa","category":"Otolaryngological Conditions","cliff":{"label":"Otitis Externa CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/otitis-externa-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Otitis Externa CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/otitis-externa-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Otitis Externa CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/otitis-externa-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Otitis Externa (OE), also known as “swimmer’s ear”, is a common condition involving inflammation of the ear canal (Osguthorpe 2006; Schaefer 2012). Risk factors of OE include high humidity, prolonged water exposure such as swimming, warm temperatures, local trauma, and presence of foreign materials in the ear canal (Beers 2004). Most OEs are acute, often presenting as rapid onset of otalgia, itching, otorrhea, canal edema and canal erythema (Schaffer 2012). More than 98% of terrestrial acute OE cases in North America are caused by bacterial infection, with Pseudomonas aeruginosa and Staphylococcus aureus being the most common culprits (Roland 2002). Topical antimicrobials are often used as initial treatment of uncomplicated acute OE. Most patients will experience considerable improvement of symptoms after just one day of treatment. Oral analgesics such as NSAIDs and acetaminophen are also often used to control pain associated with OE (Schaeffer 2012). The chronic form of OE is defined as OE lasting more than three months (Osguthorphe 2006). Chronic OE is more likely in the setting of patients with the following comorbidities: seasonal allergies, fungal infections, chronic dermatologic conditions, or inadequately treated acute OE (Osguthorphe 2006; Schaefer 2012). On rare occasions, OE infection can invade the surrounding soft tissues and temporal bone, resulting in malignant otitis externa (Daneshrad 2002; Al Aaraj 2021). It is mostly seen in diabetic, immunocompromised, and elderly patients (Al Aaraj 2021). Malignant otitis externa is important as it is life- threatening without adequate systemic antibiotics and potentially surgical treatment (Al Aaraj 2021).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.06589,"incidence_sd":0.03826,"incidence_text":"mean 0.06589, SD 0.03826","treated_best":{"probability_pct":[98.0,98.0],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":2.80361,"cp2_hours":[24.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[2.0,2.0],"cp1_ti_pct":100.0,"cp1_hours":1.0,"cp2_ti_pct":14.6293,"cp2_hours":[336.0,672.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.5],"locl_pct":[0.0,0.095]},"untreated_best":{"cp1_hours":1.0,"cp2_ti_pct":14.5628,"cp2_hours":[24.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.0,"cp2_ti_pct":35.1847,"cp2_hours":[336.0,672.0],"cp3_ti_pct":35.1847,"rtdc_pct":[0.0,1.0],"locl_pct":[0.0,0.6]},"extraction":"automatic"}},{"cliff_id":"otitis-media","icl":"ICL74","name":"Otitis Media","category":"Otolaryngological Conditions","cliff":{"label":"Otitis Media CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/otitis-media-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Otitis Media CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/otitis-media-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Otitis Media CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/otitis-media-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Otitis Media (OM) is inflammation or infection of the middle ear. Acute otitis media (AOM) is usually a result of dense bacterial colonization at the nasopharynx and eustachian tube dysfunction that occurs during a viral upper respiratory tract infection (Schilder, 2016). In more than 50% of cases, bacteria such as Streptococcus pneumoniae, nontypeable Haemophilus influenzae can be isolated from the middle ear fluid (Jacobs, 1998). Presentations of AOM typically include recent onset ear pain and muffled or decreased hearing. An episode of upper respiratory tract infection or exacerbation of seasonal allergic rhinitis often proceeds these symptoms. Diagnosis is often made with otoscopic exams in suspected individuals. Management of AOM in adults usually involves analgesics for pain and oral antibiotics (Pichichero, 2003). The global average AOM incidence rate is estimated at 10.8 episodes/100 person-year, with more than 50% of cases occurring in children under 5 years of age (Monasta, 2012). Despite the high incidence, most cases of AOM are uncomplicated and self-resolving (Rosenfeld, 2003). Although rare, complications of AOM include extracranial infections (e.g. mastoiditis, mastoid abscess, fistulas) and intracranial infections (e.g. meningitis, brain abscess) (Dongol, 2020).","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.11,"incidence_sd":0.04954,"incidence_text":"mean 0.11 and SD 0.04954","treated_best":{"probability_pct":[98.0,98.0],"cp1_ti_pct":100.0,"cp1_hours":0.62,"cp2_ti_pct":6.77651,"cp2_hours":[24.0,312.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[2.0,2.0],"cp1_ti_pct":100.0,"cp1_hours":1.62,"cp2_ti_pct":30.295,"cp2_hours":[24.0,1008.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,2.0],"locl_pct":[0.0,0.01]},"untreated_best":{"cp1_hours":0.62,"cp2_ti_pct":27.9298,"cp2_hours":[24.0,504.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.2],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.62,"cp2_ti_pct":48.4188,"cp2_hours":[24.0,1008.0],"cp3_ti_pct":9.77943,"rtdc_pct":[0.0,50.0],"locl_pct":[0.0,1.0]},"extraction":"automatic"}},{"cliff_id":"pancreatitis-acute","icl":"ICL75","name":"Pancreatitis, Acute","category":"Gastrointestinal Conditions","cliff":{"label":"Acute Pancreatitis CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/pancreatitis-acute-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Acute Pancreatitis CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-pancreatitis-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Acute Pancreatitis CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-pancreatitis-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Acute pancreatitis is inflammation of the pancreas and can be the result of numerous etiologies. Terrestrially, gallstones, alcohol, and triglycerides are the root cause of 60-90% of all presentations of acute pancreatitis however these etiologies are evaluated in astronaut screening and thus less important for a crew member in flight. Biliary pathology is also covered in another condition and will not be discussed here. Other causes of acute pancreatitis include medications, trauma, toxins, infections, or electrolyte derangements and often fall into an \"other\" category during diagnosis. May studies do not specify these alternative causes and instead lump them together as \"idiopathic\" as a catch all term. In this review we have followed suit and will use cause of pancreatitis other than gallstone, alcohol, and triglycerides as potential causes of pancreatitis in crew members. When insulted, the pancreas will release systemic inflammatory mediators that can result in necrosis, pseudocyst formation, and multi-organ injury. The mainstays of treatment are bowel rest, pain control, and hydration. More recent management encourages a more rapid return to oral intake than prior methods which may require prolonged NPO status. Even mild disease can be extremely painful and debilitating while complicated pancreatitis carries a relatively high mortality rate even in the setting of aggressive supportive management. Multiple scoring criteria exist to help prognosticate a patient with acute pancreatitis and in general evaluate the degree of systemic inflammation and organ injury. Recurrent injury to the pancreas may result in chronic pancreatitis with recurrent flares of inflammation and pain however in this CLIFF we will focus on the acute phase of the disease.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0003536,"incidence_sd":3.361e-07,"incidence_text":"Mean 3.536E-4 and SD 3.361E-7.","treated_best":{"probability_pct":[85.0,85.0],"cp1_ti_pct":100.0,"cp1_hours":1.9,"cp2_ti_pct":15.958,"cp2_hours":[72.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[15.0,15.0],"cp1_ti_pct":100.0,"cp1_hours":1.9,"cp2_ti_pct":50.0,"cp2_hours":[168.0,600.0],"cp3_ti_pct":0.0,"rtdc_pct":[50.0,100.0],"locl_pct":[10.5,38.0]},"untreated_best":{"cp1_hours":1.9,"cp2_ti_pct":28.9264,"cp2_hours":[72.0,240.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.9,"cp2_ti_pct":100.0,"cp2_hours":[240.0,1512.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[10.5,50.0]},"extraction":"automatic"}},{"cliff_id":"pregnancy-risk-for","icl":"ICL76","name":"Pregnancy, Risk For","category":"Urogenital Conditions","cliff":{"label":"Pregnancy Risk CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/pregnancy-risk-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Risk for Pregnancy CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/risk-for-pregnancy-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Pregnancy is currently an absolute contraindication for space travel. Not only is there a paucity of animal research evaluating the risks to both the mother and the fetus in the space environment, but a pregnancy in space would have dramatic impacts on crew dynamics, medical risks, and mission outcomes for the entire crew. While the risk of becoming pregnant can be optimally mitigated with perfect use of the various contraceptive options and emergency contraception, even the best hormonal modalities and human intentions are imperfect. This CliFF specifically addresses the possibility of intravaginal intercourse between a male and female that can lead to the risk of pregnancy. It does not comment on the risks to crew dynamics or other risks of intercourse beyond the chance of pregnancy. This CLiFF is also unique in comparison to others in its definitions of treated and untreated best- and worst-case scenarios as each of these four conditions may alter the risk of becoming pregnant. If pregnancy were to occur, this is specifically addressed in CLiFF 123: Pregnancy.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"F","mapped":"automatic"},"course":{"incidence_mean":0.165,"incidence_sd":0.01067,"incidence_text":"Mean 0.165 SD 0.01067","treated_best":{"probability_pct":[90.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":0.4996,"cp2_ti_pct":0.0,"cp2_hours":[0.00917,0.735],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,10.0],"cp1_ti_pct":100.0,"cp1_hours":0.4996,"cp2_ti_pct":2.97635,"cp2_hours":[0.00917,0.735],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.4996,"cp2_ti_pct":0.0,"cp2_hours":[0.00917,0.735],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.4996,"cp2_ti_pct":6.7898,"cp2_hours":[0.00917,0.735],"cp3_ti_pct":7.97236,"rtdc_pct":[0.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"prostatitis-acute","icl":"ICL77","name":"Prostatitis, Acute","category":"Urogenital Conditions","cliff":{"label":"Acute Prostatitis ClIFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/prostatitis-acute-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Acute Prostatitis CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/acute-prostatitis-cliff.pdf","list":"cliff100"},"summary":"The incidence for this CliFF uses the same study as the IMM LD68 CliFF Acute Prostatitis. Best case/ worst case percentages, CP2 durations, and RTDC are based on different studies. No events have occurred among U.S. astronauts in spaceflight. 1 anecdotal event during spaceflight (Russian event). Therefore, terrestrial studies are used.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"M","mapped":"automatic"},"course":{"incidence_mean":0.004895,"incidence_sd":0.0001653,"incidence_text":"mean 4.895E-3 and SD 1.653E-4","treated_best":{"probability_pct":[76.0,76.0],"cp1_ti_pct":100.0,"cp1_hours":1.56,"cp2_ti_pct":4.63726,"cp2_hours":[240.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[24.0,24.0],"cp1_ti_pct":100.0,"cp1_hours":1.56,"cp2_ti_pct":15.3867,"cp2_hours":[672.0,1008.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":1.56,"cp2_ti_pct":18.27,"cp2_hours":[336.0,2160.0],"cp3_ti_pct":5.76668,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.56,"cp2_ti_pct":32.9923,"cp2_hours":[2160.0,2160.0],"cp3_ti_pct":26.92,"rtdc_pct":[100.0,100.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"rash-spaceflight-associated","icl":"ICL78","name":"Rash, Spaceflight Associated","category":"Skin Injury","cliff":{"label":"Skin Rash (Spaceflight Associated) CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/rash-spaceflight-associated-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Spaceflight Associated Rash CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/spaceflight-associated-rash-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Skin rashes or skin eruptions are a relative common occurrence during spaceflight (Barratt et al., 2019). In a review of medication records from 24 crewmembers on 20 long-duration missions over a 10-year period, “skin rash” was the fourth most frequent indication listed for medication use (Wotring, 2015). Skin eruptions can be secondary to many different etiologies including dermatitis (contact (irritant or allergic) or atopic), infection, systemic allergic reactions, or drug eruptions. This CLiFF condition only covers the former. This distinction is important as many studies in spaceflight, including the Wotring study, do not separate the underlying cause of skin eruption as it may be initially difficult to determine. Consequently, the authors of this CLiFF expect some overlap with the CLiFF entitled “Skin Infection.” As it stands, it is not clear whether spaceflight associated skin rashes are secondary to the dysregulation of crewmembers’ immune system, inadequate hygiene, or both (Crucian et al., 2016; Braun et al., 2019). Studies have demonstrated that epidermal thinning results from spaceflight (Dunn et al., 2018; Barratt et al., 2019). Further, exposure to microgravity leads to skin irritation due to vasodilation in 3D in vitro settings (Choi et al., 2021). These changes may explain the higher frequency of dermatitis than expected in a highly screened, healthy, spaceflight population.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":2.635,"incidence_sd":0.2427,"incidence_text":"mean: 2.635; SD: 0.2427","treated_best":{"probability_pct":[89.0,89.0],"cp1_ti_pct":100.0,"cp1_hours":0.87,"cp2_ti_pct":6.51076,"cp2_hours":[24.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[11.0,11.0],"cp1_ti_pct":100.0,"cp1_hours":0.94,"cp2_ti_pct":27.6641,"cp2_hours":[120.0,2016.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,1.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.87,"cp2_ti_pct":6.51076,"cp2_hours":[24.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.94,"cp2_ti_pct":30.0292,"cp2_hours":[120.0,2016.0],"cp3_ti_pct":27.6641,"rtdc_pct":[0.0,10.0],"locl_pct":[0.0,0.0]},"extraction":"automatic"}},{"cliff_id":"respiratory-failure","icl":"ICL80","name":"Respiratory Failure","category":"Respiratory System Injury","cliff":{"label":"Respiratory Failure CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/respiratory-failure-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Respiratory Failure, Acute CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/respiratory-failure-acute-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"The definition of respiratory failure is somewhat ambiguous and is used in varying ways in different literature, societies, or even providers. In more recent years, particularly in reference to the COVID pandemic, the term has generally been accepted to include patients that cannot maintain adequate oxygenation or ventilation without support. As a result, the incidence of \"respiratory failure\" has increased by up to 200% over the last few decades, primarily driven by a broadened definition. Typically this condition is broken into hypoxemic or hypercarbic depending on the underlying process. Countless conditions can result in respiratory failure and range from short and transient to chronic and life long. In spaceflight this is anticipated to be the end state of one of many medical conditions including infection, toxic exposure, or trauma. The severity of this condition is also broad, ranging from mild and requiring minimal low flow oxygen to severe and requiring endotracheal intubation and invasive mechanical ventilation.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.00189,"incidence_sd":4.188e-06,"incidence_text":"Mean 0.00189 events per person-year and SD 4.188E-6","treated_best":{"probability_pct":[65.0,65.0],"cp1_ti_pct":100.0,"cp1_hours":2.5,"cp2_ti_pct":50.0,"cp2_hours":[24.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[8.5,18.0],"locl_pct":[0.0,12.0]},"treated_worst":{"probability_pct":[35.0,35.0],"cp1_ti_pct":100.0,"cp1_hours":2.5,"cp2_ti_pct":50.0,"cp2_hours":[168.0,360.0],"cp3_ti_pct":0.0,"rtdc_pct":[100.0,100.0],"locl_pct":[23.0,36.0]},"untreated_best":{"cp1_hours":2.5,"cp2_ti_pct":100.0,"cp2_hours":[48.0,240.0],"cp3_ti_pct":100.0,"rtdc_pct":[50.0,100.0],"locl_pct":[5.0,15.0]},"untreated_worst":{"cp1_hours":2.5,"cp2_ti_pct":100.0,"cp2_hours":[240.0,1152.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[36.0,100.0]},"extraction":"automatic"}},{"cliff_id":"respiratory-tract-infection-lower","icl":"ICL81","name":"Respiratory Tract Infection - Lower","category":"Respiratory System Injury","cliff":{"label":"Lower Respiratory Tract Infection CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/respiratory-tract-infection-lower-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Lower Respiratory Tract Infection CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/lower-respiratory-tract-infection-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"This condition refers to infectious conditions affecting the lower respiratory tract. These conditions interfere with oxygenation/ventilation and can range from mild illnesses with minimal effects to prolonged illnesses that severely impair the crew member. Per the definitions the best case is a viral lower respiratory infection such as bronchitis or influenza. These are generally self limited and non fatal but in some cases, such as influenza, can lead to prolonged feelings of illness. The definitions and resourcing was done with respect to a long duration lunar DRM. Since such crews will be tested and quarantined prior to launch influenza was not considered a significant threat and most of the best case definitions will likely be mild bronchitis. resources were assigned accordingly and are described in the Capabilities and Resource Table (CRT) section below but are largely symptomatic and aim to keep the individual functioning despite the relatively mild illness The worst case includes bacterial superinfections and pneumonia. These are potential threats on any mission since the bacteria responsible are often normal flora that opportunistically infect a weakened or otherwise compromised host. These tend to be more severe and can lead to life threatening illnesses if not addressed with appropriate antibiotic treatments. The data in this CLIFF and the resourcing was arranged appropriately. Again, most healthy individuals will suffer no more than moderate illness. However, there is always a non zero chance of progression or permanent lung damage is pneumonia is not treated and antibiotics for bacterial disease drastically shorten the course of illness, reduce mortality, and reduce the risk of permanent damage. For this reason treatment focuses heavily on the use of antibiotics in all cases of pneumonia regardless of apparent initial severity.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0089,"incidence_sd":3.949e-05,"incidence_text":"mean: 0.0089 per py, SD: 3.949E-5 per py","treated_best":{"probability_pct":[90.0,99.5],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":7.66676,"cp2_hours":[72.0,264.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.3,0.9],"locl_pct":[0.0,0.0002]},"treated_worst":{"probability_pct":[0.5,10.0],"cp1_ti_pct":100.0,"cp1_hours":1.5,"cp2_ti_pct":16.4895,"cp2_hours":[120.0,264.0],"cp3_ti_pct":0.0,"rtdc_pct":[7.4,19.5],"locl_pct":[0.1,4.6]},"untreated_best":{"cp1_hours":0.5,"cp2_ti_pct":16.4895,"cp2_hours":[72.0,264.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.5,1.1],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.5,"cp2_ti_pct":50.3588,"cp2_hours":[120.0,264.0],"cp3_ti_pct":56.6038,"rtdc_pct":[100.0,100.0],"locl_pct":[27.0,50.0]},"extraction":"automatic"}},{"cliff_id":"respiratory-tract-infection-upper","icl":"ICL82","name":"Respiratory Tract Infection - Upper","category":"Respiratory System Injury","cliff":{"label":"Respiratory Tract Infection CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/respiratory-tract-infection-upper-cliff-2023.pdf","list":"cliff119_2023"},"peer_review":{"label":"Upper Respiratory Tract Infection CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/upper-respiratory-tract-infection-peer-review.pdf","list":"cliff119_2023"},"summary":"Respiratory tract infections in this CLIFF include the common cold and rhinitis (viral and bacterial). Upper respiratory tract infection (URI) represents the most common acute illness evaluated in the outpatient setting. The common cold is typically a mild, self-limited, catarrhal syndrome of the nasopharynx. URIs involve direct invasion of the mucosal lining the upper airway. Person-to-person spread of viruses accounts for most URIs. (Meneghetti, 2011). Respiratory infections have been reported in space in spite of efforts to mitigate this risk with a 7 day pre-launch quarantine. The diagnosis can be challenging since similar symptoms have been attributed to a cephalad fluid shift and the dry spacecraft cabin atmosphere. Susceptibility to infection is increased due to an impaired immune response seen in astronauts during space missions. (Marshburn, 2008)","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":2.126,"incidence_sd":0.2642,"incidence_text":"mean: 2.126 SD: 0.2642","treated_best":{"probability_pct":[98.0,98.0],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":2.80361,"cp2_hours":[24.0,504.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[2.0,2.0],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct":13.3803,"cp2_hours":[168.0,360.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_best":{"cp1_hours":0.5,"cp2_ti_pct":14.5628,"cp2_hours":[24.0,504.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.5,"cp2_ti_pct":17.4329,"cp2_hours":[153.6,408.0],"cp3_ti_pct":5.60723,"rtdc_pct":[0.067,0.1192],"locl_pct":[1.25,75.0]},"extraction":"automatic"}},{"cliff_id":"seizures","icl":"ICL83","name":"Seizures","category":"Neurological Conditions","cliff":{"label":"Seizures CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/seizures-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Seizures CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/seizures-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Seizures CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/seizures-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"A seizure is generally defined as uncontrollable electrical signals in the brain that cause sudden onset physical effects in the body, which can include unconsciousness or unresponsiveness, shaking of limbs or the entire body, behavior changes, emotional changes, and many other symptoms. There are many categories of seizures. Specifically for healthy astronauts in spaceflight, we are concerned for new onset unprovoked seizures as well as prolonged seizures, known as status epilepticus. New onset implies the astronaut has never had a seizure, nor been diagnosed with a seizure disorder. Unprovoked means that the seizure occurred spontaneously and without any identifiable inciting factor, such as meningitis, a head injury, chemical, toxic, or environmental exposure.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.00027,"incidence_sd":0.000288,"incidence_text":"Mean 2.70E-4 SD 2.88E-4","treated_best":{"probability_pct":[85.0,99.0],"cp1_ti_pct":100.0,"cp1_hours":1.75,"cp2_ti_pct":54.5575,"cp2_hours":[0.008,0.08],"cp3_ti_pct":9.11507,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[1.0,15.0],"cp1_ti_pct":100.0,"cp1_hours":1.75,"cp2_ti_pct":54.5575,"cp2_hours":[0.08,204.0], 4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.000132,"incidence_sd":2.705e-06,"incidence_text":"mean 1.32E-4 and SD 2.705E-6.","treated_best":{"probability_pct":[82.0,82.0],"cp1_ti_pct":100.0,"cp1_hours":3.5,"cp2_ti_pct":29.8033,"cp2_hours":[72.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[31.5,41.3],"locl_pct":[3.2,4.6]},"treated_worst":{"probability_pct":[18.0,18.0],"cp1_ti_pct":100.0,"cp1_hours":3.6,"cp2_ti_pct":50.0,"cp2_hours":[168.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[100.0,100.0],"locl_pct":[22.0,60.5]},"untreated_best":{"cp1_hours":3.5,"cp2_ti_pct":99.6811,"cp2_hours":[120.0,336.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[4.6,50.0]},"untreated_worst":{"cp1_hours":3.6,"cp2_ti_pct":100.0,"cp2_hours":[168.0,720.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[75.0,100.0]},"extraction":"automatic"}},{"cliff_id":"shock-cardiogenic","icl":"ICL85","name":"Shock - Cardiogenic","category":"Cardiovascular Conditions","cliff":{"label":"Cardiogenic Shock CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/shock-cardiogenic-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Cardiogenic Shock/Myocardial Infarction CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/cardiogenic-shock-secondary-to-myocardial-infarction-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Shock Cardiogenic CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/shock-cardiogenic-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Cardiogenic shock is a hemodynamically complex syndrome characterized by a low cardiac output that often culminates in multiorgan system failure and death (American College of Cardiology, 2020). Despite recent advances, clinical outcomes remain poor, with mortality rates exceeding 40%. It is characterized by inadequate tissue perfusion results from cardiac dysfunction, most commonly following acute myocardial infarction. A clinical definition of cardiogenic shock is decreased cardiac output and evidence of tissue hypoxia in the presence of adequate intravascular volume. The diagnosis of cardiogenic shock is made at the bedside by observing hypotension and clinical signs of poor tissue perfusion in the proper clinical context. These signs may include distended jugular veins, pulmonary edema, S3 gallop, oliguria, cyanosis, cool extremities, and altered mentation. The clinical manifestations of cardiogenic shock in microgravity are unknown, but we would assume that the presentation would be different without a gravity gradient to exacerbated orthostatic hypotension. Therefore the recorded blood pressure may read higher than the patient’s condition would suggest. The other signs of central and peripheral perfusion may also be altered on orbit by the cephalad fluid shift. [Marshburn, T. H. (2008). Acute care. In Principles of clinical medicine for space flight. Springer, New York, NY.].","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":4.234e-05,"incidence_sd":9.242e-06,"incidence_text":"mean 4.234E-5 and SD 9.242E-6","treated_best":{"probability_pct":[0.0,0.0],"cp1_ti_pct":100.0,"cp1_hours":0.0,"cp2_ti_pct":0.0,"cp2_hours":[0.0,0.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[100.0,100.0],"cp1_ti_pct":100.0,"cp1_hours":0.0,"cp2_ti_pct":50.0,"cp2_hours":[120.0,213.6],"cp3_ti_pct":0.0,"rtdc_pct":[100.0,100.0],"locl_pct":[29.8,47.9]},"untreated_best":{"cp1_hours":2.95,"cp2_ti_pct":0.0,"cp2_hours":[0.0,0.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":2.95,"cp2_ti_pct":100.0,"cp2_hours":[1.0,24.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[75.0,100.0]},"extraction":"automatic"}},{"cliff_id":"skin-abrasion","icl":"ICL86","name":"Skin Abrasion","category":"Skin Injury","cliff":{"label":"Skin Abrasion CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/skin-abrasion-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Skin Abrasion CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/skin-abrasion-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Skin Abrasion CliFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/skin-abrasions-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Classically, a skin abrasion is defined as the lifting or removal of the epithelium, usually by shearing forces; however, this condition can occasionally result from transverse forces (blunt injuries) (Shrestha et al., 2020). Abrasions differ from lacerations which involve the deeper layers of the skin and often the subcutaneous tissue. Most abrasions are considered minor injuries that do not require any medical treatment in most terrestrial scenarios. Rarely, depending on the surface area involved, the comorbid conditions of patient, and the surrounding environment, wound infections may develop. To prevent infections, especially in resource-poor conditions such as spaceflight, preventative care should be initiated upon occurrence. Treatment involves cleansing the wound, removing foreign bodies, potentially applying a topical medication, and covering the injury. Superficial skin trauma is common among spaceflight participants and likely more prevalent with longer missions given that epidermal thinning results from spaceflight (Dunn et al., 2018; Barratt et al., 2019). Even though the severity of this condition is considered much less that many other CLiFF pathologies, given its frequent occurrence (albeit it is still likely underreported), it has the propensity to be resource intense.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":2.056,"incidence_sd":0.171,"inci heir wounds healed more slowly while on orbit. Infections may be caused by direct effects of microgravity on immunity; atmospheric characteristics, such as moisture, airborne contaminants, condensate; or both.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.2315,"incidence_sd":0.05625,"incidence_text":"mean 0.2315 and SD 0.05625","treated_best":{"probability_pct":[88.0,88.0],"cp1_ti_pct":100.0,"cp1_hours":0.53,"cp2_ti_pct":0.0,"cp2_hours":[0.0,120.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[12.0,12.0],"cp1_ti_pct":100.0,"cp1_hours":0.91,"cp2_ti_pct":32.102,"cp2_hours":[120.0,336.0],"cp3_ti_pct":0.0,"rtdc_pct":[7.0,13.0],"locl_pct":[9.09091,9.29293]},"untreated_best":{"cp1_hours":0.53,"cp2_ti_pct":0.0,"cp2_hours":[0.0,168.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":0.91,"cp2_ti_pct":75.4983,"cp2_hours":[120.0,336.0],"cp3_ti_pct":75.4983,"rtdc_pct":[17.0,24.0],"locl_pct":[3.72,5.25]},"extraction":"automatic"}},{"cliff_id":"skin-laceration","icl":"ICL89","name":"Skin Laceration","category":"Skin Injury","cliff":{"label":"Skin Laceration CliFF (2023)","url":"https://www.nasa.gov/wp-content/uploads/2026/08/skin-laceration-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Skin Laceration CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/skin-laceration-cliff.pdf","list":"cliff100"},"summary":"The term laceration for this CLiFF includes cuts caused by sharp objects and skin tearing secondary to blunt trauma.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.944,"incidence_text":"Mean: 0.944","treated_best":{"probability_pct":[93.0,93.0],"cp1_ti_pct":100.0,"cp1_hours":0.5,"cp2_ti_pct itial management are to relieve discomfort and to restore normal fluid volume and electrolytes. Bowel compromise (ischemia, necrosis, or perforation) and a surgically correctable cause (e.g., incarcerated hernia) require immediate surgical exploration; other patients may be a candidate for nonoperative management. It is essential to identify the patient with threatening or actual strangulation of the bowel. This is suggested by a sharper, more constant and more localized pain, and the patient often has fever and signs of peritonitis (diffuse tenderness, guarding). A small bowel obstruction requires urgent care and may require medical evacuation.","applicability":{"incidence_type":"General","segment":"All","envs":["T1","T2","T3","T4","T5"],"timing":"any","eva":false,"sex":"any","mapped":"automatic"},"course":{"incidence_mean":0.0001667,"incidence_sd":0.0001175,"incidence_text":"mean 1.667E-4 and SD 1.175E-4","treated_best":{"probability_pct":[75.0,90.0],"cp1_ti_pct":100.0,"cp1_hours":1.583,"cp2_ti_pct":34.9588,"cp2_hours":[48.0,288.0],"cp3_ti_pct":0.0,"rtdc_pct":[0.0,0.0],"locl_pct":[0.0,0.0]},"treated_worst":{"probability_pct":[10.0,25.0],"cp1_ti_pct":100.0,"cp1_hours":1.583,"cp2_ti_pct":96.8775,"cp2_hours":[48.0,336.0],"cp3_ti_pct":99.8406,"rtdc_pct":[100.0,100.0],"locl_pct":[3.0,30.0]},"untreated_best":{"cp1_hours":1.583,"cp2_ti_pct":86.4204,"cp2_hours":[48.0,288.0],"cp3_ti_pct":100.0,"rtdc_pct":[20.0,60.0],"locl_pct":[0.0,0.0]},"untreated_worst":{"cp1_hours":1.583,"cp2_ti_pct":100.0,"cp2_hours":[48.0,336.0],"cp3_ti_pct":100.0,"rtdc_pct":[100.0,100.0],"locl_pct":[30.0,100.0]},"extraction":"automatic"}},{"cliff_id":"space-adaptation-back-pain","icl":"ICL91","name":"Space Adaptation - Back Pain","category":"Musculoskeletal Conditions","cliff":{"label":"Back Pain (Space Adaptation) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-back-pain-cliff-2023.pdf","list":"cliff119_2023"},"legacy":{"label":"Back Pain (Space Adaptation) CliFF","url":"https://www.nasa.gov/wp-content/uploads/2026/08/back-pain-space-adaptation-cliff.pdf","list":"cliff100"},"peer_review":{"label":"Space Adaptation Back Pain CLIFF Peer Review","url":"https://www.nasa.gov/wp-content/uploads/2026/08/space-adaptation-back-pain-cliff-peer-review.pdf","list":"cliff119_2023"},"summary":"Back pain is frequently reported by astronauts during the early phase of spaceflight as they adapt to microgravity. The nature of the pain is localized, non-radiating pain involving the paravertebral muscles. Relief is often reported with spinal flexion in the fetal position. Non-steroidal anti-inflammatory agents have also proven to be effective. This syndrome usually subsides after the first several days inflight. Although space adaptation back pain (SABP) is common among astronauts, most cases are mild, self-limited, or responsive to available treatments. The precise mechanism and spinal structures responsible for SABP are uncertain, but evidence supports the hypothesis of spinal lengthening as a causative factor. It is not possible to predict with any degree of certainty those astronauts who will develop SABP. There are also no currently accepted preventive measures for SABP. Several effective in-flight treatments are available, such as body positioning (knees bent to chest) and analgesic medications (ibuprofen and acetaminophen). To date, there has been no documented evidence of direct operational mission impact related to SABP. However, there is the potential for mission impact due to impaired crew performance related to uncontrolled pain, sleep disturbance, or the adverse side effects of medications.","applicability":{"incidence_type":"SAS","segment":"Space Adaptation","envs":["T1","T2","T4"],"timing":"early_flight","eva":false,"sex":"any","onset_hours":[1.0,120.0],"mapped":"automatic"},"course":{"incidence_mean":0.4899,"incidence_sd":0.01687,"incidence_text":"mean 0.4899 and SD 0.01687","treated_best":{"probability_pct":[86.0,86.0],"cp1_ti_pct":1
