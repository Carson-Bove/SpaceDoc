on. • Shake well immediately before use. 2.2 Dosage For the Treatment of Acute Otitis Media in Pediatric Patients (age 6 months and older) With Tympanostomy Tubes The… Contraindications: • Ciprofloxacin 0.3% and dexamethasone 0.1% otic suspension is contraindicated in patients with a history of hypersensitivity to ciprofloxacin, to other quinolones, or to any of the components in this medication. • Use of this product is contraindicated in viral infections of the external canal, including herpes simplex infections and fungal otic infections. • Ciprofloxacin 0.3% and dexamethasone 0.1% otic suspension is contraindicated in patients with a history of hypersensitivity to ciprofloxacin, to other quinolones, or to any of the components in this medication. ( 4 ) • Use of this…","source":{"doc":"FDA label via DailyMed: CIPROFLOXACIN AND DEXAMETHASONE SUSPENSION/ DROPS [ALEMBIC PHARMACEUTICALS LIMITED]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5f69b7b6-6fb8-417a-bc0e-995419b952b7"},"see_also":[]},{"id":"drug-clindamycin","kind":"drug","title":"clindamycin","text":"In the IMM kits: Cleocin (Clindamycin) 300Mg: ISS 60, Orion 21, lunar lander 14. Uses: Clindamycin hydrochloride capsules, USP are indicated in the treatment of serious infections caused by susceptible anaerobic bacteria. Clindamycin hydrochloride capsules, USP are also indicated in the treatment of serious infections due to susceptible strains of streptococci, pneumococci, and staphylococci. Its use should be reserved for penicillin-allergic patients or other patients for whom, in the judgment of the physician, a penicillin is inappropriate. Because of the risk of colitis, as described in the BOXED WARNING , before selecting clindamycin, the physician should consider the… Contraindications: Clindamycin hydrochloride capsules are contraindicated in individuals with a history of hypersensitivity to preparations containing clindamycin or Dosage: If significant diarrhea occurs during therapy, this antibacterial drug should be discontinued (See BOXED WARNING ). Administer clindamycin hydrochloride capsules with a full glass of water (6 to 8 ounces, approximately 200 to 250 mL) and at least 30 minutes before lying down to reduce the potential for esophageal irritation (See ADVERSE REACTIONS ). Adults: Serious infections —150 to 300 mg every 6 hours. More severe infections - 300 to 450 mg every 6 hours. Pediatric Patients (who are able to swallow capsules): Serious infections - 8 to 16 mg/kg/day (4 to 8 mg/lb/day) divided into three or…","source":{"doc":"FDA label via DailyMed: CLINDAMYCIN HYDROCHLORIDE CAPSULE [SUN PHARMACEUTICAL INDUSTRIES, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=1dbd8448-c1e5-46df-8060-50ef82380445"},"see_also":[]},{"id":"drug-clotrimazole","kind":"drug","title":"clotrimazole","text":"In the IMM kits: Lotrimin Af Cream (Clotrimazole) 1%, 30Gm Tube: ISS 2, Orion 2, lunar lander 1. Uses: cures most athlete's foot, jock itch and ringworm. relieves itching, burning, cracking, scaling and discomfort which accompany these Dosage: wash the affected area and dry thoroughly; apply a thin layer over affected area twice daily, morning and night. for athlete's foot and ringworm, use daily for 4 weeks; for jock itch, use daily for 2 weeks. For athlete's foot, pay special attention to spaces between the toes, wear well-fitting ventilated shoes, and change shoes and socks at least once daily. If the condition persists longer, consult a doctor. This product is not effective on the scalp or nails. Supervise children in the use of this","source":{"doc":"FDA label via DailyMed: ATHLETE S FOOT ANTIFUNGAL CREAM (CLOTRIMAZOLE) CREAM [YUNQI COSMETICS (SHENZHEN) CO., LTD]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5e3de4f6-1470-2c17-e063-6294a90a8f16"},"see_also":[]},{"id":"drug-conjugated-estrogens","kind":"drug","title":"conjugated estrogens","text":"In the IMM kits: Estrogen 1.25 Mg Tablets: ISS 100, Orion 7, lunar lander 7. Uses: PREMARIN therapy is indicated in the: Treatment of moderate to severe vasomotor symptoms due to menopause. Treatment of moderate to severe symptoms of vulvar and vaginal atrophy due to menopause. When prescribing solely for the treatment of symptoms of vulvar and vaginal atrophy, topical vaginal products should be considered. Treatment of hypoestrogenism due to hypogonadism, castration or primary ovarian failure. Treatment of breast cancer (for palliation only) in appropriately selected women and men with metastatic disease. Treatment of advanced androgen-dependent carcinoma of the prostate… Contraindications: PREMARIN therapy should not be used in individuals with any of the following conditions: Undiagnosed abnormal genital bleeding. Known, suspected, or history of cancer of the breast except in appropriately selected patients being treated for metastatic disease. Known or suspected estrogen-dependent neoplasia. Active deep vein thrombosis, pulmonary embolism or a history of these conditions. Active or recent (within the past year) arterial thromboembolic disease (for example, stroke, myocardial infarction). Liver dysfunction or disease. Known hypersensitivity to any of the ingredients in… Dosage: When estrogen is prescribed for a postmenopausal woman with a uterus, progestin should also be initiated to reduce the risk of endometrial cancer. A woman without a uterus does not need progestin. Use of estrogen, alone or in combination with a progestin, should be with the lowest effective dose and for the shortest duration consistent with treatment goals and risks for the individual woman. Patients should be reevaluated periodically as clinically appropriate (for example at 3-month to 6-month intervals) to determine if treatment is still necessary (see BOXED WARNINGS and WARNINGS ). For…","source":{"doc":"FDA label via DailyMed: PREMARIN (CONJUGATED ESTROGENS) TABLET, FILM COATED [PHYSICIANS TOTAL CARE, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=b32fcb1b-fee4-44b8-a91c-10dfdd3f84ea"},"see_also":[]},{"id":"drug-cyclopentolate","kind":"drug","title":"cyclopentolate","text":"In the IMM kits: Cyclopentolate 2% 15Ml Bottle.: ISS 1, Orion 1, lunar lander 1. Uses: : Cyclopentolate hydrochloride is used to produce mydriasis and Contraindications: : Should not be used if the patient is hypersensitive to any component of this Dosage: : Adults: Instill one or two drops of 0.5%, 1% or 2% solution in the eye which may be repeated in five to ten minutes if necessary. Complete recovery usually occurs in 24 hours. Complete recovery from mydriasis in some individuals may require several days. Children: Instill one or two drops of 0.5%, 1% or 2% solution in the eye which may be repeated five to ten minutes later by a second application of 0.5% or 1% solution if necessary. Small Infants: A single instillation of one drop of 0.5% in the eye. To minimize absorption, apply pressure over the nasolacrimal sac for two to three minutes.…","source":{"doc":"FDA label via DailyMed: CYCLOGYL (CYCLOPENTOLATE HYDROCHLORIDE) SOLUTION/ DROPS [ALCON LABORATORIES, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=1d008c76-7210-4ace-90fa-7cd22762e12e"},"see_also":[]},{"id":"drug-dexamethasone","kind":"drug","title":"dexamethasone","text":"In the IMM kits: Dexamethasone (Decadron) 10Mg Injectable: ISS 20, Orion 1. Uses: A. Intravenous or Intramuscular Administration When oral therapy is not feasible and the strength, dosage form, and route of administration of the drug reasonably lend the preparation to the treatment of the condition, those products labeled for intravenous or intramuscular use are indicated as follows: 1. Endocrine Disorders Primary or secondary adrenocortical insufficiency (hydrocortisone or cortisone is the drug of choice; synthetic analogs may be used in conjunction with mineralocorticoids where applicable; in infancy, mineralocorticoid supplementation is of particular importance). Acute… Contraindications: Systemic fungal Dosage: A. Intravenous or Intramuscular Administration The initial dosage of dexamethasone sodium phosphate injection may vary from 0.50 mg/day to 9.0 mg/day depending on the specific disease entity being treated. In situations of less severity, lower doses will generally suffice while in selected patients higher initial doses may be required. Usually the parenteral dosage ranges are one-third to one-half the oral dose given every 12 hours. However, in certain overwhelming, acute, life-threatening situations, administration of dosages exceeding the usual dosages may be justified and may be in…","source":{"doc":"FDA label via DailyMed: DEXAMETHASONE SODIUM PHOSPHATE INJECTION, SOLUTION [REMEDYREPACK INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=11f10a47-1c42-40e4-89d8-bb000fef497c"},"see_also":[]},{"id":"drug-diazepam","kind":"drug","title":"diazepam","text":"In the IMM kits: Valium (Diazepam) 5 Mg/Ml, 2 Ml Syringe: ISS 2, Orion 1. Uses: Diazepam is indicated for the management of anxiety disorders or for the short-term relief of the symptoms of anxiety. Anxiety or tension associated with the stress of everyday life usually does not require treatment with an anxiolytic. In acute alcohol withdrawal, diazepam may be useful in the symptomatic relief of acute agitation, tremor, impending or acute delirium tremens and hallucinosis. As an adjunct prior to endoscopic procedures if apprehension, anxiety or acute stress reactions are present, and to diminish the patient's recall of the procedures. (See WARNINGS .) Diazepam is a useful… Contraindications: Diazepam injection is contraindicated in patients with a known hypersensitivity to this drug; acute narrow angle glaucoma; and open angle glaucoma unless patients are receiving appropriate Dosage: Dosage should be individualized for maximum beneficial effect. The usual recommended dose in older children and adults ranges from 2 mg to 20 mg intramuscular or intravenous, depending on the indication and its severity. In some conditions, e.g., tetanus, larger doses may be required. (See dosage for specific indications.) In acute conditions the injection may be repeated within one hour although an interval of 3 to 4 hours is usually satisfactory. Lower doses (usually 2 mg to 5 mg) and slow increase in dosage should be used for elderly or debilitated patients and when other sedative drugs…","source":{"doc":"FDA label via DailyMed: DIAZEPAM INJECTION, SOLUTION [FRESENIUS KABI USA, LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ae52866a-0b9a-4baf-af1b-f9d5e00c0e56"},"see_also":[]},{"id":"drug-diphenhydramine","kind":"drug","title":"diphenhydramine","text":"In the IMM kits: Benadryl 25 Mg Capsule: ISS 60, Orion 26, lunar lander 12; Benadryl 50 Mg/Ml, 1Ml Injectable: ISS 3, Orion 1. Uses: temporarily relieves these symptoms due to hay fever or other upper respiratory allergies: runny nose itchy, watery eyes sneezing itching of the nose or throat temporarily relieves these symptoms due to the common cold: runny nose Dosage: do not take more than directed take every 4 to 6 hours, or as directed by a doctor do not take more than 6 times in 24 hours adults and children 12 years and over 1 to 2 capsules children 6 to under 12 years 1 capsule children under 6 years do not","source":{"doc":"FDA label via DailyMed: ALLERGY RELIEF (DIPHENHYDRAMINE HCL) CAPSULE [STRATEGIC SOURCING SERVICES LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5d628b09-c257-4369-8ddb-47554d83c0d8"},"see_also":[]},{"id":"drug-epinephrine","kind":"drug","title":"epinephrine","text":"In the IMM kits: Adrenaline (Epinephrine 1:10000) 10Ml: ISS 2; Epipen 1:1000: ISS 3, Orion 1. Uses: Epinephrine injection, USP auto-injectors are indicated in the emergency treatment of allergic reactions (Type I) including anaphylaxis to stinging insects (e.g., order Hymenoptera, which include bees, wasps, hornets, yellow jackets and fire ants) and biting insects (e.g., triatoma, mosquitoes), allergen immunotherapy, foods, drugs, diagnostic testing substances (e.g., radiocontrast media) and other allergens, as well as idiopathic anaphylaxis or exercise-induced anaphylaxis. Epinephrine injection, USP auto-injectors are intended for immediate administration in patients who are determined to… Dosage: Patients greater than or equal to 30 kg (66 lbs): epinephrine injection, USP auto-injector , 0.3 mg ( 2 ) Patients 15 to 30 kg (33 lbs to 66 lbs): epinephrine injection, USP auto-injector, 0.15 mg ( 2 ) Inject intramuscularly or subcutaneously into the anterolateral aspect of the thigh, through clothing if necessary. Each device is a single-dose injection. ( 2 ) 2.1 Recommended Dosage According to Patient Body Weight Patients greater than or equal to 30 kg (approximately 66 pounds or more): epinephrine injection, USP auto-injector, 0.3 mg Patients 15 kg to 30 kg (33 pounds to 66 pounds):… Contraindications: None None ( 4","source":{"doc":"FDA label via DailyMed: EPINEPHRINE INJECTION [SPORTPHARM LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a8e98483-9404-43bc-8800-b827c63c5134"},"see_also":[]},{"id":"drug-ertapenem","kind":"drug","title":"ertapenem","text":"In the IMM kits: Ertapenem 1Gm: ISS 6, Orion 6. Uses: Ertapenem for injection is a penem antibacterial indicated in adult patients and pediatric patients (3 months of age and older) for the treatment of the following moderate to severe infections caused by susceptible bacteria: Complicated intra-abdominal infections. ( 1.1 ) Complicated skin and skin structure infections, including diabetic foot infections without osteomyelitis. ( 1.2 ) Community-acquired pneumonia. ( 1.3 ) Complicated urinary tract infections including pyelonephritis. ( 1.4 ) Acute pelvic infections including postpartum endomyometritis, septic abortion and post-surgical… Dosage: Do not mix or co-infuse Ertapenem for injection with other medications. Do not use diluents containing dextrose ( α –D–glucose) . ( 2.1 ) Ertapenem for injection should be infused over 30 minutes in both the Treatment and Prophylactic regimens. ( 2.1 ) Dosing considerations should be made in adults with advanced or end-stage renal impairment and those on hemodialysis. ( 2.4 , 2.5 ) Treatment regimen: Adults and pediatric patients 13 years of age and older. The dosage should be 1 gram once a day intravenously or intramuscularly. ( 2.2 ) Patients 3 months to 12 years of age should be… Contraindications: Ertapenem for injection is contraindicated in patients with known hypersensitivity to any component of this product or to other drugs in the same class or in patients who have demonstrated anaphylactic reactions to beta-lactams. Due to the use of Lidocaine HCl as a diluent, Ertapenem for injection administered intramuscularly is contraindicated in patients with a known hypersensitivity to local anesthetics of the amide type. Known hypersensitivity to product components or anaphylactic reactions to β-lactams. ( 4 ) Due to the use of Lidocaine HCl as a diluent, Ertapenem for injection…","source":{"doc":"FDA label via DailyMed: ERTAPENEM (ERTAPENEM SODIUM) INJECTION [APOTEX CORP]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5b050245-aa03-4e28-e063-6394a90aeabc"},"see_also":[]},{"id":"drug-erythromycin","kind":"drug","title":"erythromycin","text":"In the IMM kits: Erythromycin Ointment 0.5%, 3.5 Gm Tube: ISS 1, Orion 1. Uses: : For the treatment of superficial ocular infections involving the conjunctiva and/or cornea caused by organisms susceptible to erythromycin. For prophylaxis of ophthalmia neonatorum due to N. gonorrhoeae or C. trachomatis . The effectiveness of erythromycin in the prevention of ophthalmia caused by penicillinase-producing N.gonorrhoeae is not established. For infants born to mothers with clinically apparent gonorrhea, intravenous or intramuscular injections of aqueous crystalline penicillin G should be given; a single dose of 50,000 units for term infants or 20,000 units for infants of low… Contraindications: : This drug is contraindicated in patients with a history of hypersensitivity to Dosage: : In the treatment of superficial ocular infections, a ribbon approximately 1 cm in length of Erythromycin Opthalmic Ointment should be applied directly to the infected structure up to 6 times daily, depending on the severity of the infection. For prophylaxis of neonatal gonococcal or chlamydial conjunctivitis, a ribbon of ointment approximately 1 cm in length should be instilled into each lower conjunctival sac. The ointment should not be flushed from the eye following instillation. A new tube should be used for each","source":{"doc":"FDA label via DailyMed: ERYTHROMYCIN OINTMENT [REDPHARM DRUG]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5ddd708a-9238-fea1-e063-6394a90a37b1"},"see_also":[]},{"id":"drug-eugenol","kind":"drug","title":"eugenol","text":"In the IMM kits: Dental Eugenol Anesthetic 1Ml Oral Syringe: ISS 2, Orion 2, lunar lander 1. Uses: temporarily relieves throbbing, persistent toothache due to a cavity until a dentist can be Dosage: rinse tooth with water to remove any food particles from the cavity using tweezers, immerse cotton pellet in medication to prevent dripping , squeeze gently between fingers to remove excess liquid place pellet in tooth cavity for one minute without touching surrounding tissues , then remove supervise children using this product adults and children 12 years and over: use up to 4 times daily or as directed by a dentist or doctor children under 12 years: ask a dentist or","source":{"doc":"FDA label via DailyMed: RED CROSS TOOTHACHE (EUGENOL) LIQUID [THE MENTHOLATUM COMPANY]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3537e599-65d9-48d6-8a46-d42312f71e84"},"see_also":[]},{"id":"drug-famotidine","kind":"drug","title":"famotidine","text":"The IMM kit lists ranitidine (Zantac), which was withdrawn from the US market in 2020; the label shown is famotidine, a drug of the same class. In the IMM kits: Zantac (Ranitidine) 150 Mg: ISS 60, Orion 4, lunar lander 4. Uses: Famotidine tablets are indicated in adult and pediatric patients 40 kg and greater for the treatment of: • active duodenal ulcer (DU). • active gastric ulcer (GU). • symptomatic nonerosive gastroesophageal reflux disease (GERD). • erosive esophagitis due to GERD, diagnosed by biopsy. Famotidine tablets are indicated in adults for the: • treatment of pathological hypersecretory conditions (e.g., Zollinger-Ellison syndrome, multiple endocrine neoplasias). • reduction of the risk of duodenal ulcer recurrence. Famotidine tablets are a histamine-2 (H 2 ) receptor antagonist indicated ( 1 ): In… Dosage: Indication Recommended Dosage ( 2.1 ) Adult and Pediatric Patients 40 kg and greater Active DU 40 mg once daily; or 20 mg twice daily Active Gastric Ulcer 40 mg once daily GERD 20 mg twice daily Erosive Esophagitis 20 mg twice daily; or 40 mg twice daily Adults Pathological Hypersecretory Conditions 20 mg every 6 hours; adjust to patient needs; maximum 160 mg every 6 hours Risk Reduction of DU Recurrence 20 mg once daily • See full prescribing information for complete dosing information, including dosing in renal impairment, and recommended treatment duration. ( 2.1 , 2.2 ) Administration (… Contraindications: Famotidine tablets are contraindicated in patients with a history of serious hypersensitivity reactions (e.g., anaphylaxis) to famotidine or other histamine-2 (H 2 ) receptor antagonists. History of serious hypersensitivity reactions (e.g., anaphylaxis) to famotidine or other H 2 receptor antagonists. ( 4","source":{"doc":"FDA label via DailyMed: FAMOTIDINE TABLET, FILM COATED [REDPHARM DRUG]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=55730918-d9e8-eaad-e063-6394a90aeda2"},"see_also":[]},{"id":"drug-fluconazole","kind":"drug","title":"fluconazole","text":"In the IMM kits: Diflucan (Fluconazole) 150 Mg: ISS 150, Orion 1, lunar lander 1. Uses: Fluconazole tablets are indicated for the treatment of: Vaginal candidiasis (vaginal yeast infections due to Candida ). Oropharyngeal and esophageal candidiasis. In open noncomparative studies of relatively small numbers of patients, fluconazole tablets were also effective for the treatment of Candida urinary tract infections, peritonitis, and systemic Candida infections including candidemia, disseminated candidiasis, and pneumonia. Cryptococcal meningitis . Before prescribing fluconazole tablets for AIDS patients with cryptococcal meningitis , please see CLINICAL STUDIES section. Studies… Contraindications: Fluconazole tablets are contraindicated in patients who have shown hypersensitivity to fluconazole or to any of its excipients. There is no information regarding cross-hypersensitivity between fluconazole and other azole antifungal agents. Caution should be used in prescribing fluconazole tablets to patients with hypersensitivity to other azoles. Coadministration of other drugs known to prolong the QT interval and which are metabolized via the enzyme CYP3A4 such as erythromycin, pimozide, and quinidine are contraindicated in patients receiving fluconazole. (See CLINICAL PHARMACOLOGY: Drug… Dosage: Dosage and Administration in Adults: Single Dose Vaginal candidiasis: The recommended dosage of fluconazole tablets for vaginal candidiasis is 150 mg as a single oral dose. Multiple Dose SINCE ORAL ABSORPTION IS RAPID AND ALMOST COMPLETE, THE DAILY DOSE OF FLUCONAZOLE IS THE SAME FOR ORAL AND INTRAVENOUS ADMINISTRATION. In general, a loading dose of twice the daily dose is recommended on the first day of therapy to result in plasma concentrations close to steady-state by the second day of therapy. The daily dose of fluconazole tablets for the treatment of infections other than vaginal…","source":{"doc":"FDA label via DailyMed: FLUCONAZOLE TABLET [SPORTPHARM LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=98ac5455-d26c-4780-a5a3-bf8d85917626"},"see_also":[]},{"id":"drug-fluocinonide","kind":"drug","title":"fluocinonide","text":"In the IMM kits: Fluocinonide 0.05%, 30Gm Tube: ISS 2, Orion 1, lunar lander 1. Uses: Fluocinonide Cream, USP 0.05% is indicated for the relief of the inflammatory and pruritic manifestations of corticosteroid-responsive Contraindications: Fluocinonide cream is contraindicated in those patients with a history of hypersensitivity to any of the components of the Dosage: Fluocinonide cream 0.05% is generally applied to the affected area as a thin film from two to four times daily depending on the severity of the condition. Occlusive dressings may be used for the management of psoriasis or recalcitrant conditions. If an infection develops, the use of occlusive dressings should be discontinued and appropriate antimicrobial therapy","source":{"doc":"FDA label via DailyMed: FLUOCINONIDE CREAM [PREFERRED PHARMACEUTICALS INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f5f39a14-005a-4124-9c00-500598e28012"},"see_also":[]},{"id":"drug-fluorescein","kind":"drug","title":"fluorescein","text":"In the IMM kits: Fluorescein 1Mg Strips: ISS 20, Orion 6, lunar lander 3. Uses: FLUORESCITE ® Injection 10% is indicated in diagnostic fluorescein angiography or angioscopy of the retina and iris vasculature. FLUORESCITE ® Injection 10% is indicated in diagnostic fluorescein angiography or angioscopy of the retina and iris vasculature. Dosage: Adult Dose: The normal adult dose of FLUORESCITE® Injection 10% (100 mg/mL) is 500 mg via intravenous administration. (2.1) Pediatric Dose: For children, the dose should be calculated on the basis of 7.7 mg for each kg of actual body weight (or 35 mg for each 10 pounds of body weight) up to a maximum of 500 mg via intravenous administration. (2.1) Do not mix or dilute with other solutions or drugs (2.2) 2.1 Dosing Adult Dose The normal adult dose of FLUORESCITE ® Injection 10% (100 mg/mL) is 500 mg via intravenous administration. Pediatric Dose For children, the dose should be calculated on… Contraindications: FLUORESCITE ® Injection 10% is contraindicated in patients with known hypersensitivity to fluorescein or any other ingredients in this product (4.1) 4.1 Hypersensitivity FLUORESCITE ® Injection 10% is contraindicated in patients with known hypersensitivity to fluorescein or any other ingredients in this product. Rare cases of death due to anaphylaxis have been reported. [see Warnings and Precautions (5.1) and Adverse Reactions ( 6.3 , 6.4 )]. Fluorescein can induce serious intolerance reactions. These reactions of intolerance are always unpredictable but they are more frequent in patients who…","source":{"doc":"FDA label via DailyMed: FLUORESCITE (FLUORESCEIN) INJECTION, SOLUTION [ALCON, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ebb3883c-71f6-4fd0-a7e6-0ba8e1136dd9"},"see_also":[]},{"id":"drug-fluticasone-propionate","kind":"drug","title":"fluticasone propionate","text":"In the IMM kits: Fluticasone 220Mcg, 12Gm Inhaler: ISS 2. Uses: Fluticasone Propionate HFA is indicated for the maintenance treatment of asthma as prophylactic therapy in adult and pediatric patients aged 4 years and older. Limitations of Use Fluticasone Propionate HFA is not indicated for the relief of acute bronchospasm. Fluticasone Propionate HFA is an inhaled corticosteroid indicated for: • Maintenance treatment of asthma as prophylactic therapy in adult and pediatric patients aged 4 years and older. ( 1 ) Limitations of use: Not indicated for relief of acute bronchospasm. ( 1 Dosage: • For oral inhalation only. ( 2.1 ) • Starting dosage is based on prior asthma therapy and disease severity. ( 2.2 ) • Adult and adolescent patients aged 12 years and older: 88 mcg twice daily up to a maximum dosage of 880 mcg twice daily. ( 2.2 ) • Pediatric patients aged 4 to 11 years: 88 mcg twice daily. ( 2.2 ) 2.1 Administration Information Fluticasone Propionate HFA should be administered by the orally inhaled route only. After inhalation, rinse mouth with water without swallowing to help reduce the risk of oropharyngeal candidiasis. A valved holding chamber and mask may be used to… Contraindications: Fluticasone Propionate HFA is contraindicated in the following conditions: • Primary treatment of status asthmaticus or other acute episodes of asthma where intensive measures are required [see Warnings and Precautions ( 5.2 )] . • Hypersensitivity to any of the ingredients [see Warnings and Precautions ( 5.6 ), Adverse Reactions ( 6.2 ), Description ( 11 )] . • Primary treatment of status asthmaticus or acute episodes of asthma requiring intensive measures. ( 4 ) • Hypersensitivity to any ingredient. ( 4","source":{"doc":"FDA label via DailyMed: FLUTICASONE PROPIONATE HFA (FLUTICASONE PROPIONATE) AEROSOL, METERED [PRASCO LABORATORIES]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=99249b31-bf0a-464f-8335-845279350dbe"},"see_also":[]},{"id":"drug-glycopyrrolate","kind":"drug","title":"glycopyrrolate","text":"In the IMM kits: Robinul (Glycopyrrolate) 0.2Mg/Ml: ISS 5. Uses: Glycopyrrolate Injection is an anticholinergic indicated: in anesthesia (adult and pediatric patients) for reduction of salivary, tracheobronchial, and pharyngeal secretions, reduction of volume and acidity of gastric secretions, and blockade of cardiac inhibitory reflexes during induction of anesthesia and intubation. intraoperatively to counteract surgically or drug-induced or vagal reflex-associated arrhythmias. for protection against peripheral muscarinic effects of cholinergic agents. ( 1 ) in peptic ulcer (adults) To reduce symptoms of a peptic ulcer as an adjunct to treatment of peptic… Dosage: Glycopyrrolate injection may be administered intramuscularly (IM), or intravenously (IV) without dilution, in the following indications. ( 2.1 ): Adults ( 2.2 , 2.3 , 2.4 , 2.5 ) Preanesthetic Medication: 0.004 mg/kg IM, given 30 to 60 minutes prior to the anticipated time of induction of anesthesia Intraoperative Medication: single doses of 0.1 mg IV and repeated, as needed, at intervals of 2 to 3 minutes Reversal of Neuromuscular Blockade: 0.2 mg for each 1 mg of neostigmine or 5 mg of pyridostigmine Peptic Ulcer: 0.1 mg IV or IM at 4-hour intervals, 3 or 4 times daily Pediatric patients (… Contraindications: Glycopyrrolate injection is contraindicated in: patients with known hypersensitivity to glycopyrrolate injection or any of its inactive ingredients. peptic ulcer patients with the following concurrent conditions: glaucoma; obstructive uropathy (for example, bladder neck obstruction due to prostatic hypertrophy); obstructive disease of the gastrointestinal tract (as in achalasia, pyloroduodenal stenosis, etc.); paralytic ileus, intestinal atony of the elderly or debilitated patient; unstable cardiovascular status in acute hemorrhage; severe ulcerative colitis; toxic megacolon complicating…","source":{"doc":"FDA label via DailyMed: GLYCOPYRROLATE INJECTION [MEITHEAL PHARMACEUTICALS INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=02541cfd-b209-49b9-a73f-13ef18dce06d"},"see_also":[]},{"id":"drug-hydrocodone-bitartrate-and-acetaminophen","kind":"drug","title":"hydrocodone bitartrate and acetaminophen","text":"In the IMM kits: Vicodin Hp (Hydrocodone/ Acetaminophen Hp) 10 Mg/660 Mg: ISS 30, Orion 36, lunar lander 6. Uses: Hydrocodone Bitartrate and Acetaminophen Tablets are indicated for the management of pain severe enough to require an opioid analgesic and for which alternative treatments are inadequate. Limitations of Use • Because of the risks of addiction, abuse, misuse, overdose, and death, which can occur at any dosage or duration, and persist over the course of therapy [see WARNINGS ], reserve opioid analgesics, including Hydrocodone Bitartrate and Acetaminophen Tablets, for use in patients for whom alternative treatment options are ineffective, not tolerated, or would be otherwise inadequate to… Contraindications: Hydrocodone Bitartrate and Acetaminophen Tablets are contraindicated in patients with: • Significant respiratory depression [see WARNINGS ] • Acute or severe bronchial asthma in an unmonitored setting or in the absence of resuscitative equipment [see WARNINGS ] • Known or suspected gastrointestinal obstruction, including paralytic ileus [see WARNINGS ] • Hypersensitivity to hydrocodone or acetaminophen (e.g., anaphylaxis) [see WARNINGS , ADVERSE REACTIONS Dosage: Important Dosage and Administration Instructions Hydrocodone Bitartrate and Acetaminophen Tablets should be prescribed only by healthcare professionals who are knowledgeable about the use of opioids and how to mitigate the associated risks. Use the lowest effective dosage for the shortest duration of time consistent with individual patient treatment goals [see WARNINGS ]. Because the risk of overdose increases as opioid doses increase, reserve titration to higher doses of Hydrocodone Bitartrate and Acetaminophen Tablets for patients in whom lower doses are insufficiently effective and in whom…","source":{"doc":"FDA label via DailyMed: HYDROCODONE BITARTRATE AND ACETAMINOPHEN TABLET [GRANULES PHARMACEUTICALS INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=136bbd47-7a54-493f-9158-a84d39221d6c"},"see_also":[]},{"id":"drug-hydromorphone","kind":"drug","title":"hydromorphone","text":"In the IMM kits: Dilaudid (Hydromorphone) 2Mg/Ml, 1Ml Syringe: ISS 18, Orion 6. Uses: DILAUDID INJECTION is indicated for the management of pain severe enough to require an opioid analgesic and for which alternate treatments are inadequate. Limitations of Use: • Because of the risks of addiction, abuse, misuse, overdose, and death, which can occur at any dosage or duration, and persist over the course of therapy [see Warnings and Precautions ( 5.2 )] , reserve opioid analgesics, including DILAUDID INJECTION for use in patients for whom alternative treatment options are ineffective, not tolerated, or would be otherwise inadequate to provide sufficient management of pain.… Dosage: • DILAUDID INJECTION should be prescribed only by healthcare professionals who are knowledgeable about the use of opioids and how to mitigate the associated risks. ( 2.1 ) • Use the lowest effective dosage for the shortest duration of time consistent with individual patient treatment goals. Reserve titration to higher doses of Hydromorphone Hydrochloride Injection for patients in whom lower doses are insufficiently effective and in whom the expected benefits of using a higher dose opioid clearly outweigh the substantial risks. ( 2.1 , 5 ) • Many acute pain conditions (e.g., the pain that… Contraindications: DILAUDID INJECTION is contraindicated in patients with: • Significant respiratory depression [see Warnings and Precautions ( 5.2 )] • Acute or severe bronchial asthma in an unmonitored setting or in the absence of resuscitative equipment [see Warnings and Precautions ( 5.6 )] • Known or suspected gastrointestinal obstruction, including paralytic ileus [see Warnings and Precautions ( 5.10 )] • Hypersensitivity to hydromorphone, hydromorphone salts, any other components of the product, or sulfite containing medications (e.g., anaphylaxis) [see Warnings and Precautions ( 5.14 )] • Significant…","source":{"doc":"FDA label via DailyMed: DILAUDID (HYDROMORPHONE HYDROCHLORIDE) INJECTION, SOLUTION [FRESENIUS KABI USA, LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=9eebd88a-5632-460f-b7b6-26c8a180540d"},"see_also":[]},{"id":"drug-ibuprofen","kind":"drug","title":"ibuprofen","text":"In the IMM kits: Motrin (Ibuprofen) 400Mg: ISS 500, Orion 55, lunar lander 15. Uses: Carefully consider the potential benefits and risks of Ibuprofen tablets and other treatment options before deciding to use ibuprofen. Use the lowest effective dose for the shortest duration consistent with individual patient treatment goals [see WARNINGS ]. Ibuprofen tablets are indicated for relief of the signs and symptoms of rheumatoid arthritis and osteoarthritis. Ibuprofen tablets are indicated for relief of mild to moderate pain. Ibuprofen tablets are also indicated for the treatment of primary dysmenorrhea. Controlled clinical trials to establish the safety and effectiveness of… Contraindications: Ibuprofen tablets are contraindicated in patients with known hypersensitivity to ibuprofen. Ibuprofen tablets should not be given to patients who have experienced asthma, urticaria, or allergic-type reactions after taking aspirin or other NSAIDs. Severe, rarely fatal, anaphylactic-like reactions to NSAIDs have been reported in such patients [see WARNINGS, Anaphylactoid Reactions , and PRECAUTIONS, Preexisting Asthma ]. Ibuprofen tablets are contraindicated in the setting of coronary artery bypass graft (CABG) surgery [see WARNINGS Dosage: Carefully consider the potential benefits and risks of Ibuprofen Tablets, USP and other treatment options before deciding to use Ibuprofen Tablets, USP. Use the lowest effective dose for the shortest duration consistent with individual patient treatment goals [see WARNINGS ]. After observing the response to initial therapy with Ibuprofen Tablets, USP, the dose and frequency should be adjusted to suit an individual patient’s needs. Do not exceed 3200 mg total daily dose. If gastrointestinal complaints occur, administer Ibuprofen tablets with meals or milk. Rheumatoid arthritis and…","source":{"doc":"FDA label via DailyMed: IBUPROFEN TABLET, FILM COATED [PD-RX PHARMACEUTICALS, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=0fa4cd66-66ad-4ec9-b38c-6b5840df39df"},"see_also":[]},{"id":"drug-ketamine","kind":"drug","title":"ketamine","text":"In the IMM kits: Ketamine 50 Mg/Ml, 10 Ml Multi Dose Vial: ISS 4, Orion 1. Uses: Ketamine hydrochloride injection is indicated: as the sole anesthetic agent for diagnostic and surgical procedures that do not require skeletal muscle relaxation. for the induction of anesthesia prior to the administration of other general anesthetic agents. as a supplement to other anesthetic agents. Ketamine hydrochloride is a general anesthetic indicated: as the sole anesthetic agent for diagnostic and surgical procedures that do not require skeletal muscle relaxation ( 1 ) for the induction of anesthesia prior to the administration of other general anesthetic agents ( 1 ) as a supplement… Dosage: See Full Prescribing Information for important dosage and administration instructions. ( 2 ) Induction of anesthesia: -- Intravenous route : Initially, 1 to 4.5 mg/kg administered slowly (over a period of 60 seconds). Alternatively, administer a dose of 1 to 2 mg/kg at a rate of 0.5 mg/kg/min. ( 2.2 ) -- Intramuscular route : Initially, 6.5 to 13 mg/kg. ( 2.2 ) Maintenance of anesthesia: Increments of one-half to the full induction dose may be repeated as needed ( 2.2 ). Adjust the dose according to the patient's anesthetic needs and whether an additional anesthetic agent is employed. ( 2.2 )… Contraindications: Ketamine hydrochloride is contraindicated in patients for whom a significant elevation of blood pressure would constitute a serious hazard [see Warnings and Precautions (5.1) ]. Ketamine hydrochloride is contraindicated in patients with known hypersensitivity to ketamine or to any excipient [see Adverse Reactions (6) ] . In patients for whom a significant elevation of blood pressure would be a serious hazard ( 4 ). Known hypersensitivity to ketamine or to any excipient ( 4","source":{"doc":"FDA label via DailyMed: KETAMINE HYDROCHLORIDE INJECTION [EUGIA US LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f8b01c77-620d-4734-a771-b8524b65bcca"},"see_also":[]},{"id":"drug-ketorolac","kind":"drug","title":"ketorolac","text":"In the IMM kits: Toradol (Ketorolac) 30Mg/Ml, 2Ml Single Dose Vial: ISS 3, Orion 4, lunar lander 1. Uses: Carefully consider the potential benefits and risks of ketorolac tromethamine and other treatment options before deciding to use ketorolac. Use the lowest effective dose for the shortest duration consistent with individual patient treatment goals (see WARNINGS ). Acute Pain in Adult Patients Ketorolac tromethamine is indicated for the short-term (≤5 days) management of moderately severe acute pain that requires analgesia at the opioid level, usually in a postoperative setting. Therapy should always be initiated with intravenous or intramuscular dosing of ketorolac tromethamine, and oral… Contraindications: (see also Boxed WARNING ) Ketorolac Tromethamine is contraindicated in patients with previously demonstrated hypersensitivity to ketorolac tromethamine. Ketorolac tromethamine is contraindicated in patients with active peptic ulcer disease, in patients with recent gastrointestinal bleeding or perforation and in patients with a history of peptic ulcer disease or gastrointestinal bleeding. Ketorolac tromethamine should not be given to patients who have experienced asthma, urticaria, or allergic-type reactions after taking aspirin or other NSAIDs. Severe, rarely fatal, anaphylactic-like… Dosage: Carefully consider the potential benefits and risks of ketorolac tromethamine and other treatment options before deciding to use ketorolac tromethamine. Use the lowest effective dose for the shortest duration consistent with individual patient treatment goals. In adults, the combined duration of use of intravenous or intramuscular dosing of ketorolac tromethamine and oral ketorolac tromethamine is not to exceed 5 days. In adults, the use of oral ketorolac tromethamine is only indicated as continuation therapy to intravenous or intramuscular dosing of ketorolac tromethamine. See package insert…","source":{"doc":"FDA label via DailyMed: KETOROLAC TROMETHAMINE INJECTION, SOLUTION KETROLAC TROMETHAMINE (KETOROLAC TROMETHAMINE) INJECTION, SOLUTION [ANTHEA PHARMA PRIVATE LIMITED]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=7a7c8579-d423-4699-9435-69c4d127c654"},"see_also":[]},{"id":"drug-levofloxacin","kind":"drug","title":"levofloxacin","text":"In the IMM kits: Levaquin (Levofloxacin) 500Mg: ISS 30. Uses: Levofloxacin tablets are a fluoroquinolone antibacterial indicated in adults (18 years of age and older) with infections caused by designated, susceptible bacteria and in pediatric patients where indicated ( 1 , 12.4 ). Pneumonia: Nosocomial ( 1.1 ) and Community Acquired ( 1.2, 1.3 ) Skin and Skin Structure Infections (SSSI): Complicated ( 1.4 ) and Uncomplicated ( 1.5 ) Chronic bacterial prostatitis ( 1.6 ) Inhalational Anthrax, Post-Exposure in adult and pediatric patients ( 1.7 ) Plague in adult and pediatric patients ( 1.8 ) Urinary Tract Infections (UTI): Complicated ( 1.9 , 1.10 ) and… Dosage: Administer levofloxacin tablets to pediatric patients weighing 30 kg and greater only (2.1 , 2.2 ). Levofloxacin tablets cannot be administered to pediatric patients who weigh less than 30 kg because of the limitations of the available strengths. Alternative formulations of levofloxacin may be considered for pediatric patients who weigh less than 30 kg (2.2 ). Dosage in Adult and Pediatric Patients with Creatinine Clearance greater than or equal to 50 mL/minute (2.1 . 2.2 ) Type of Infection Dose Every 24 hours Duration (days) Nosocomial Pneumonia (1.1) 750 mg 7 to 14 Community Acquired… Contraindications: Levofloxacin tablets are contraindicated in persons with known hypersensitivity to levofloxacin, or other quinolone antibacterials [see Warnings and Precautions (5.3) ]. Known hypersensitivity to levofloxacin tablets or other quinolones (4 ,","source":{"doc":"FDA label via DailyMed: LEVOFLOXACIN TABLET, FILM COATED [PD-RX PHARMACEUTICALS, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=b8defac4-9deb-433b-928e-0ef4ee0123a2"},"see_also":[]},{"id":"drug-lidocaine","kind":"drug","title":"lidocaine","text":"In the IMM kits: Lidocaine (Xylocaine) Cardiac 2% (20Mg/Ml) 5Ml Syringe: ISS 2; Lidocaine (Xylocaine) Plain 1%, 10Ml Multi Dose Vial: ISS 3, Orion 1; Lidocaine Jelly 2% 30Ml Tube: ISS 3, Orion 2, lunar lander 1. Uses: Lidocaine Hydrochloride Injection is indicated in adult and pediatric patients for the production of local or regional anesthesia or analgesia for surgery, dental, and oral surgery procedures, diagnostic and therapeutic procedures, and for obstetrical procedures. Specific concentrations and presentations of Lidocaine Hydrochloride Injection is recommended for each type of block indicated to produce local or regional anesthesia or analgesia [see Dosage and Administration (2.2) ]. Lidocaine Hydrochloride Injection contains lidocaine, an amide local anesthetic is indicated in adult and pediatric… Dosage: See Full Prescribing Information for recommended dosages and administration information for adult and pediatric patients 2.1 Important Dosage and Administration Information Lidocaine Hydrochloride Injection is not recommended for intrathecal use. Avoid use of Lidocaine Hydrochloride Injection solutions containing antimicrobial preservatives (i.e., multiple-dose vials) for epidural or caudal anesthesia [see Warnings and Precautions (5.3) ]. Discard unused portions of solution not containing preservatives, i.e., those supplied in single-dose vials, following initial use. Visually inspect this… Contraindications: Lidocaine Hydrochloride Injection is contraindicated in patients with a known hypersensitivity to lidocaine or to any local anesthetics of the amide type or to other components of Lidocaine Hydrochloride Injection. Known hypersensitivity to any local anesthetic agent of the amide-type or to other components of Lidocaine Hydrochloride","source":{"doc":"FDA label via DailyMed: LIDOCAINE (LIDOCAINE HYDROCHLORIDE) INJECTION, SOLUTION [A-S MEDICATION SOLUTIONS]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3b0282a6-9bfd-4052-b69c-2c68d488d009"},"see_also":[]},{"id":"drug-lidocaine-and-epinephrine","kind":"drug","title":"lidocaine and epinephrine","text":"In the IMM kits: Lidocaine W/ Epinephrine (Xylocaine) 2 %, 2-Ml Units 1:100,000 Epi, 20 Ml. Multi Dose Vials.: ISS 2, Orion 1. Uses: Lidocaine and Epinephrine Injection, USP is indicated for the production of local anesthesia for dental procedures by nerve block or infiltration techniques. Only accepted procedures for these techniques as described in standard textbooks are Contraindications: Lidocaine and Epinephrine Injections is contraindicated in patients with a known history of hypersensitivity to local anesthetics of the amide type or to any components of the injectable Dosage: The dosage of Lidocaine and Epinephrine Injections, USP depends on the physical status of the patient, the area of the oral cavity to be anesthetized, the vascularity of the oral tissues, and the technique of anesthesia used. The least volume of solution that results in effective local anesthesia should be administered; time should be allowed between injections to observe the patient for manifestations of an adverse reaction. For specific techniques and procedures of a local anesthesia in the oral cavity, refer to standard textbooks. For most routine dental procedures, Lidocaine and…","source":{"doc":"FDA label via DailyMed: LIDOCAINE (LIDOCAINE HYDROCHLORIDE AND EPINEPHRINE BITARTRATE) INJECTION, SOLUTION [SAFCO DENTAL SUPPLY CO]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=6721c3ab-c37f-4504-aebc-0103c56ed567"},"see_also":[]},{"id":"drug-loperamide","kind":"drug","title":"loperamide","text":"In the IMM kits: Imodium (Loperamide Hcl) 2 Mg Tablet: ISS 40, Orion 24, lunar lander 8. Uses: controls symptoms of diarrhea, including Travelers' Dosage: drink plenty of clear fluids to help prevent dehydration caused by diarrhea find right dose on chart. If possible, use weight to dose; otherwise, use age. adults and children 12 years and over 2 caplets after the first loose stool; 1 caplet after each subsequent loose stool; but no more than 4 caplets in 24 hours children 9-11 years (60-95 lbs) 1 caplet after the first loose stool; 1/2 caplet after each subsequent loose stool; but no more than 3 caplets in 24 hours children 6-8 years (48-59 lbs) 1 caplet after the first loose stool; 1/2 caplet after each subsequent loose stool; but no more…","source":{"doc":"FDA label via DailyMed: ANTI-DIARRHEAL (LOPERAMIDE HCL) TABLET [BETTER LIVING BRANDS, LLC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8d3ccda2-3886-4ff7-ad10-6440fc4da6bf"},"see_also":[]},{"id":"drug-loratadine","kind":"drug","title":"loratadine","text":"In the IMM kits: Claritin (Loratadine)10Mg Tablet: ISS 75. Uses: temporarily relieves these symptoms due to hay fever or other upper respiratory allergies: • runny nose • itchy, watery eyes • sneezing • itching of the nose or Dosage: adults and children 6 years and over 1 tablet daily; not more than 1 tablet in 24 hours children under 6 years of age ask a doctor consumers with liver or kidney disease ask a","source":{"doc":"FDA label via DailyMed: EQUALINE ALLERGY RELIEF (LORATADINE) TABLET [UNITED NATURAL FOODS, INC. DBA UNFI]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=232053f0-737b-46b0-959f-9edb26d82cbf"},"see_also":[]},{"id":"drug-lorazepam","kind":"drug","title":"lorazepam","text":"In the IMM kits: Ativan (Lorazepam) 1 Mg Tablet: ISS 60, Orion 42, lunar lander 6. Uses: Lorazepam is indicated for the management of anxiety disorders or for the short-term relief of the symptoms of anxiety or anxiety associated with depressive symptoms. Anxiety or tension associated with the stress of everyday life usually does not require treatment with an anxiolytic. The effectiveness of lorazepam in long-term use, that is, more than 4 months, has not been assessed by systematic clinical studies. The physician should periodically reassess the usefulness of the drug for the individual Contraindications: Lorazepam is contraindicated in patients with: hypersensitivity to benzodiazepines or to any components of the formulation acute narrow-angle Dosage: Lorazepam is administered orally. For optimal results, dose, frequency of administration, and duration of therapy should be individualized according to patient response. To facilitate this, 0.5 mg, 1 mg, and 2 mg tablets are available. The usual range is 2 to 6 mg/day given in divided doses, the largest dose being taken before bedtime, but the daily dosage may vary from 1 to 10 mg/day. For anxiety, most patients require an initial dose of 2 to 3 mg/day given two times a day or three times a day. For insomnia due to anxiety or transient situational stress, a single daily dose of 2 to 4 mg may…","source":{"doc":"FDA label via DailyMed: LORAZEPAM TABLET [PD-RX PHARMACEUTICALS, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=0681c8db-ff09-4258-a5e0-76a26b0ea0af"},"see_also":[]},{"id":"drug-meclizine","kind":"drug","title":"meclizine","text":"In the IMM kits: Antivert (Meclizine) 25 Mg: ISS 20. Uses: Meclizine hydrochloride tablets are indicated for the treatment of vertigo associated with diseases affecting the vestibular system in adults. Meclizine hydrochloride tablets are indicated for the treatment of vertigo associated with diseases affecting the vestibular system in adults ( 1 Dosage: Recommended dosage: 25 mg to 100 mg daily, in divided doses ( 2.1 ). Tablets: Swallow whole ( 2.2 ). 2.1 Recommended Dosage The recommended dosage is 25 mg to 100 mg daily administered orally, in divided doses, depending upon clinical response. 2.2 Administration Instructions Tablets: Meclizine hydrochloride tablets must be swallowed Contraindications: Meclizine hydrochloride tablets are contraindicated in patients with a hypersensitivity to meclizine or any of the inactive ingredients [see Adverse Reactions (6) and Description (11) ]. Meclizine hydrochloride tablets are contraindicated in patients with hypersensitivity to meclizine or any of the inactive ingredients ( 4","source":{"doc":"FDA label via DailyMed: MECLIZINE HYDROCHLORIDE (MECLIZINE) TABLET [ST. MARY'S MEDICAL PARK PHARMACY]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5d2ff762-041d-74ed-e063-6394a90ac588"},"see_also":[]},{"id":"drug-metoprolol-tartrate","kind":"drug","title":"metoprolol tartrate","text":"In the IMM kits: Lopressor (Metoprolol) 50 Mg: ISS 100, Orion 62. Uses: Metoprolol tartrate tablets are a beta-adrenergic blocker indicated for the treatment of: Hypertension, to lower blood pressure. Lowering blood pressure reduces the risk of fatal and non-fatal cardiovascular events, primarily strokes and myocardial infarctions. ( 1.1 ) Angina Pectoris. ( 1.2 ) Myocardial Infarction, to reduce the risk of cardiovascular mortality when used in conjunction with intravenous metoprolol therapy in patients with definite or suspected acute myocardial infarction in hemodynamically stable patients. ( 1.3 ) 1.1 Hypertension Metoprolol tartrate tablets are indicated for… Dosage: Administer once daily with food or after a meal. Titrate at weekly or longer intervals as needed and tolerated. ( 2 ) Hypertension: Recommended starting dosage is 100 mg daily, in single or divided doses. ( 2.1 ) Angina Pectoris: Recommended starting dosage is 100 mg daily, given as two divided doses. ( 2.2 ) Myocardial Infarction: The starting dosage depends upon tolerance of intravenous metoprolol, see full prescribing information. ( 2.3 ) 2.1 Hypertension Individualize the dosage of metoprolol tartrate tablets. Metoprolol tartrate tablets should be taken with or immediately following… Contraindications: Metoprolol tartrate tablets are contraindicated in severe bradycardia, second- or third-degree heart block, cardiogenic shock, systolic blood pressure <100, decompensated heart failure, sick sinus syndrome (unless a permanent pacemaker is in place), and in patients who are hypersensitive to any component of this product. Known hypersensitivity to product components. ( 4 ) Severe bradycardia: Greater than first degree heart block, or sick sinus syndrome without a pacemaker. ( 4 ) Cardiogenic shock or decompensated heart failure. ( 4","source":{"doc":"FDA label via DailyMed: METOPROLOL TARTRATE TABLET, FILM COATED [PD-RX PHARMACEUTICALS, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=39d822df-0fa4-4f06-a6f1-d313824c62df"},"see_also":[]},{"id":"drug-metronidazole","kind":"drug","title":"metronidazole","text":"In the IMM kits: Flagyl (Metronidazole) 500Mg: ISS 60, Orion 30, lunar lander 21. Uses: Symptomatic Trichomoniasis. Metronidazole tablets, USP are indicated for the treatment of T. vaginalis infection in females and males when the presence of the trichomonad has been confirmed by appropriate laboratory procedures (wet smears and/or cultures). Asymptomatic Trichomoniasis. Metronidazole tablets, USP are indicated in the treatment of asymptomatic T. vaginalis infection in females when the organism is associated with endocervicitis, cervicitis, or cervical erosion. Since there is evidence that presence of the trichomonad can interfere with accurate assessment of abnormal cytological… Contraindications: Hypersensitivity Metronidazole tablets are contraindicated in patients with a prior history of hypersensitivity to metronidazole or other nitroimidazole derivatives. In patients with trichomoniasis, metronidazole tablets are contraindicated during the first trimester of pregnancy (see PRECAUTIONS ). Psychotic Reaction with Disulfiram Use of oral metronidazole is associated with psychotic reactions in alcoholic patients who were using disulfiram concurrently. Do not administer metronidazole to patients who have taken disulfiram within the last two weeks (see PRECAUTIONS, Drug Interactions ).… Dosage: Trichomoniasis In the Female: One-day treatment − two grams of metronidazole tablets, given either as a single dose or in two divided doses of one gram each, given in the same day. Seven-day course of treatment − 250 mg three times daily for seven consecutive days. There is some indication from controlled comparative studies that cure rates as determined by vaginal smears and signs and symptoms, may be higher after a seven-day course of treatment than after a one-day treatment regimen. The dosage regimen should be individualized. Single-dose treatment can assure compliance, especially if…","source":{"doc":"FDA label via DailyMed: METRONIDAZOLE TABLET [PD-RX PHARMACEUTICALS, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8f1de4ca-a005-4ca9-a43a-380429c80d6f"},"see_also":[]},{"id":"drug-mineral-oil-and-white-petrolatum","kind":"drug","title":"mineral oil and white petrolatum","text":"In the IMM kits: Refresh Eye Ointment (Petrolatum White And Mineral Oil) 42.5%; 57.3%, 3.5Gm: ISS 4. Uses: for the temporary relief of burning and irritation due to dryness of the eye for use as a lubricant to prevent further irritation or to relieve dryness of the Dosage: Pull down the lower lid of the affected eye and apply a small amount (one-fourth inch) of ointment to the inside of the","source":{"doc":"FDA label via DailyMed: SYSTANE NIGHTTIME (MINERAL OIL AND WHITE PETROLATUM) OINTMENT [ALCON LABORATORIES, INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=4689c59c-5721-3f91-6c85-e41501998fd0"},"see_also":[]},{"id":"drug-modafinil","kind":"drug","title":"modafinil","text":"In the IMM kits: Provigil (Modafinil) 200 Mg Tablets: ISS 30. Uses: Modafinil tablets are indicated to improve wakefulness in adult patients with excessive sleepiness associated with narcolepsy, obstructive sleep apnea (OSA), or shift work disorder (SWD). Limitations of Use In OSA, modafinil tablets are indicated to treat excessive sleepiness and not as treatment for the underlying obstruction. If continuous positive airway pressure (CPAP) is the treatment of choice for a patient, a maximal effort to treat with CPAP for an adequate period of time should be made prior to initiating and during treatment with modafinil tablets for excessive sleepiness. Modafinil… Dosage: The recommended dosage of modafinil tablets for each indication is as follows: Narcolepsy or OSA: 200 mg once a day in the morning. (2.1) SWD: 200 mg once a day, taken approximately one hour prior to start of the work shift. (2.2) Severe Hepatic Impairment: reduce dose to half the recommended dose. (2.3 , 12.3) Geriatric Patients: consider lower dose. (2.4 , 12.3) 2.1 Dosage in Narcolepsy and Obstructive Sleep Apnea (OSA) The recommended dosage of modafinil tablets for patients with narcolepsy or OSA is 200 mg taken orally once a day as a single dose in the morning. Doses up to 400 mg/day,… Contraindications: Modafinil tablets are contraindicated in patients with known hypersensitivity to modafinil or armodafinil or its inactive ingredients [see Warnings and Precautions (5.1 , 5.2 , 5.3) ] . Modafinil tablets are contraindicated in patients with known hypersensitivity to modafinil or armodafinil.","source":{"doc":"FDA label via DailyMed: MODAFINIL TABLET [ASCLEMED USA INC.]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=bfe1b1b7-52ec-41b3-94d6-ac56036eea80"},"see_also":[]},{"id":"drug-moxifloxacin","kind":"drug","title":"moxifloxacin","text":"In the IMM kits: Moxifloxacin (Avelox) 0.5%, 3Ml Bottle: ISS 4, Orion 1, lunar lander 1. Uses: Moxifloxacin ophthalmic solution is indicated for the treatment of bacterial conjunctivitis caused by susceptible strains of the following organisms: Corynebacterium species* Micrococcus luteus* Staphylococcus aureus Staphylococcus epidermidis Staphylococcus haemolyticus Staphylococcus hominis Staphylococcus warneri* Streptococcus pneumoniae Streptococcus viridans group Acinetobacter lwoffii* Haemophilus influenza Haemophilus parainfluenzae* Chlamydia trachomatis *Efficacy for this organism was studied in fewer than 10 infections. Moxifloxacin ophthalmic solution is a topical fluoroquinolone… Dosage: Instill one drop in the affected eye 3 times a day for 7 days. Moxifloxacin ophthalmic solution is for topical ophthalmic use. Instill one drop in the affected eye 3 times a day for 7 days. ( 2 Contraindications: Moxifloxacin ophthalmic solution is contraindicated in patients with a history of hypersensitivity to moxifloxacin, to other quinolones, or to any of the components in this medication. . Moxifloxacin ophthalmic solution is contraindicated in patients with a history of hypersensitivity to moxifloxacin, to other quinolones, or to any of the components in this medication. ( 4","source":{"doc":"FDA label via DailyMed: MOXIFLOXACIN OPHTHALMIC SOLUTION (MOXIFLOXACIN) SOLUTION/ DROPS [REDPHARM DRUG]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=4fb55f17-d9db-8148-e063-6394a90a8216"},"see_also":[]},{"id":"drug-mupirocin","kind":"drug","title":"mupirocin","text":"In the IMM kits: Mupirocin (Bactroban) 2%, 22 Gm Tube: ISS 2, Orion 1, lunar lander 0.1. Uses: Mupirocin cream is indicated for the treatment of secondarily infected traumatic skin lesions (up to 10 cm in length or 100 cm 2 in area) due to susceptible isolates of Staphylococcus aureus (S. aureus) and Streptococcus pyogenes (S. pyogenes). Mupirocin cream is an RNA synthetase inhibitor antibacterial indicated for the treatment of secondarily infected traumatic skin lesions (up to 10 cm in length or 100 cm 2 in area) due to susceptible isolates of Staphylococcus aureus and Streptococcus pyogenes . ( (1) Dosage: For Topical Use Only. Apply a small amount of mupirocin cream, with a cotton swab or gauze pad, to the affected area 3 times daily for 10 days. Cover the treated area with gauze dressing if desired. Re-evaluate patients not showing a clinical response within 3 days to 5 days. Mupirocin cream is not for intranasal, ophthalmic or other mucosal use [see Warnings and Precautions ( 5.2 , 5.6 )]. Do not apply mupirocin cream concurrently with any other lotions, creams or ointments [see Clinical Pharmacology ( 12.3 )]. For Topical Use Only. ( 2 ) Apply a small amount of mupirocin cream, with a… Contraindications: Mupirocin cream is contraindicated in patients with known hypersensitivity to mupirocin or any of the excipients of mupirocin cream. Known hypersensitivity to mupirocin or any of the excipients of mupirocin cream. ( 4","source":{"doc":"FDA label via DailyMed: MUPIROCIN CREAM [VIONA PHARMACEUTICALS INC]","url":"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=6db9b0f5-fbdb-4e2c-b8d9-3e949c48b4c9"},"see_also":[]},{"id":"drug-nitroglycerin","kind":"drug","title":"nitroglycerin","text":"In the IMM kits: Nitroglycerin Tablet 0.4Mg: ISS 25, Orion 10, lunar lander 1. Uses: Nitroglycerin sublingual tablets are indicated for the acute relief of an attack or acute prophylaxis of angina pectoris due to coronary artery disease. Nitroglycerin is a nitrate vasodilator indicated for relief of an attack or prophylaxis of angina pectoris due to coronary artery disease. ( 1 Dosage: Administer one tablet under the tongue or in the buccal pouch at the first sign of an acute anginal attack. Allow tablet to dissolve without swallowing. One additional tablet may be administered every 5 minutes until relief is obtained. No more than three tablets are recommended within a 15-minute period. If the pain persists after a total of 3 tablets in a 15-minute period, or if the pain is different than is typically experienced, seek prompt medical attention. Nitroglycerin sublingual tablets may be used prophylactically 5 to 10 minutes prior to engaging in activities that might… Contraindications: Use of phosphodiesterase type 5 (PDE-5) inhibitors, such as avanafil, sildenafil, tadalafil, or vardenafil, or soluble guanylate cyclase (sGC) stimulators. ( 4.1 , 7.1 ) Severe anemia ( 4.2 ) Increased intracranial pressure ( 4.3 ) Hypersensitivity to nitroglycerin sublingual tablets or to other nitrates or nitrites or any excipient ( 4.4 ) Circulatory failure and shock ( 4.5 ) 4.1 PDE-5-Inhibitors and sGC-
