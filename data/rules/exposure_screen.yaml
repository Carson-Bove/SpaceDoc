# Exposure screen, asked after the first message of every consult.
#
# DRAFT, UNREVIEWED. Written by the engineering team as a starting point; the clinical team
# must review the questions. They ask about exposures that are specific to spaceflight and
# easy to miss when a general-purpose model leads the questioning.

items:
  - {id: EXP-EVA, question: "Any spacewalk (EVA), suit run or airlock use in the last few days?"}
  - {id: EXP-RAD, question: "Any radiation alert, solar particle event or dosimeter alarm recently?"}
  - {id: EXP-ATMOS, question: "Any cabin atmosphere alarm (CO2, ammonia, smoke) or unusual smell?"}
  - {id: EXP-PAYLOAD, question: "Any recent work with payloads, experiments, lab animals or chemicals?"}
  - {id: EXP-MEDS, question: "Any new medication or supplement, or a change in food or water?"}
  - {id: EXP-OTHERS, question: "Does anyone else aboard have similar symptoms?"}
