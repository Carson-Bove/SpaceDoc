# Exposure check, added to the end of SpaceDoc's first reply in every consult.
#
# DRAFT, UNREVIEWED. Written by the engineering team as a starting point; the clinical team
# must review the wording. It asks about exposures that are specific to spaceflight and easy
# to miss when a general-purpose model leads the questioning. The user answers in their own
# words; SpaceDoc's must-not-miss rules read the answer.

sentence: >-
  One more thing: has there been a recent spacewalk or suit run, a radiation alert or dosimeter
  alarm, a cabin air alarm or unusual smell, work with payloads, experiments or lab animals, a
  new medication, or anyone else aboard feeling unwell?

# The topics the sentence covers, for reviewers and the consult record.
items:
  - {id: EXP-EVA, topic: spacewalk, suit run or airlock use}
  - {id: EXP-RAD, topic: radiation alert, solar particle event or dosimeter alarm}
  - {id: EXP-ATMOS, topic: cabin atmosphere alarm (CO2, ammonia, smoke) or unusual smell}
  - {id: EXP-PAYLOAD, topic: payloads, experiments, lab animals or chemicals}
  - {id: EXP-MEDS, topic: new medication or supplement, or a change in food or water}
  - {id: EXP-OTHERS, topic: others aboard with similar symptoms}
