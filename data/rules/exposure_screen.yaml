# Exposure check, shown as a card after SpaceDoc's first reply in every consult.
#
# DRAFT, UNREVIEWED. Written by the engineering team as a starting point; the clinical team
# must review the wording. It asks about exposures that are specific to spaceflight and easy
# to miss when a general-purpose model leads the questioning.
#
# Each item is answered with Yes / No / Not sure, or all at once with "None of these".
# - `question` is shown on the card. It is SpaceDoc's wording, so it is never checked for red
#   flags: a "No" to "Any smoke?" can never raise the fire rule.
# - `label` is how the answer is described to the model and in the record.
# - `if_yes` is what a "Yes" or "Not sure" adds to the must-not-miss matching
#   (data/rules/must_not_miss.yaml). A "No" adds nothing.

lead: "One more thing: please answer the exposure check below."

items:
  - id: EXP-EVA
    question: "Any spacewalk (EVA), suit run or airlock use in the last few days?"
    label: spacewalk, suit run or airlock use
    if_yes: "recent spacewalk (EVA), suit run or airlock use"
  - id: EXP-RAD
    question: "Any radiation alert, solar particle event or dosimeter alarm recently?"
    label: radiation alert or dosimeter alarm
    if_yes: "recent radiation alert or dosimeter alarm"
  - id: EXP-ATMOS
    question: "Any cabin air alarm (CO2, ammonia, smoke) or unusual smell?"
    label: cabin air alarm or unusual smell
    if_yes: "cabin atmosphere alarm (CO2, ammonia or smoke) or unusual smell"
  - id: EXP-PAYLOAD
    question: "Any recent work with payloads, experiments, lab animals or chemicals?"
    label: work with payloads, experiments, lab animals or chemicals
    if_yes: "recent work with payloads or experiments"
  - id: EXP-MEDS
    question: "Any new medication or supplement, or a change in food or water?"
    label: new medication, supplement, food or water
    if_yes: "new medication, supplement, food or water"
  - id: EXP-OTHERS
    question: "Does anyone else aboard have similar symptoms?"
    label: others aboard with similar symptoms
    if_yes: "others aboard have similar symptoms"
